// v7 session-persistence helpers.
// Conversations live in bjl_sessions / bjl_session_messages on the
// server; localStorage + the URL mirror the active session id so a
// forced refresh or restored tab repaints instantly, then reconciles
// against the server as the source of truth.
const BJL_INTELLIGENCE_SESSION_LSKEY = "bjl.session.intelligence";
const UUID_RE_FRONTEND = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

function readSessionFromUrl() {
  try {
    const p = new URL(window.location.href).searchParams.get("session");
    return (p && UUID_RE_FRONTEND.test(p)) ? p : null;
  } catch (_) { return null; }
}
function writeSessionToUrl(sessionId) {
  try {
    const url = new URL(window.location.href);
    if (sessionId) url.searchParams.set("session", sessionId);
    else           url.searchParams.delete("session");
    window.history.replaceState({}, "", url.toString());
  } catch (_) { /* non-fatal */ }
}
function readSessionLocal() {
  try {
    const raw = window.localStorage.getItem(BJL_INTELLIGENCE_SESSION_LSKEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !UUID_RE_FRONTEND.test(parsed.session_id || "")) return null;
    return parsed;
  } catch (_) { return null; }
}
function writeSessionLocal(sessionId, turns) {
  try {
    if (!sessionId) {
      window.localStorage.removeItem(BJL_INTELLIGENCE_SESSION_LSKEY);
      return;
    }
    const payload = {
      session_id: sessionId,
      last_seen_seq: 0,    // server reconciliation can update this
      turns: Array.isArray(turns) ? turns : [],
      saved_at: new Date().toISOString(),
    };
    window.localStorage.setItem(BJL_INTELLIGENCE_SESSION_LSKEY, JSON.stringify(payload));
  } catch (_) { /* localStorage may be unavailable in some embed contexts */ }
}

// Convert server message rows (role/content/context/seq) into the
// frontend's `turns` shape (one turn = one user message + the assistant
// reply, plus any meta from context). Pairs adjacent user→assistant
// rows; orphan trailing user message becomes a turn with empty response.
function serverMessagesToTurns(messages) {
  if (!Array.isArray(messages)) return [];
  const out = [];
  let pending = null;
  for (const m of messages) {
    if (!m || !m.role) continue;
    if (m.role === "user") {
      if (pending) out.push(pending);
      pending = {
        prompt: m.content || "",
        response: "",
        triage_brief: null,
        followup_chips: [],
        isClarification: false,
      };
    } else if (m.role === "assistant" && pending) {
      const ctx = m.context || {};
      pending.response       = m.content || "";
      pending.triage_brief   = ctx.triage_brief || null;
      pending.followup_chips = Array.isArray(ctx.followup_chips) ? ctx.followup_chips : [];
      pending.isClarification = ctx.kind === "clarification";
      out.push(pending);
      pending = null;
    }
  }
  if (pending) out.push(pending);
  return out;
}

const IntelligenceMode = ({
  setEvidenceRows,
  strategistContext,
  setStrategistContext,
  // Projects state hoisted to App on 2026-07-23 so a fresh page load
  // populates the dropdown even when the Intelligence pane happens to
  // mount before auth is ready.
  projects,
  activeProjectId,
  selectProject,
  refreshProjects,
  projectCards,
  projectCardsLoading,
  refreshProjectCards,
  setProjects,
}) => {
  const [intent, setIntent] = useState(null); // null means no chip selected
  const [prompt, setPrompt] = useState("");
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState(null);
  const [error, setError] = useState(null);

  // Live investigation notes, appended as the investigator emits them.
  // Cleared when a new query starts; fades out when synthesis begins.
  const [notes, setNotes] = useState([]);

  // Conversation history. Preserved across follow-ups.
  const [turns, setTurns] = useState([]);

  // v7: active session id, plus the recent-sessions dropdown state.
  const [sessionId, setSessionId] = useState(null);
  const [recentSessions, setRecentSessions] = useState([]);
  const [recentMenuOpen, setRecentMenuOpen] = useState(false);

  // Move 2 UI-local state (projects/activeProjectId/cards themselves live
  // at App level and are passed in as props).
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [showCreateProject, setShowCreateProject] = useState(false);

  const activeProject = (projects || []).find(p => p.id === activeProjectId) || null;
  const cardsLoading = !!projectCardsLoading;
  const refreshCards = refreshProjectCards;

  // Seed-a-query handoff from ProjectsMode. When the strategist clicks
  // "Take me to Intelligence" with selected saved cards, we land here
  // with strategistContext already populated (by the setter) and a
  // pending prompt sitting in localStorage. Read it once, populate the
  // prompt input, and clear the key so a subsequent mount doesn't
  // repopulate.
  useEffect(() => {
    try {
      const pending = localStorage.getItem('bjl_pending_seed_prompt_v1');
      if (pending && pending.trim()) {
        setPrompt(pending);
        localStorage.removeItem('bjl_pending_seed_prompt_v1');
      }
    } catch (_) { /* soft-fail */ }
  }, []);

  // v7 mount-time restore. Priority: URL > localStorage > server most-
  // recent > fresh. The localStorage path repaints instantly so the
  // strategist doesn't see a flash of empty state; the server fetch
  // happens in parallel and overwrites once it lands (server wins).
  useEffect(() => {
    let cancelled = false;
    (async () => {
      // 1. Instant repaint from localStorage if it matches the URL,
      //    OR if the URL has no session (use whatever's local).
      const urlSession = readSessionFromUrl();
      const localCache = readSessionLocal();
      const targetSession = urlSession
        || (localCache && localCache.session_id)
        || null;

      if (localCache && (!urlSession || localCache.session_id === urlSession)) {
        if (Array.isArray(localCache.turns) && localCache.turns.length > 0) {
          setTurns(localCache.turns);
          setSessionId(localCache.session_id);
        }
      }

      // 2. Reconcile against the server ONLY when we have a specific
      //    session to load (URL param or a local cache). We used to
      //    fall through to "adopt the user's most-recent server-side
      //    session" here, but that made New Session and fresh reloads
      //    silently re-inflate the prior conversation. If a user wants
      //    to resume a prior session, they can pick it from the Recent
      //    dropdown; URL sharing still works via the ?session= param.
      try {
        if (targetSession) {
          const r = await fetch("/.netlify/functions/bjl-sessions-load?session_id=" + encodeURIComponent(targetSession),
                                authedFetchInit());
          if (cancelled) return;
          if (r.ok) {
            const j = await r.json();
            const serverTurns = serverMessagesToTurns(j.messages);
            // Merge server turns with local: the server session log
            // stores role/content/context per message but does NOT
            // persist the per-turn blocks[] / structured / job_id fields
            // the frontend needs to render the Save-to-project affordance.
            // Without this merge, every pane switch (which remounts
            // IntelligenceMode) would overwrite localStorage-restored
            // blocks with blockless server turns, and the strategist
            // would lose the "Insights to save" section after leaving
            // and returning to the pane.
            const localTurnsById = new Map();
            if (localCache && Array.isArray(localCache.turns)) {
              for (const lt of localCache.turns) {
                if (lt && typeof lt.prompt === 'string') {
                  localTurnsById.set(lt.prompt.trim(), lt);
                }
              }
            }
            const merged = serverTurns.map(st => {
              const key = typeof st.prompt === 'string' ? st.prompt.trim() : '';
              const lt = key ? localTurnsById.get(key) : null;
              if (!lt) return st;
              return {
                ...st,
                blocks:            (Array.isArray(lt.blocks) && lt.blocks.length > 0) ? lt.blocks : (st.blocks || null),
                structured:        lt.structured || st.structured || null,
                job_id:            lt.job_id || st.job_id || null,
                investigationMeta: lt.investigationMeta || st.investigationMeta || null,
              };
            });
            setSessionId(j.session.id);
            setTurns(merged);
            writeSessionToUrl(j.session.id);
            writeSessionLocal(j.session.id, merged);
          } else if (r.status === 404) {
            // Session in URL/localStorage doesn't belong to this user
            // (or was deleted). Stay on fresh state; don't auto-adopt.
            writeSessionToUrl(null);
            writeSessionLocal(null, []);
          }
        }
        // No targetSession → fresh state stays fresh. Prior behavior
        // called tryAdoptMostRecent() here; removed intentionally.
      } catch (_) { /* non-fatal — UI just stays on fresh / cached */ }
    })();
    return () => { cancelled = true; };
  }, []);

  // v7: refresh the Recent dropdown whenever it opens.
  useEffect(() => {
    if (!recentMenuOpen) return;
    let cancelled = false;
    (async () => {
      try {
        const r = await fetch("/.netlify/functions/bjl-sessions-list?limit=15", authedFetchInit());
        if (!r.ok || cancelled) return;
        const j = await r.json();
        setRecentSessions(Array.isArray(j.sessions) ? j.sessions : []);
      } catch (_) { /* non-fatal */ }
    })();
    return () => { cancelled = true; };
  }, [recentMenuOpen]);

  // v7: mirror the live turns + sessionId to localStorage on every
  // change so a refresh repaints instantly.
  useEffect(() => {
    writeSessionLocal(sessionId, turns);
  }, [sessionId, turns]);

  const loadSession = useCallback(async (id) => {
    if (!id || !UUID_RE_FRONTEND.test(id)) return;
    setRecentMenuOpen(false);
    try {
      const r = await fetch("/.netlify/functions/bjl-sessions-load?session_id=" + encodeURIComponent(id),
                            authedFetchInit());
      if (!r.ok) return;
      const j = await r.json();
      const t = serverMessagesToTurns(j.messages);
      setSessionId(j.session.id);
      setTurns(t);
      setCurrentPrompt("");
      setCurrentStream("");
      setError(null);
      setEvidenceRows([]);
      setNotes([]);
      writeSessionToUrl(j.session.id);
      writeSessionLocal(j.session.id, t);
    } catch (_) { /* non-fatal */ }
  }, [setEvidenceRows]);
  const [currentPrompt, setCurrentPrompt] = useState("");
  const [currentStream, setCurrentStream] = useState("");
  const [currentIsFollowup, setCurrentIsFollowup] = useState(false);

  // printedAt drives the timestamp on PrintHeader. Set by the Export PDF
  // button right before window.print() so the printed doc shows when the
  // user actually exported, not when the component last re-rendered.
  const [printedAt, setPrintedAt] = useState(null);
  const exportPdf = useCallback(() => {
    setPrintedAt(new Date());
    // Wait one tick so React commits the new printedAt prop into the
    // PrintHeader DOM before the browser's print snapshot is taken.
    setTimeout(() => window.print(), 0);
  }, []);

  const [followupText, setFollowupText] = useState("");

  const toggleChip = useCallback((k) => {
    setIntent(prev => prev === k ? null : k);
  }, []);

  const runQuery = useCallback(async (promptText, isFollowup = false) => {
    if (!promptText.trim() || running) return;

    const prevTurns = isFollowup ? turns : [];

    setRunning(true);
    setPhase("investigating");
    setError(null);
    setEvidenceRows([]);
    setNotes([]);
    if (!isFollowup) setTurns([]);
    setCurrentPrompt(promptText.trim());
    setCurrentStream("");
    setCurrentIsFollowup(isFollowup);

    // Build prior_conversation_context for triage. Last 3-5 turns. For each
    // assistant turn, send a SUMMARY (200-400 chars) plus the triage_brief
    // it produced, so triage can recognize follow-ups vs new questions.
    // Clarification turns get an explicit flag so triage knows the assistant
    // asked a clarifying question and the user's next message is the answer
    // (not a brand new question to be triaged from scratch).
    const buildPriorConversationContext = (history) => {
      const recent = (Array.isArray(history) ? history : []).slice(-5);
      const ctx = [];
      for (const t of recent) {
        if (t && t.prompt) {
          ctx.push({ role: "user", content: String(t.prompt) });
        }
        if (t && t.response) {
          const resp = String(t.response).trim();
          const summary = resp.length > 400 ? resp.slice(0, 380) + "…" : resp;
          const turn = {
            role: "assistant",
            content_summary: summary,
            triage_brief_summary: t.triage_brief
              ? {
                  the_question: t.triage_brief.the_question || null,
                  investigation_depth: t.triage_brief.investigation_depth || null,
                  needs_clarification: !!t.triage_brief.needs_clarification,
                }
              : null,
          };
          if (t.isClarification) {
            turn.was_clarification_request = true;
          }
          ctx.push(turn);
        }
      }
      return ctx.length ? ctx : null;
    };

    const priorContext = isFollowup ? buildPriorConversationContext(prevTurns) : null;

    await investigateQuery({
      question: promptText.trim(),
      intent: intent || null,
      strategistContext: strategistContext || null,
      priorConversationContext: priorContext,
      // v7: pass the active session id (null on a fresh conversation;
      // the server creates a session and returns its id in onDone.session_id).
      sessionId: sessionId,
      onStatus: ({ phase }) => setPhase(phase),
      onNote: ({ note }) => setNotes(prev => [...prev, note]),
      onEvidence: ({ rows }) => setEvidenceRows(rows || []),
      onChunk: (text) => setCurrentStream(prev => prev + text),
      onDone: (info) => {
        setRunning(false);
        setPhase(null);
        // v7: server resolved or created a session. Mirror it to URL +
        // localStorage so a refresh repaints the same conversation. We
        // do this once per turn rather than every keystroke.
        if (info && info.session_id) {
          setSessionId(prev => {
            if (prev !== info.session_id) {
              writeSessionToUrl(info.session_id);
            }
            return info.session_id;
          });
        }
        // Clarification bypass: render the clarifying question as the
        // assistant's response for this turn. No follow-up chips on this
        // state — the user types a clarifying answer in the input box.
        if (info && info.clarification_needed) {
          setCurrentStream("");
          setTurns(prev => [...prev, {
            prompt: promptText.trim(),
            response: info.clarifying_question || "(clarification requested)",
            triage_brief: info.triage_brief || null,
            followup_chips: [],
            isClarification: true,
            isFollowup,
          }]);
          setCurrentPrompt("");
          return;
        }
        setCurrentStream(finalStream => {
          const scratchArr = (info && info.investigation && Array.isArray(info.investigation.scratch))
            ? info.investigation.scratch : null;
          const structured = extractStructuredSynth(scratchArr);
          setTurns(prev => [...prev, {
            prompt: promptText.trim(),
            response: finalStream,
            investigationMeta: info || null,
            triage_brief: (info && info.triage_brief) || null,
            followup_chips: (info && Array.isArray(info.followup_chips)) ? info.followup_chips : [],
            blocks: (structured && Array.isArray(structured.blocks) && structured.blocks.length > 0)
              ? structured.blocks : null,
            structured: structured || null,
            job_id: (info && info.job_id) || null,
            isFollowup,
          }]);
          return "";
        });
        setCurrentPrompt("");
      },
      onError: ({ message, phase }) => {
        setError(`${phase || "error"}: ${message}`);
        setRunning(false);
        setPhase(null);
        setCurrentPrompt("");
        setCurrentStream("");
      },
    });
  }, [intent, strategistContext, running, turns, sessionId, setEvidenceRows]);

  const run = useCallback(() => runQuery(prompt, false), [runQuery, prompt]);
  const runFollowup = useCallback(() => {
    if (!followupText.trim()) return;
    const text = followupText;
    setFollowupText("");
    runQuery(text, true);
  }, [followupText, runQuery]);

  const clearConversation = useCallback(() => {
    // Hard reset via full page navigation to a clean URL. The prior
    // soft-reset (setTurns([]) + writeSessionLocal(null, []) + ...) was
    // reliable in isolation but did not survive real-world edge cases —
    // a stale HTML/JS cache, an in-flight fetch that resolved after the
    // wipe and re-mirrored the prior turns, or a service-worker-style
    // intermediary — could all leak the prior conversation back in.
    // Navigating to a clean URL kills every path: the React tree is
    // discarded, all timers and closures are gone, and the mount effect
    // runs on a truly fresh page with an empty URL and empty
    // localStorage.
    try {
      window.localStorage.removeItem(BJL_INTELLIGENCE_SESSION_LSKEY);
    } catch (_) { /* localStorage may be unavailable in some embed contexts */ }
    const cleanUrl = window.location.origin + window.location.pathname;
    window.location.replace(cleanUrl);
  }, []);

  // The v6.1 auto-extract-publishable-candidates effect was removed with
  // the Projects redesign. Insights now save to project collections via
  // the BlockView Save-to-project button, not to a public corpus staging
  // pile. The bjl-extract-public-candidates endpoint remains callable but
  // no code in the Intelligence pane pings it.

  const copyConversation = useCallback(() => {
    const all = turns.map((t, i) =>
      `Q${i + 1}${t.isFollowup ? " (follow-up)" : ""}: ${t.prompt}\n\n${t.response.trim()}`
    ).join("\n\n---\n\n");
    navigator.clipboard.writeText(all);
  }, [turns]);

  const lastTurn = turns[turns.length - 1];
  const investigationMeta = lastTurn?.investigationMeta || null;
  const docOpen = running || turns.length > 0 || error;
  const showNotes = running && phase !== "synthesizing" && notes.length > 0;

  return (
    <div className="canvas">
      <div className="brief-scroll">
        <div style={{display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 22}}>
          <div>
            <div className="eyebrow" style={{marginBottom: 6}}>Intelligence engine</div>
            <div className="display" style={{fontSize: 48, letterSpacing: "-0.01em"}}>Ask the Lab.</div>
            <div style={{marginTop: 8, color: "var(--grey-2)", maxWidth: "52ch", fontSize: 14}}>
              {INTEL_WELCOME}
            </div>
          </div>
          <div style={{display: "flex", flexDirection: "column", gap: 8, alignItems: "flex-end"}}>
            <div className="intel-project-row" style={{display: "flex", gap: 8, alignItems: "center"}}>
              <ProjectSelector
                projects={projects}
                activeProjectId={activeProjectId}
                onSelect={selectProject}
                onOpenCreate={() => setShowCreateProject(true)}
              />
              <button type="button" className="btn ghost intel-saved-toggle"
                onClick={() => setDrawerOpen(o => !o)}
                title={activeProject ? `Show saved cards for ${activeProject.name}` : 'Pick a project to see saved cards'}
                disabled={!activeProjectId}>
                Saved <span className="saved-count-badge">{projectCards.length}</span>
              </button>
            </div>
            <div className="mono" style={{color: "var(--grey-2)", textAlign: "right"}}>
              session · {new Date().toISOString().slice(0,10)}<br/>
              v2 · investigator
            </div>
          </div>
        </div>

        <div className="commission">
          <div className="commission-head">
            <div className="step">Ask the Lab</div>
          </div>
          <div className="intent-chips" style={{display: "flex", flexWrap: "wrap", gap: 8, padding: "12px 16px"}}>
            {INTEL_CHIPS.map(c => (
              <button key={c.k} type="button"
                className={`chip ${c.tag} ${intent === c.k ? "active" : ""}`}
                aria-pressed={intent === c.k}
                onClick={() => toggleChip(c.k)}
                style={{
                  padding: "6px 14px",
                  borderRadius: 999,
                  border: "1px solid var(--grey-1)",
                  background: intent === c.k ? "var(--accent)" : "transparent",
                  color: intent === c.k ? "var(--bg)" : "var(--grey-2)",
                  fontSize: 12,
                  letterSpacing: 0.2,
                  cursor: "pointer",
                  transition: "all .15s ease",
                }}>
                {c.label}
              </button>
            ))}
          </div>
          <div className="commission-body">
            <textarea className="commission-prompt" rows={3}
              value={prompt} onChange={e => setPrompt(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); } }}
              placeholder="Ask anything. Brand, audience, category, angle."
            />
            <div className="aux fade-in">
              <div className="aux-cell">
                <div className="aux-label">
                  <span>Strategist context</span>
                  <span style={{color: "var(--grey-1)"}}>optional</span>
                </div>
                <textarea
                  placeholder="Internal context the lab should factor in — known pitches, client relationships, past work."
                  value={strategistContext}
                  onChange={e => setStrategistContext(e.target.value)}
                />
              </div>
            </div>
          </div>
          <div className="commission-foot">
            <div className="meta">
              <span><b>Investigator</b> Sonnet</span>
              <span><b>Synthesis</b> Opus</span>
              <span><b>Est.</b> 12-25s</span>
            </div>
            <div style={{display: "flex", gap: 8}}>
              <button className="btn primary" onClick={run} disabled={running || !prompt.trim()}>
                {running ? "Digging…" : "Go"}
              </button>
            </div>
          </div>
        </div>

        {docOpen ? (
          <article className="intel-doc-shell fade-in">
            {/* Print-only document header. Hidden on screen via CSS;
                promoted to display:block inside @media print. Reads
                turns + printedAt to fill in title/timestamp at print time. */}
            <PrintHeader turns={turns} printedAt={printedAt} />
            <div className="doc-head">
              <div className="doc-meta">
                <span><b>Tag</b> {intent ? INTEL_CHIPS.find(c => c.k === intent).label : "none"}</span>
                <span><b>Investigation</b> {investigationMeta
                  ? `${investigationMeta.queryBudgetUsed || 0} queries${investigationMeta.stoppedEarly ? " · stopped at budget" : ""}`
                  : running ? "running…" : "—"}</span>
              </div>
              <div className="doc-actions">
                {/* v7 — Recent sessions pill + dropdown. Click opens
                    a small menu listing the signed-in user's last 15
                    active sessions; click a row to load it. */}
                <div className="bjl-recent-wrap" style={{position: "relative"}}>
                  <button
                    type="button"
                    className="btn ghost"
                    title="Recent conversations"
                    onClick={() => setRecentMenuOpen(v => !v)}
                    disabled={running}
                  >Recent</button>
                  {recentMenuOpen && (
                    <div className="bjl-recent-menu" onMouseLeave={() => setRecentMenuOpen(false)}>
                      {recentSessions.length === 0
                        ? <div className="bjl-recent-empty">No recent conversations yet.</div>
                        : recentSessions.map(s => (
                            <button
                              key={s.id}
                              type="button"
                              className={"bjl-recent-row" + (s.id === sessionId ? " is-active" : "")}
                              onClick={() => loadSession(s.id)}
                            >
                              <span className="bjl-recent-title">{s.title || "(untitled conversation)"}</span>
                              <span className="bjl-recent-time">{_bjlRelativeTime(s.last_active_at)}</span>
                            </button>
                          ))}
                    </div>
                  )}
                </div>
                <button className="icon-btn" title="New conversation" onClick={clearConversation} disabled={running || turns.length === 0}><Icon name="regen" /></button>
                <button className="icon-btn" title="Copy full conversation" onClick={copyConversation} disabled={turns.length === 0}><Icon name="copy" /></button>
                <button className="btn ghost" onClick={exportPdf} disabled={turns.length === 0}><Icon name="download" size={12} /> Export PDF</button>
              </div>
            </div>
            {error && <div className="phase-pill err"><span className="dot" /> {error}</div>}
            {running && <div className="phase-pill curiosity"><span className="dot" /> {LOADING_CURIOSITY}{phase ? ` · ${PHASE_LABEL[phase] || phase}` : ""}</div>}

            {showNotes && (
              <div className="investigation-notes fade-in" style={{
                padding: "12px 16px",
                borderLeft: "2px solid var(--grey-1)",
                margin: "8px 0 20px",
                color: "var(--grey-2)",
                fontSize: 13,
                fontFamily: "var(--mono, monospace)",
              }}>
                {notes.map((n, i) => (
                  <div key={i} style={{marginBottom: 4, opacity: i === notes.length - 1 ? 1 : 0.6}}>
                    {i === notes.length - 1 ? "› " : "  "}{n}
                  </div>
                ))}
              </div>
            )}

            {turns.map((t, i) => {
              const isLastCompleted = i === turns.length - 1 && !running;
              const chips = (t.followup_chips || []).filter(c => typeof c === "string" && c.trim());
              return (
                <div key={i} className={"turn" + (t.isClarification ? " turn-clarification" : "")}>
                  <div className="turn-head">
                    <span className="turn-idx">Q{i + 1}{t.isFollowup ? " · follow-up" : ""}{t.isClarification ? " · clarification needed" : ""}</span>
                    <span className="turn-prompt">{t.prompt}</span>
                  </div>
                  {t.isClarification && (
                    <div className="clarification-hint">
                      The lab needs a bit more from you before investigating. Type your answer below to continue.
                    </div>
                  )}
                  {/* Prose narrative is the primary reading experience —
                      response_text is a rendered form of the blocks (per
                      synth prompt contract), so the strategist gets the
                      summary they'd expect. Blocks appear below as a
                      save-to-project affordance so the strategist can lift
                      individual findings into the active project. */}
                  <div className="stream-doc">
                    {renderMarkdown(t.response)}
                  </div>
                  {Array.isArray(t.blocks) && t.blocks.length > 0 && (
                    <div className="blocks-container">
                      <div className="blocks-container-label">Insights to save</div>
                      {t.blocks.map((block, bi) => (
                        <BlockView
                          key={bi}
                          block={block}
                          blockIndex={bi}
                          structured={t.structured || null}
                          jobId={t.job_id || null}
                          question={t.prompt || null}
                          activeProjectId={activeProjectId}
                          projects={projects}
                          onSaved={() => refreshCards(activeProjectId)}
                          onNeedProject={() => setShowCreateProject(true)}
                        />
                      ))}
                    </div>
                  )}
                  {/* PublicCandidatesPanel removed with the Projects redesign.
                      Insights save via BlockView above, targeted at the active
                      project rather than the public corpus staging pile. */}
                  {/* Triage-provided followup chips. Only on the last turn so the
                      conversation feed stays clean. Clicking a chip submits it
                      as the next follow-up question. */}
                  {isLastCompleted && chips.length > 0 && (
                    <div className="followup-chips fade-in">
                      {chips.slice(0, 3).map((chip, ci) => (
                        <button key={ci} type="button"
                          className="followup-chip"
                          onClick={() => runQuery(chip, true)}
                          disabled={running}>
                          {chip}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}

            {running && currentPrompt && (
              <div className="turn turn-active">
                <div className="turn-head">
                  <span className="turn-idx">Q{turns.length + 1}{currentIsFollowup ? " · follow-up" : ""}</span>
                  <span className="turn-prompt">{currentPrompt}</span>
                </div>
                <div className="stream-doc">
                  {renderMarkdown(currentStream)}
                  <span className="streaming-cursor" />
                </div>
              </div>
            )}

            {!running && turns.length > 0 && !error && (() => {
              const lastTurn = turns[turns.length - 1];
              const hasTriageChips = lastTurn && Array.isArray(lastTurn.followup_chips) && lastTurn.followup_chips.length > 0;
              return (
                <div className="followup fade-in">
                  <div className="followup-label">Stay curious. Ask a follow-up.</div>
                  {/* Static suggestion pills hidden when triage provided chips
                      above, since those are contextual and stronger. The typed-
                      follow-up input below is always available either way. */}
                  {!hasTriageChips && (
                    <div className="followup-pills">
                      {FOLLOWUP_SUGGESTIONS.map(s => (
                        <button key={s} className="followup-pill" type="button"
                          onClick={() => setFollowupText(s)}>
                          {s}
                        </button>
                      ))}
                    </div>
                  )}
                  <div className="followup-row">
                    <input type="text" className="followup-input"
                      value={followupText}
                      onChange={(e) => setFollowupText(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); runFollowup(); } }}
                      placeholder="Ask a follow-up…" />
                    <button className="btn primary" onClick={runFollowup}
                      disabled={!followupText.trim()}>Go</button>
                  </div>
                </div>
              );
            })()}
          </article>
        ) : (
          <div className="doc-placeholder">Output appears here after you ask the Lab a question.</div>
        )}
      </div>
      <CreateProjectModal
        isOpen={showCreateProject}
        onClose={() => setShowCreateProject(false)}
        onCreated={(p) => {
          setShowCreateProject(false);
          setProjects(prev => [p, ...prev.filter(x => x.id !== p.id)]);
          selectProject(p.id);
        }}
      />
      <SavedCardsDrawer
        isOpen={drawerOpen}
        onClose={() => setDrawerOpen(false)}
        project={activeProject}
        cards={projectCards}
        loading={cardsLoading}
        onRemove={(id) => setProjectCards(prev => prev.filter(c => c.id !== id))}
        onReload={() => refreshCards(activeProjectId)}
      />
    </div>
  );
};

const normalizeContact = (c) => {
  if (!c) return null;
  if (typeof c === "string") return { name: c, role: "", email: "" };
  return { name: c.name || c.full_name || "", role: c.role || c.title || "", email: c.email || "", seniority: c.seniority || "" };
};

const contactSignalLabel = (account, contactName) => {
  const mapping = account?.contact_signal_mapping;
  if (!mapping || !contactName) return null;
  if (Array.isArray(mapping)) {
    const hit = mapping.find(m => (m.contact || m.name) === contactName);
    if (hit) return hit.signal_ref || hit.signal || "signal";
  } else if (typeof mapping === "object") {
    const hit = mapping[contactName];
    if (hit) return typeof hit === "string" ? hit : (hit.signal_ref || hit.signal || "signal");
  }
  return null;
};

const OutreachMode = ({ setEvidenceRows, strategistContext, setStrategistContext }) => {
  const [account, setAccount] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [emailInstructions, setEmailInstructions] = useState("");
  const [generating, setGenerating] = useState(false);
  const [genPhase, setGenPhase] = useState("");
  const [results, setResults] = useState([]); // { contact, text, error }
  const [genProgress, setGenProgress] = useState(0);
  const [bjlPullStatus, setBjlPullStatus] = useState("idle"); // idle | loading | ready | error
  const [uploadError, setUploadError] = useState(null);
  const fileInputRef = useRef(null);

  const contacts = (account?.contacts || []).map(normalizeContact).filter(Boolean);
  const contactKey = (c) => c.email || c.name;

  const loadFile = async (file) => {
    setUploadError(null);
    try {
      const text = await file.text();
      const parsed = parseWaldoJSON(text);
      if (!parsed.accounts.length) throw new Error("No accounts in file");
      // Single-account mode: take the first
      const a = parsed.accounts[0];
      setAccount(a);
      setSelected(new Set());
      setResults([]);
    } catch (e) { setUploadError(e.message); }
  };

  const onDrop = (e) => {
    e.preventDefault();
    const f = e.dataTransfer?.files?.[0];
    if (f) loadFile(f);
  };

  const toggle = (k) => {
    const n = new Set(selected);
    if (n.has(k)) n.delete(k); else n.add(k);
    setSelected(n);
  };

  const generate = async () => {
    if (!account || selected.size === 0) return;
    setGenerating(true);
    setResults([]);
    setGenProgress(0);
    // Waldo context is built per contact below so the primary hook can vary
    // by role and avoid repeats across the batch.

    // Brief-signal check (must mirror the regex in generateOneEmail) — if
    // the brief asks for BJL data, pre-pull one corpus-wide finding via
    // the investigator pipeline and cache it for all contacts at this
    // account. queryBJL polls bjl-query-status itself; we wait for the
    // single one-sentence result here (10-30s typical).
    const briefLowerOuter = (emailInstructions || "").toLowerCase();
    const wantsBJLOuter = /\bbjl\b|\bresearch\b|\bdata\b|\binsight\b|\bstat\b|\bfinding\b|\bconsumer\b|\btraveler\b|\bfan\b/i.test(briefLowerOuter);
    let bjlInsight = "";
    if (wantsBJLOuter) {
      setBjlPullStatus("loading");
      const tension = account.creative_tension || account.top_signal?.why_it_matters || "";
      const pullQuery = [
        `Pull one BJL finding for outreach to ${account.company || account.name}`,
        account.category ? `(${account.category})` : "",
        tension ? `. Strategic tension: ${tension}` : "",
      ].filter(Boolean).join(" ").trim();
      let streamed = "";
      let pullOk = false;
      let pullErr = null;
      try {
        await queryBJL({
          query: pullQuery,
          intentHint: "email_findings",
          emailMode: true,
          strategistContext: strategistContext || undefined,
          waldoContext: account,
          onChunk: (t) => { streamed += t; },
          onDone: () => { pullOk = true; },
          onError: ({ message }) => { pullErr = message; },
        });
      } catch (e) {
        pullErr = e.message;
      }
      bjlInsight = pullOk ? streamed.trim() : "";
      setBjlPullStatus(pullOk ? "ready" : "error");
      if (!pullOk) console.warn("[bjl-orch] pre-pull failed:", pullErr);
    } else {
      setBjlPullStatus("idle");
    }

    const out = [];
    const selList = contacts.filter(c => selected.has(contactKey(c)));
    const usedSignals = new Set();
    for (let i = 0; i < selList.length; i++) {
      const c = selList[i];
      const chosen = pickSignalForContact(account, c.role, usedSignals);
      if (chosen) usedSignals.add(chosen.origin);
      const waldoCtxPerContact = buildWaldoSystemContext(account, { primarySignal: chosen });
      console.log(
        "[waldo-rotation]",
        (account.company || account.name) + " →",
        c.name + " (" + (c.role || "no role") + ")",
        "signal:",
        chosen?.sig?.signal_type || "none",
        "—",
        String(chosen?.sig?.headline || "").slice(0, 80)
      );
      const { text, error, polished, sources, scorecard, revisionHistory, humanReviewRequired, prospectContext } = await generateOneEmail({
        contactName: c.name,
        company: account.company || account.name,
        waldoContext: waldoCtxPerContact,
        userStrategistContext: strategistContext,
        userEmailInstructions: emailInstructions,
        audienceModeValue: "external",
        waldoAccount: account,
        prospectCategory: account.category || null,
        batchIndex: i,
        priorSameCompany: i > 0,
        bjlInsights: bjlInsight,
        onPhase: (p) => setGenPhase(p),
      });
      out.push({
        contact: c, text, error, polished, sources, scorecard, revisionHistory, humanReviewRequired,
        brief: emailInstructions,
        // Retrieval signal captured for the approved-email corpus write.
        prospectContext,
        company: account.company || account.name,
        audienceMode: "external",
        waldoSignalType: chosen?.sig?.signal_type || null,
        dismissed: false,
        approved: false,
        approvedAt: null,
        // Snapshot once. Subsequent Fix / edit actions update `text`;
        // originalGenerated stays as the raw pipeline output for diff /
        // corpus capture purposes.
        originalGenerated: text,
      });
      setResults([...out]);
      setGenProgress(i + 1);
      setGenPhase("");
      if (i < selList.length - 1) await new Promise(r => setTimeout(r, 5000));
    }
    setGenPhase("");
    setGenerating(false);
  };

  // Interactive review: callback the EmailSources panel uses to commit
  // edits (Fix one / Fix all / Dismiss) back into results state.
  const updateResult = (index, updater) => {
    setResults(prev => prev.map((r, i) => (i === index ? updater(r) : r)));
  };

  const exportCSV = () => {
    const rows = [["Contact", "Role", "Email", "Subject", "Body", "Error"]];
    results.forEach(({ contact, text, error }) => {
      const { subject, body } = parseSubjectBody(text || "");
      rows.push([contact.name, contact.role || "", contact.email || "", subject, body, error || ""]);
    });
    const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `outreach_${(account?.company || "account").replace(/\W+/g, "_")}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="outreach-layout">
      <aside className="panel">
        <div className="panel-head">
          <div className="title">Account</div>
          <div className="meta">Waldo · single</div>
        </div>
        <div className="panel-body">
          <div className="waldo-drop"
            onClick={() => fileInputRef.current?.click()}
            onDragOver={(e) => e.preventDefault()}
            onDrop={onDrop}>
            <div className="big">{account ? "Load new file" : "Load Waldo file"}</div>
            <div className="sub">.json · drop or click</div>
          </div>
          <input ref={fileInputRef} type="file" accept=".json" style={{display: "none"}}
            onChange={(e) => e.target.files?.[0] && loadFile(e.target.files[0])} />
          {uploadError && <div style={{margin: "0 16px 10px", color: "var(--red)", fontSize: 12}}>{uploadError}</div>}

          {account && <AccountCard account={account} />}

          {account && contacts.length > 0 && (
            <>
              <div style={{padding: "8px 16px 6px"}}>
                <div style={{display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "8px 10px 6px"}}>
                  <div className="eyebrow">Contacts</div>
                  <div className="mono" style={{color: "var(--grey-2)"}}>{selected.size} of {contacts.length}</div>
                </div>
              </div>
              <div className="contact-list">
                {contacts.map(c => {
                  const k = contactKey(c);
                  const sel = selected.has(k);
                  const badge = contactSignalLabel(account, c.name);
                  return (
                    <div key={k} className="contact" aria-selected={sel} onClick={() => toggle(k)}>
                      <div className="check">
                        {sel && (
                          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                            <path d="M2 6l3 3 5-6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                          </svg>
                        )}
                      </div>
                      <div className="who">
                        <div className="name">{c.name}{badge && <span className="sig-badge">→ {badge}</span>}</div>
                        <div className="role">{[c.role, c.seniority].filter(Boolean).join(" · ") || c.email}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      </aside>

      <div className="email-canvas">
        <div className="email-wrap">
          <div className="email-header">
            <div>
              <div className="eyebrow" style={{marginBottom: 6}}>Outreach · single-account</div>
              <div className="title">
                {account ? <>{(account.company || account.name).split(" ").slice(0, 3).join(" ")} <span style={{color: "var(--accent)"}}>/</span> {selected.size} emails</> : <>No account loaded</>}
              </div>
            </div>
            <div className="meta">
              run · {new Date().toISOString().slice(0,16).replace("T", " ")}<br/>
              sonnet · /api/claude
            </div>
          </div>

          {!account && (
            <div style={{padding: "48px 24px", textAlign: "center", border: "1px dashed var(--hairline-strong)", borderRadius: 2}}>
              <div className="eyebrow" style={{marginBottom: 8}}>Ready</div>
              <div style={{fontSize: 14, color: "var(--grey-2)"}}>Load a single-account Waldo file to begin.</div>
            </div>
          )}

          {account && (
            <>
              <div className="aux fade-in" style={{marginBottom: 18}}>
                <div className="aux-cell">
                  <div className="aux-label">
                    <span>Strategist context</span>
                    <span style={{color: "var(--grey-1)"}}>client names, credentials</span>
                  </div>
                  <textarea value={strategistContext} onChange={e => setStrategistContext(e.target.value)}
                    placeholder="Paste exact client names, credentials, past work references. Only names appearing here can be used in emails." />
                </div>
                <div className="aux-cell">
                  <div className="aux-label">
                    <span>Email instructions</span>
                    <span style={{color: "var(--grey-1)"}}>applied to every draft</span>
                  </div>
                  <textarea value={emailInstructions} onChange={e => setEmailInstructions(e.target.value)}
                    placeholder="Write your brief here. Describe the email type, what to include, and how to close. Reference an article, case study, or research and the tool will find the best match." />
                </div>
              </div>

              <div style={{display: "flex", gap: 8, marginBottom: 18, alignItems: "center"}}>
                <button className="btn primary" onClick={generate}
                  disabled={selected.size === 0 || generating}>
                  <Icon name="sparkle" size={12} />
                  {generating
                    ? `Generating ${genProgress}/${selected.size}${genPhase ? ` (${genPhase.charAt(0).toUpperCase() + genPhase.slice(1)}…)` : "…"}`
                    : `Generate ${selected.size} emails`}
                </button>
                {generating && bjlPullStatus === "loading" && (
                  <span style={{fontSize: 12, color: "var(--grey-2)"}}>
                    Gathering BJL insights…
                  </span>
                )}
                {generating && bjlPullStatus === "error" && (
                  <span style={{fontSize: 12, color: "var(--red, #b00)"}}>
                    BJL pull failed — emails will generate without the [BJL FINDING] block.
                  </span>
                )}
                {results.length > 0 && !generating && (
                  <button className="btn ghost" onClick={exportCSV}>
                    <Icon name="download" size={12} /> Export CSV
                  </button>
                )}
              </div>

              {results.length > 0 && (
                <div className="stagger">
                  {results.map((r, i) => <OutreachEmailCard
                    key={i}
                    result={r}
                    index={i}
                    onUpdate={(updater) => updateResult(i, updater)}
                  />)}
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
};

// EmailSources — data provenance panel rendered under each draft. Lets the
// strategist spot-check what /api/bjl-content actually pulled before
// sending. Not a validation gate; collapsed by default. Only renders
// sections for the content types that fired and returned data.
const EmailSources = ({
  sources, polished = false,
  scorecard = null, revisionHistory = [], humanReviewRequired = false,
  brief = "", text = "", dismissed = false, onUpdate,
}) => {
  const [open, setOpen] = useState(false);
  const [fixingCheck, setFixingCheck] = useState(null);
  const [fixingAll, setFixingAll] = useState(false);
  const [attemptedChecks, setAttemptedChecks] = useState(() => new Set());
  const article = sources && sources.article;
  const bjl = sources && sources.bjl;
  const cs = sources && sources.caseStudy;
  const hasArticle = article && (article.title || (article.tags_matched || []).length);
  const hasBjl = bjl && bjl.observation;
  const hasCs = cs && cs.identifier;
  const hasScorecard = scorecard && Object.keys(scorecard).length > 0;
  const hasRevisions = Array.isArray(revisionHistory) && revisionHistory.length > 0;
  const failingEntries = hasScorecard
    ? Object.entries(scorecard).filter(([, c]) => c && c.pass === false)
    : [];
  const canInteract = typeof onUpdate === "function" && !dismissed && hasScorecard;
  const isBusy = fixingAll || fixingCheck !== null;
  // Render if any provenance is available, the polish pass ran, or the
  // draft needs review. Clean drafts that pass the rubric don't surface
  // the scorecard — only Sources content (article / bjl / case study)
  // is expandable; the polished pill stays as a tiny info indicator.
  const showEvaluationSection = hasScorecard && humanReviewRequired && !dismissed;
  if (!hasArticle && !hasBjl && !hasCs && !polished && !showEvaluationSection && !dismissed) return null;
  const sectionStyle = { marginBottom: 12 };
  const headerStyle = { fontWeight: 600, fontSize: 11, letterSpacing: "0.04em", marginBottom: 4, color: "var(--grey-1)" };
  const pillStyle = {
    display: "inline-flex", alignItems: "center", gap: 4,
    fontSize: 11,
    padding: "2px 6px", border: "1px solid var(--grey-4, #e5e5e5)", borderRadius: 3,
  };
  const yellowPillStyle = {
    ...pillStyle,
    color: "#8a6500",
    backgroundColor: "#fff4d4",
    borderColor: "#e6c560",
    fontWeight: 600,
  };
  const fixBtnStyle = {
    fontSize: 11, padding: "2px 8px", marginLeft: 6,
    border: "1px solid var(--grey-4, #d5d5d5)", borderRadius: 3,
    background: "white", color: "var(--grey-1)", cursor: "pointer",
    fontFamily: "inherit",
  };
  const fixBtnDisabledStyle = {
    ...fixBtnStyle, cursor: "not-allowed", opacity: 0.5,
  };
  const hasAnyExpandable = hasArticle || hasBjl || hasCs || showEvaluationSection;
  const showReviewBadge = humanReviewRequired && !dismissed;

  // Helpers — call out to the existing evaluator + reviser. The Fix path
  // re-evaluates after the targeted revision so the scorecard reflects
  // the new state and the badge clears if the check passes.
  const buildOneFailScorecard = (key) => {
    const note = (scorecard && scorecard[key] && scorecard[key].note) || "";
    return { [key]: { pass: false, note } };
  };
  const applyRevision = async (oneFailKey /* string or null for "fix all" */) => {
    if (!canInteract) return;
    const parsed = parseSubjectBody(text || "");
    const scForRevise = oneFailKey
      ? buildOneFailScorecard(oneFailKey)
      : scorecard;
    const revRes = await reviseEmail({
      brief, subject: parsed.subject, body: parsed.body, scorecard: scForRevise,
    });
    // Always re-evaluate so the scorecard reflects the new text.
    const reEval = await evaluateEmail({
      brief, subject: revRes.subject, body: revRes.body,
    });
    const newScorecard = (reEval.ok && reEval.scorecard) ? reEval.scorecard : scorecard;
    const stillFailing = Object.values(newScorecard).some(c => c && c.pass === false);
    const newText = revRes.subject
      ? "Subject: " + revRes.subject + "\n\n" + (revRes.body || "")
      : (revRes.body || "");
    onUpdate(prev => ({
      ...prev,
      text: newText,
      scorecard: newScorecard,
      humanReviewRequired: stillFailing,
      revisionHistory: [
        ...(prev.revisionHistory || []),
        {
          pass: (prev.revisionHistory || []).length + 1,
          scorecard,
          revisions: revRes.revisions || [],
          errors: revRes.errors || [],
          source: oneFailKey ? "manual_fix:" + oneFailKey : "manual_fix_all",
        },
      ],
    }));
  };
  const handleFixOne = async (key) => {
    setFixingCheck(key);
    try {
      await applyRevision(key);
    } catch (e) {
      console.warn("[review] fix one failed:", key, e && e.message);
    }
    setAttemptedChecks(prev => {
      const next = new Set(prev);
      next.add(key);
      return next;
    });
    setFixingCheck(null);
  };
  const handleFixAll = async () => {
    setFixingAll(true);
    try {
      await applyRevision(null);
      // Mark every previously-failing key as attempted.
      setAttemptedChecks(prev => {
        const next = new Set(prev);
        failingEntries.forEach(([k]) => next.add(k));
        return next;
      });
    } catch (e) {
      console.warn("[review] fix all failed:", e && e.message);
    }
    setFixingAll(false);
  };
  const handleDismiss = () => {
    if (typeof onUpdate !== "function") return;
    onUpdate(prev => ({ ...prev, dismissed: true }));
  };

  return (
    <div style={{ marginTop: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        {hasAnyExpandable ? (
          <button
            type="button"
            onClick={() => setOpen(!open)}
            style={{
              background: "none", border: "none", padding: "4px 0",
              color: "var(--grey-2)", fontSize: 12, cursor: "pointer",
              display: "inline-flex", alignItems: "center", gap: 6,
            }}
          >
            <span style={{
              display: "inline-flex",
              transform: open ? "rotate(90deg)" : "none",
              transition: "transform 160ms ease",
            }}>
              <Icon name="chevRight" size={12} />
            </span>
            Sources
          </button>
        ) : null}
        {polished ? (
          <span title="Haiku polish pass ran on this draft" style={{ ...pillStyle, color: "var(--grey-2)" }}>
            polished
          </span>
        ) : null}
        {showReviewBadge ? (
          <span title="One or more quality checks still fail after 2 automatic revision passes" style={yellowPillStyle}>
            Needs review
          </span>
        ) : null}
        {dismissed ? (
          <span title="Marked approved by the user despite remaining check failures" style={{ ...pillStyle, color: "var(--grey-2)" }}>
            dismissed
          </span>
        ) : null}
      </div>
      {open && (
        <div style={{
          fontSize: 12, lineHeight: 1.5, color: "var(--grey-1)",
          paddingLeft: 10, marginLeft: 4, marginTop: 6,
          borderLeft: "2px solid var(--grey-4, #e5e5e5)",
        }}>
          {hasArticle && (
            <div style={sectionStyle}>
              <div style={headerStyle}>ARTICLE</div>
              {article.title ? <div>Title: {article.title}</div> : null}
              <div>Matched by: {article.match_method === "title_match" ? "title match" : "tag overlap"}</div>
              {(article.tags_matched || []).length > 0 ? (
                <div>Tags matched: {article.tags_matched.join(", ")}</div>
              ) : null}
            </div>
          )}
          {hasBjl && (
            <div style={sectionStyle}>
              <div style={headerStyle}>BJL FINDING</div>
              <div>Synthesized observation: {bjl.observation}</div>
              {(bjl.score_rows || []).length > 0 ? (
                <div style={{ marginTop: 4 }}>
                  Raw inputs used:
                  <ul style={{ margin: "2px 0 0", paddingLeft: 16 }}>
                    {bjl.score_rows.map((r, i) => <li key={i}>{r}</li>)}
                  </ul>
                </div>
              ) : null}
              {(bjl.verbatims || []).length > 0 ? (
                <div style={{ marginTop: 4 }}>
                  Verbatims: {bjl.verbatims.map((v, i) => `"${v}"`).join(" | ")}
                </div>
              ) : null}
            </div>
          )}
          {hasCs && (
            <div style={sectionStyle}>
              <div style={headerStyle}>CASE STUDY</div>
              <div>Identifier: {cs.identifier}</div>
              {(cs.tags_matched || []).length > 0 ? (
                <div>Tags matched: {cs.tags_matched.join(", ")}</div>
              ) : null}
            </div>
          )}
          {showEvaluationSection && (
            <div>
              <div style={{ ...headerStyle, display: "flex", alignItems: "center", gap: 8 }}>
                <span>EVALUATION</span>
                <span style={{ fontSize: 10, color: "#8a6500", fontWeight: 600, textTransform: "none", letterSpacing: 0 }}>
                  Needs review
                </span>
              </div>
              {Object.entries(scorecard).map(([key, check]) => {
                const tried = attemptedChecks.has(key);
                const showFixBtn = canInteract && !check.pass;
                const fixDisabled = isBusy;
                const inFlightThis = fixingCheck === key;
                return (
                  <div key={key} style={{ display: "flex", gap: 6, marginTop: 2, alignItems: "flex-start" }}>
                    <span style={{
                      color: check.pass ? "var(--green, #2a8)" : "var(--red, #c33)",
                      fontWeight: 600, minWidth: 12,
                    }}>
                      {check.pass ? "✓" : "✗"}
                    </span>
                    <span style={{ flex: 1 }}>
                      {key}
                      {!check.pass && check.note ? (
                        <span style={{ color: "var(--grey-2)", fontStyle: "italic" }}> — {check.note}</span>
                      ) : null}
                      {!check.pass && tried ? (
                        <span style={{ marginLeft: 6, fontSize: 10, color: "var(--grey-2)" }}>
                          (fix attempted — edit manually)
                        </span>
                      ) : null}
                    </span>
                    {showFixBtn ? (
                      <button
                        type="button"
                        disabled={fixDisabled}
                        onClick={() => handleFixOne(key)}
                        style={fixDisabled ? fixBtnDisabledStyle : fixBtnStyle}
                        title="Fire one targeted revision call for this check"
                      >
                        {inFlightThis ? "Fixing…" : "Fix"}
                      </button>
                    ) : null}
                  </div>
                );
              })}
              {hasRevisions ? (
                <div style={{ marginTop: 6, fontSize: 11, color: "var(--grey-2)" }}>
                  {revisionHistory.length} revision pass{revisionHistory.length === 1 ? "" : "es"} applied
                  {revisionHistory.length > 0 ? (
                    <span> — fixed: {Array.from(new Set(revisionHistory.flatMap(p => (p.revisions || []).filter(r => r.applied).map(r => r.key)))).join(", ") || "(no successful fixes)"}</span>
                  ) : null}
                </div>
              ) : null}
              {canInteract && failingEntries.length > 0 ? (
                <div style={{ marginTop: 10, display: "flex", gap: 8 }}>
                  <button
                    type="button"
                    disabled={isBusy}
                    onClick={handleFixAll}
                    style={isBusy ? fixBtnDisabledStyle : fixBtnStyle}
                    title="Run a targeted revision call for every failing check, then re-evaluate"
                  >
                    {fixingAll ? "Fixing all…" : "Fix all"}
                  </button>
                  <button
                    type="button"
                    disabled={isBusy}
                    onClick={handleDismiss}
                    style={isBusy ? fixBtnDisabledStyle : fixBtnStyle}
                    title="Approve this email regardless of remaining check failures"
                  >
                    Dismiss
                  </button>
                </div>
              ) : null}
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const OutreachEmailCard = ({ result, index, onUpdate }) => {
  const { contact, text, error, sources, polished, scorecard, revisionHistory, humanReviewRequired, brief, dismissed, approved } = result;
  const { subject, body } = parseSubjectBody(text || "");
  const [editSubject, setEditSubject] = useState(subject);
  const [editBody, setEditBody] = useState(body);
  const bodyRef = useRef(null);

  // Sync local edit state whenever the underlying result.text changes —
  // e.g. when a Fix action upstream rewrites the email.
  useEffect(() => {
    setEditSubject(subject);
    setEditBody(body);
  }, [text]);

  // Auto-resize body textarea to its content.
  useEffect(() => {
    if (bodyRef.current) {
      bodyRef.current.style.height = "auto";
      bodyRef.current.style.height = bodyRef.current.scrollHeight + "px";
    }
  }, [editBody]);

  const hasEdits = editSubject !== subject || editBody !== body;
  const initials = (contact.name || "?").split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase();

  const composeText = () => editSubject
    ? "Subject: " + editSubject + "\n\n" + editBody
    : editBody;

  const handleSaveApprove = () => {
    if (typeof onUpdate !== "function") return;
    const newText = composeText();
    // Only edited drafts feed the corpus — they're the high-signal examples.
    const wasEdited = newText !== (result.originalGenerated || result.text);
    if (wasEdited) {
      postApprovedEmail(result, { subject: editSubject, body: editBody, finalText: newText });
    }
    onUpdate(prev => ({
      ...prev,
      text: newText,
      approved: true,
      approvedAt: new Date().toISOString(),
      originalGenerated: prev.originalGenerated || prev.text,
      userEdited: newText !== (prev.originalGenerated || prev.text),
    }));
  };

  const handleDiscardEdits = () => {
    setEditSubject(subject);
    setEditBody(body);
  };

  const copyText = () => navigator.clipboard.writeText(composeText());

  const subjInputStyle = {
    flex: 1, border: "none", background: "transparent",
    font: "inherit", color: "inherit", outline: "none",
    padding: 0,
  };
  const bodyTextareaStyle = {
    width: "100%", border: "none", background: "transparent",
    font: "inherit", color: "inherit", outline: "none",
    padding: 0, margin: 0, resize: "none", overflow: "hidden",
    whiteSpace: "pre-wrap", lineHeight: 1.55,
  };
  const btnStyle = {
    fontSize: 12, padding: "4px 10px",
    border: "1px solid var(--grey-4, #d5d5d5)", borderRadius: 3,
    background: "white", color: "var(--grey-1)", cursor: "pointer",
    fontFamily: "inherit",
  };
  const primaryBtnStyle = {
    ...btnStyle,
    background: approved && !hasEdits ? "#e8f5e9" : "var(--grey-1, #222)",
    color: approved && !hasEdits ? "#2a7a2a" : "white",
    borderColor: approved && !hasEdits ? "#bcd9bc" : "var(--grey-1, #222)",
  };

  return (
    <div className="email-card" style={approved ? { borderLeft: "3px solid #4caf50" } : undefined}>
      <div className="ec-head">
        <div className="ec-avatar">{initials}</div>
        <div className="ec-to">
          <div className="name">{contact.name}</div>
          <div className="role">{[contact.role, contact.email].filter(Boolean).join(" · ")}</div>
        </div>
        <div className="ec-actions">
          <button className="icon-btn" title="Copy" onClick={copyText}>
            <Icon name="copy" />
          </button>
        </div>
      </div>
      <div className="ec-body">
        {error ? (
          <div style={{color: "var(--red)", fontSize: 13}}>Failed: {error}</div>
        ) : (
          <>
            <div className="ec-subject" style={{ display: "flex", gap: 6, alignItems: "baseline" }}>
              <span className="label">Subject</span>
              <input
                type="text"
                value={editSubject}
                onChange={e => setEditSubject(e.target.value)}
                placeholder="(no subject)"
                style={subjInputStyle}
              />
            </div>
            <textarea
              ref={bodyRef}
              value={editBody}
              onChange={e => setEditBody(e.target.value)}
              style={bodyTextareaStyle}
            />
            <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center" }}>
              <button
                type="button"
                style={primaryBtnStyle}
                onClick={handleSaveApprove}
                disabled={approved && !hasEdits}
                title={approved && !hasEdits ? "Already approved" : (hasEdits ? "Save your edits and approve this email" : "Approve this email as the example")}
              >
                {approved && !hasEdits ? "✓ Approved" : (hasEdits ? "Save edits & approve" : "Approve")}
              </button>
              {hasEdits ? (
                <button type="button" style={btnStyle} onClick={handleDiscardEdits} title="Revert your edits">
                  Discard edits
                </button>
              ) : null}
              {approved && hasEdits ? (
                <span style={{ fontSize: 11, color: "var(--grey-2)" }}>
                  unsaved edits since last approval
                </span>
              ) : null}
            </div>
            <EmailSources
              sources={sources}
              polished={polished}
              scorecard={scorecard}
              revisionHistory={revisionHistory}
              humanReviewRequired={humanReviewRequired}
              brief={brief}
              text={text}
              dismissed={dismissed}
              onUpdate={onUpdate}
            />
          </>
        )}
      </div>
    </div>
  );
};

/* =========================================================================
 * 12. BatchMode — multi-account. Uses v4 state engine, design row roster,
 * plus three adjustments: scrollable structured insights, per-account retry,
 * inline email body preview.
 * ========================================================================= */

const BatchMode = ({ strategistContext, setStrategistContext }) => {
  const [waldoData, setWaldoData] = useState(null);
  const [accountInsights, setAccountInsights] = useState({});
  const [accountStatus, setAccountStatus] = useState({}); // per-account: 'queued'|'loading'|'ready'|'error'
  const [pulling, setPulling] = useState(false);
  const [pullProgress, setPullProgress] = useState({ current: 0, total: 0 });
  const [instructions, setInstructions] = useState("");
  const [expanded, setExpanded] = useState(new Set());
  const [generating, setGenerating] = useState(false);
  const [genPhase, setGenPhase] = useState("");
  const [results, setResults] = useState({}); // { [accountId]: [{contact, text, error}] }
  const [uploadError, setUploadError] = useState(null);
  const fileInputRef = useRef(null);

  const accounts = waldoData?.accounts || [];
  const ready = accounts.filter(a => accountStatus[a.id] === "ready").length;
  const totalContacts = accounts.reduce((n, a) => n + ((a.contacts || []).length || 0), 0);
  const eligibleContacts = accounts
    .filter(a => accountStatus[a.id] === "ready")
    .reduce((n, a) => n + ((a.contacts || []).length || 0), 0);

  const loadFile = async (file) => {
    setUploadError(null);
    try {
      const text = await file.text();
      const parsed = parseWaldoJSON(text);
      setWaldoData(parsed);
      // All accounts are immediately eligible for email generation. The BJL
      // pre-pull pipeline (pullForAccount/queryBJL) is no longer part of the
      // email workflow; brief-first orchestration fetches the single BJL
      // observation it needs at email-generation time via /api/bjl-content.
      const initStatus = {};
      parsed.accounts.forEach(a => { initStatus[a.id] = "ready"; });
      setAccountStatus(initStatus);
      setAccountInsights({});
      setResults({});
      setExpanded(new Set());
    } catch (e) { setUploadError(e.message); }
  };

  const pullForAccount = async (account) => {
    setAccountStatus(prev => ({ ...prev, [account.id]: "loading" }));
    const tension = account.creative_tension || account.top_signal?.why_it_matters || "";
    const query = [
      `Pull BJL findings for outreach to ${account.company || account.name}`,
      account.category ? `(${account.category})` : "",
      tension ? `. Strategic tension: ${tension}` : "",
    ].filter(Boolean).join(" ").trim();
    const waldoCtx = buildWaldoSystemContext(account);
    const combinedCtx = [strategistContext?.trim(), waldoCtx].filter(Boolean).join("\n\n");
    let streamed = "";
    let ok = false, errMsg = null;
    await queryBJL({
      query,
      intentHint: "email_findings",
      emailMode: true,
      strategistContext: combinedCtx || undefined,
      waldoContext: account,
      onChunk: (t) => { streamed += t; },
      onDone: () => { ok = true; },
      onError: ({ message }) => { errMsg = message; },
    });
    if (ok) {
      setAccountInsights(prev => ({ ...prev, [account.id]: streamed }));
      setAccountStatus(prev => ({ ...prev, [account.id]: "ready" }));
    } else {
      setAccountStatus(prev => ({ ...prev, [account.id]: "error" }));
      setAccountInsights(prev => ({ ...prev, [account.id]: streamed || errMsg || "Pull failed" }));
    }
    // Return both the success flag and the streamed text so callers
    // running in the same tick can use the value without waiting on
    // accountInsights state to settle.
    return { ok, text: ok ? streamed : "" };
  };

  const runAllPull = async () => {
    if (!accounts.length) return;
    setPulling(true);
    setPullProgress({ current: 0, total: accounts.length });
    for (let i = 0; i < accounts.length; i++) {
      setPullProgress({ current: i, total: accounts.length });
      await pullForAccount(accounts[i]);
      if (i < accounts.length - 1) await new Promise(r => setTimeout(r, 2000));
    }
    setPullProgress({ current: accounts.length, total: accounts.length });
    setPulling(false);
  };

  const retry = async (account) => { const r = await pullForAccount(account); return r && r.ok; };

  const runGenerate = async () => {
    if (!accounts.length) return;
    // Generation lock: a re-entrant call (double-click / render race) was
    // running the full batch sequence twice. Bail if already generating, and
    // set the flag before the async loop begins so the guard and the button's
    // disabled prop both see it immediately.
    if (generating) return;
    setGenerating(true);
    try {

    // Brief-signal check (mirrors the regex in generateOneEmail). If the
    // brief asks for BJL, each account gets one pre-pulled corpus-wide
    // finding via /api/bjl-query (email_mode=true). pullForAccount caches
    // into accountInsights so multiple contacts at the same account reuse
    // the same finding.
    const briefLowerOuter = (instructions || "").toLowerCase();
    const wantsBJLOuter = /\bbjl\b|\bresearch\b|\bdata\b|\binsight\b|\bstat\b|\bfinding\b|\bconsumer\b|\btraveler\b|\bfan\b/i.test(briefLowerOuter);

    const out = { ...results };
    // Local insight cache so we don't have to wait on accountInsights state
    // round-tripping between account iterations.
    const insightLocal = { ...accountInsights };
    for (const account of accounts) {
      const contacts = (account.contacts || []).map(normalizeContact).filter(Boolean);
      out[account.id] = [];
      setResults({ ...out });

      let bjlInsight = "";
      if (wantsBJLOuter) {
        const cached = insightLocal[account.id];
        if (cached && String(cached).trim()) {
          bjlInsight = String(cached).trim();
        } else {
          const pulled = await pullForAccount(account);
          if (pulled && pulled.ok && pulled.text) {
            bjlInsight = String(pulled.text).trim();
            insightLocal[account.id] = bjlInsight;
          }
        }
      }

      const usedSignals = new Set();
      for (let j = 0; j < contacts.length; j++) {
        const c = contacts[j];
        const chosen = pickSignalForContact(account, c.role, usedSignals);
        if (chosen) usedSignals.add(chosen.origin);
        const waldoCtxPerContact = buildWaldoSystemContext(account, { primarySignal: chosen });
        console.log(
          "[waldo-rotation]",
          (account.company || account.name) + " →",
          c.name + " (" + (c.role || "no role") + ")",
          "signal:",
          chosen?.sig?.signal_type || "none",
          "—",
          String(chosen?.sig?.headline || "").slice(0, 80)
        );
        const { text, error, polished, sources, scorecard, revisionHistory, humanReviewRequired, prospectContext } = await generateOneEmail({
          contactName: c.name,
          company: account.company || account.name,
          waldoContext: waldoCtxPerContact,
          userStrategistContext: strategistContext,
          userEmailInstructions: instructions,
          audienceModeValue: "external",
          waldoAccount: account,
          prospectCategory: account.category || null,
          batchIndex: j,
          priorSameCompany: j > 0,
          bjlInsights: bjlInsight,
          onPhase: (p) => setGenPhase(p),
        });
        out[account.id].push({
          contact: c, text, error, polished, sources, scorecard, revisionHistory, humanReviewRequired,
          brief: instructions,
          // Retrieval signal captured for the approved-email corpus write.
          prospectContext,
          company: account.company || account.name,
          audienceMode: "external",
          waldoSignalType: chosen?.sig?.signal_type || null,
          dismissed: false,
          approved: false,
          approvedAt: null,
          originalGenerated: text,
        });
        setResults({ ...out });
        setGenPhase("");
        if (j < contacts.length - 1) await new Promise(r => setTimeout(r, 5000));
      }
      await new Promise(r => setTimeout(r, 3000));
      }
      setGenPhase("");
    } finally {
      setGenerating(false);
    }
  };

  // Interactive review: callback for EmailSources Fix / Dismiss actions.
  const updateResult = (accountId, index, updater) => {
    setResults(prev => ({
      ...prev,
      [accountId]: (prev[accountId] || []).map((r, i) => (i === index ? updater(r) : r)),
    }));
  };

  const exportCSV = () => {
    const rows = [["Company", "Contact", "Role", "Email", "Subject", "Body", "Error"]];

    const blob = new Blob([csv], { type: "text/csv" });

    const a = document.createElement("a");

    a.download = "bjl_batch_outreach.csv";

    URL.revokeObjectURL(url);

  const toggleExpand = (id) => {

  };

  const totalDrafts = Object.values(results).reduce((n, arr) => n + (arr?.length || 0), 0);

  return (
    <div className="batch-layout">
      <div className="batch-head">
        <div>
          <div className="eyebrow" style={{marginBottom: 8}}>Outreach · multi-account batch</div>
          <div className="title">
            {accounts.length > 0 ? <>{accounts.length} accounts <span className="accent">/</span> one voice.</> : <>Load a batch <span className="accent">/</span> set the voice.</>}
          </div>
          <div className="sub">
            Load a multi-account Waldo file. BJL pulls insights for every account, sequentially with skip-on-failure.
            Review per account, paste one shared Email Instructions prompt, generate all. Export one CSV.
          </div>
        </div>
        <div className="actions">
          <button className="btn ghost" onClick={() => fileInputRef.current?.click()}>
            <Icon name="upload" size={12} /> New Waldo file
          </button>
          <input ref={fileInputRef} type="file" accept=".json" style={{display: "none"}}
            onChange={(e) => e.target.files?.[0] && loadFile(e.target.files[0])} />
          <button className="btn primary" onClick={runGenerate} disabled={eligibleContacts === 0 || generating}>
            <Icon name="sparkle" size={12} />
            {generating
              ? `Generating${genPhase ? ` (${genPhase.charAt(0).toUpperCase() + genPhase.slice(1)}…)` : "…"}`
              : `Generate all · ${eligibleContacts} emails`}
          </button>
          {totalDrafts > 0 && (
            <button className="btn ghost" onClick={exportCSV}><Icon name="download" size={12} /> Export CSV</button>
          )}
        </div>
      </div>

      {uploadError && <div style={{padding: "12px 40px", color: "var(--red)", fontSize: 13}}>{uploadError}</div>}

      <div className="instructions-bar">
        <div className="lbl">
          Email instructions<br/>
          <span style={{fontFamily: "var(--font-mono)", fontWeight: 400, textTransform: "none", letterSpacing: 0, fontSize: 10, color: "var(--grey-1)"}}>
