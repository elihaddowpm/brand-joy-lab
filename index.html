// ---- Phase 1.5 vis A: cohort-vs-corpus delta badge ----
const JoyMapDeltaBadge = ({ cohortValue, corpusValue, metricLabel, hasCohortFilter }) => {
  if (!hasCohortFilter) return null;
  const c = Number(cohortValue);
  const x = Number(corpusValue);
  if (!Number.isFinite(c) || !Number.isFinite(x)) return null;
  const delta = c - x;
  if (Math.abs(delta) < 1) return null;
  const sign = delta > 0 ? '+' : '';
  const unit = metricLabel === 'JI' ? '' : 'pp';
  const rounded = metricLabel === 'JI' ? Math.round(delta) : Math.round(delta * 10) / 10;
  const text = `${sign}${rounded}${unit}`;
  const tone = delta > 0 ? 'positive' : 'negative';
  return <span className={`joy-map-delta-badge joy-map-delta-${tone}`}>{text}</span>;
};

// ---- Phase 1.5 vis B: mini gauge per card ----
const JoyMapMiniGauge = ({ value, metricLabel, accent }) => {
  const v = Number(value);
  if (!Number.isFinite(v)) return null;
  let max, ref1, ref2;
  if (metricLabel === 'JI') { max = 100; ref1 = 60; ref2 = 70; }
  else if (metricLabel === 'Tag rate') { max = 25; ref1 = 5; ref2 = 15; }
  else { max = 100; ref1 = 50; ref2 = 65; }   // TB% and unknowns
  const clamped = Math.max(0, Math.min(v, max));
  const pct = (clamped / max) * 100;
  const ref1Pct = (ref1 / max) * 100;
  const ref2Pct = (ref2 / max) * 100;
  return (
    <div className="joy-map-mini-gauge" aria-hidden="true">
      <div className="joy-map-mini-gauge-bar">
        <div className="joy-map-mini-gauge-tick" style={{ left: `${ref1Pct}%` }} />
        <div className="joy-map-mini-gauge-tick" style={{ left: `${ref2Pct}%` }} />
        <div className="joy-map-mini-gauge-dot" style={{ left: `${pct}%`, background: accent }} />
      </div>
      <div className="joy-map-mini-gauge-scale">
        <span>0</span>
        <span style={{ left: `${ref1Pct}%` }}>{ref1}{metricLabel === 'JI' ? '' : '%'}</span>
        <span style={{ left: `${ref2Pct}%` }}>{ref2}{metricLabel === 'JI' ? '' : '%'}</span>
        <span style={{ right: 0 }}>{max}{metricLabel === 'JI' ? '' : '%'}</span>
      </div>
    </div>
  );
};

const JoyMapFindingCard = ({ card, accent, hasCohortFilter }) => {
  const layerLabel = card.layer === '3'
    ? `Layer 3 · ${card.framework || 'Tag'}`
    : `Layer ${card.layer} · ${card.metric_label || ''}`;
  const metricDisplay = card.metric_label === 'JI'
    ? String(Math.round(Number(card.metric_value) || 0))
    : `${card.metric_value || 0}${card.metric_label === 'TB%' || card.metric_label === 'Tag rate' ? '%' : ''}`;
  const corpusDisplay = (typeof card.corpus_value === 'number' || (card.corpus_value && !isNaN(Number(card.corpus_value))))
    ? (card.metric_label === 'JI'
        ? String(Math.round(Number(card.corpus_value)))
        : `${card.corpus_value}${card.metric_label === 'TB%' || card.metric_label === 'Tag rate' ? '%' : ''}`)
    : null;
  const lowN = card.low_n_warning;
  const isCorpusBaseline = card.metric_source === 'corpus_baseline';
  const evidenceLabel = isCorpusBaseline
    ? (card.metric_label === 'JI' ? 'JI · corpus baseline' : `${card.metric_label || 'TB%'} · corpus baseline`)
    : (card.metric_label === 'JI' ? 'JI' : `${card.metric_label || 'TB%'} · cohort`);
  const evidenceN = isCorpusBaseline
    ? (typeof card.corpus_n === 'number' ? card.corpus_n : card.cohort_n)
    : card.cohort_n;
  const itemQuestion = card.bjl_item_question || null;
  const headline = card.headline || card.bjl_item_name || card.tag || '—';
  return (
    <div className="joy-map-card">
      <div className="joy-map-card-head">
        <div className="joy-map-card-headline">{headline}</div>
        <span className="joy-map-card-chip" style={{ color: accent }}>{layerLabel}</span>
      </div>
      <div className="joy-map-card-evidence">
        <div className="joy-map-card-evidence-label">BJL ITEM</div>
        <div className="joy-map-card-evidence-item">
          {itemQuestion ? <span className="joy-map-card-evidence-q">"{itemQuestion}" — </span> : null}
          {card.bjl_item_name || card.tag || '—'}
        </div>
        <div className="joy-map-card-evidence-metric-row">
          <span className="joy-map-card-metric" style={{ color: accent }}>{metricDisplay}</span>
          <JoyMapDeltaBadge
            cohortValue={card.metric_value}
            corpusValue={card.corpus_value}
            metricLabel={card.metric_label}
            hasCohortFilter={hasCohortFilter && !isCorpusBaseline}
          />
          <span className="joy-map-card-evidence-meta">
            {evidenceLabel}
            {typeof evidenceN === 'number' ? ` · n=${Number(evidenceN).toLocaleString()}` : ''}
            {lowN === 'low_n' ? ' · low n' : lowN === 'directional_only' ? ' · directional only' : ''}
          </span>
          {card.fielding_limited && (
            <span className="joy-map-card-fielding-limited" title="Item not asked in all fieldings comprising this cohort. Metric reflects only the subset of cohort respondents who saw this question.">
              fielding-limited
            </span>
          )}
          {corpusDisplay && !isCorpusBaseline && (
            <span className="joy-map-card-evidence-corpus">
              vs corpus {corpusDisplay}
              {typeof card.corpus_n === 'number' ? ` (n=${Number(card.corpus_n).toLocaleString()})` : ''}
            </span>
          )}
        </div>
        <JoyMapMiniGauge value={card.metric_value} metricLabel={card.metric_label} accent={accent} />
        {isCorpusBaseline && (
          <div className="joy-map-card-evidence-note">Cohort cut too thin for slice; corpus baseline shown.</div>
        )}
      </div>
      {card.layer === '3' && card.calibration_band && (
        <div className="joy-map-card-conf">Confidence: {card.calibration_band}{typeof card.confidence === 'number' ? ` · ${(card.confidence*100).toFixed(0)}%` : ''}</div>
      )}
      {card.brand_snippet && (
        <div className="joy-map-card-line"><span className="joy-map-card-label">Brand:</span> "{card.brand_snippet}"</div>
      )}
      {card.audience_signal && (
        <div className="joy-map-card-line"><span className="joy-map-card-label">Audience:</span> {card.audience_signal}</div>
      )}
      {card.rationale && (
        <div className="joy-map-card-rationale">{card.rationale}</div>
      )}
      {card.stretch_angle && (
        <div className="joy-map-card-stretch">→ {card.stretch_angle}</div>
      )}
    </div>
  );
};

// Reusable manual item picker — used inside the confirmation view to add or
// swap a rule. Search runs against bjl-joy-map-items (which sources from
// bjl_items_clean since v3).
const JoyPatternManualPicker = ({ criterionOptionsByKind, onPickComplete, onCancel }) => {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [picked, setPicked] = useState(null);
  const [criterion, setCriterion] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    let cancelled = false;
    const t = setTimeout(async () => {
      setLoading(true);
      try {
        const r = await fetch(`/.netlify/functions/bjl-joy-map-items?q=${encodeURIComponent(query)}&limit=25`, authedFetchInit());
        if (!r.ok) throw new Error(`items lookup failed (${r.status})`);
        const j = await r.json();
        if (!cancelled) setResults(j.items || []);
      } catch (_) {
        if (!cancelled) setResults([]);
      } finally {
        if (!cancelled) setLoading(false);
      }
    }, 250);
    return () => { cancelled = true; clearTimeout(t); };
  }, [query]);

  const handlePick = (it) => {
    setPicked(it);
    const opts = criterionOptionsByKind[it.scale_kind] || [];
    setCriterion(opts[0]?.value || '');
  };

  const handleConfirm = () => {
    if (!picked || !criterion) return;
    onPickComplete({
      item_id:       picked.item_id,
      item_name:     picked.item_name,
      question_text: picked.question_text,
      scale_kind:    picked.scale_kind,
      n_responses:   picked.n_responses,
      kind:          picked.scale_kind,
      criterion:     criterion,
      concept:       picked.item_name,
      manual:        true,
    });
  };

  return (
    <div className="joy-map-rule-add">
      <input
        type="text"
        className="joy-map-rule-search"
        placeholder="Search BJL items by name or question text…"
        value={query}
        onChange={(e) => setQuery(e.target.value)}
        autoFocus
      />
      {loading && <div className="joy-map-rule-hint">Searching…</div>}
      {!picked && results.length > 0 && (
        <div className="joy-map-rule-results">
          {results.map((it) => (
            <div key={it.item_id} className="joy-map-rule-result" onClick={() => handlePick(it)}>
              <div className="joy-map-rule-result-name">{it.item_name}</div>
              <div className="joy-map-rule-result-q">{it.question_text}</div>
              <div className="joy-map-rule-result-kind">{it.scale_kind} · n={it.n_responses ?? '—'}</div>
            </div>
          ))}
        </div>
      )}
      {picked && (
        <div className="joy-map-rule-criterion-row">
          <div className="joy-map-rule-picked">
            <div className="joy-map-rule-picked-name">"{picked.item_name}"</div>
            <div className="joy-map-rule-picked-q">{picked.question_text}</div>
          </div>
          <select className="joy-map-rule-criterion-select" value={criterion} onChange={(e) => setCriterion(e.target.value)}>
            {(criterionOptionsByKind[picked.scale_kind] || []).map(opt => (
              <option key={opt.value} value={opt.value}>{opt.label}</option>
            ))}
          </select>
          <button className="btn primary" onClick={handleConfirm}>Confirm</button>
          <button className="btn ghost" onClick={onCancel}>Cancel</button>
        </div>
      )}
      {!picked && (
        <button className="btn ghost joy-map-rule-cancel-row" onClick={onCancel}>Cancel</button>
      )}
    </div>
  );
};

const JoyPatternFreetextBuilder = ({ rules, onSetRules, operator, onSetOperator }) => {
  const [description, setDescription] = useState('');
  const [parsing, setParsing] = useState(false);
  const [parseErr, setParseErr] = useState(null);
  const [unresolved, setUnresolved] = useState([]);
  const [criterionOptionsByKind, setCriterionOptionsByKind] = useState({});
  const [expanded, setExpanded] = useState({});         // rule index -> true means show alternatives
  const [swapping, setSwapping] = useState(null);        // rule index being swapped (open inline picker)
  const [adding, setAdding] = useState(false);

  // Load criterion options once on mount via the existing items endpoint.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const r = await fetch('/.netlify/functions/bjl-joy-map-items?q=&limit=1', authedFetchInit());
        if (!r.ok) return;
        const j = await r.json();
        if (!cancelled && j.criterion_options) setCriterionOptionsByKind(j.criterion_options);
      } catch (_) { /* non-fatal */ }
    })();
    return () => { cancelled = true; };
  }, []);

  const handleParse = async () => {
    if (!description.trim()) return;
    setParsing(true);
    setParseErr(null);
    setUnresolved([]);
    try {
      const r = await fetch('/.netlify/functions/bjl-joy-map-audience-parse', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ description: description.trim() }),
      }));
      if (!r.ok) {
        const txt = await r.text();
        throw new Error(`parse failed (${r.status}): ${txt.slice(0, 200)}`);
      }
      const j = await r.json();
      // Hydrate rules from the parse result into the shape the rest of the
      // joy-map pipeline expects. Each rule keeps its UI-only fields
      // (concept, matched_items, rationale) alongside the wire fields
      // (item_id, kind, criterion).
      const hydrated = (j.rules || []).map(rule => {
        const primary = (rule.matched_items || []).find(m => m.item_id === rule.primary_match_item_id) || rule.matched_items[0];
        if (!primary) return null;
        return {
          item_id:       primary.item_id,
          item_name:     primary.item_name,
          question_text: primary.question_text,
          scale_kind:    primary.scale_kind,
          n_responses:   primary.n_responses,
          confidence:    primary.confidence,
          kind:          primary.scale_kind,
          criterion:     rule.detected_criterion,
          concept:       rule.concept,
          rationale:     rule.rationale,
          matched_items: rule.matched_items,
        };
      }).filter(Boolean);
      onSetRules(hydrated);
      if (j.logical_operator && onSetOperator) onSetOperator(j.logical_operator);
      setUnresolved(j.unresolved_concepts || []);
      setExpanded({});
    } catch (e) {
      setParseErr(String(e.message || e));
    } finally {
      setParsing(false);
    }
  };

  const handleClear = () => {
    setDescription('');
    onSetRules([]);
    setUnresolved([]);
    setExpanded({});
    setParseErr(null);
  };

  const updateRule = (idx, patch) => {
    const next = rules.slice();
    next[idx] = { ...next[idx], ...patch };
    onSetRules(next);
  };

  const removeRule = (idx) => onSetRules(rules.filter((_, i) => i !== idx));
  const addRule = (rule) => onSetRules([...rules, rule]);

  const swapToAlternative = (idx, alt) => {
    const opts = criterionOptionsByKind[alt.scale_kind] || [];
    const currentCriterion = rules[idx].criterion;
    const validCriteria = opts.map(o => o.value);
    const nextCriterion = validCriteria.includes(currentCriterion) ? currentCriterion : (opts[0]?.value || '');
    updateRule(idx, {
      item_id:       alt.item_id,
      item_name:     alt.item_name,
      question_text: alt.question_text,
      scale_kind:    alt.scale_kind,
      n_responses:   alt.n_responses,
      confidence:    alt.confidence,
      kind:          alt.scale_kind,
      criterion:     nextCriterion,
    });
    setExpanded({ ...expanded, [idx]: false });
  };

  return (
    <div className="joy-map-freetext-builder">
      <textarea
        className="joy-map-freetext-input"
        placeholder="Describe the audience by joy pattern. Example: people who feel high joy from eating candy bars and who also love spending time with family."
        rows={3}
        value={description}
        onChange={(e) => setDescription(e.target.value)}
      />
      <div className="joy-map-freetext-actions">
        <button className="btn primary" disabled={parsing || !description.trim()} onClick={handleParse}>
          {parsing ? 'Parsing…' : (rules.length > 0 ? 'Re-parse' : 'Parse')}
        </button>
        {rules.length > 0 && (
          <button className="btn ghost" onClick={handleClear}>Clear all</button>
        )}
      </div>
      {parseErr && <div className="joy-map-rule-err">{parseErr}</div>}

      {rules.length > 1 && (
        <div className="joy-map-operator-badge">
          <span className="joy-map-operator-label">Rules combined with:</span>
          <button
            className={`joy-map-operator-pill ${operator === 'AND' ? 'active' : ''}`}
            onClick={() => onSetOperator && onSetOperator('AND')}
          >AND</button>
          <button
            className={`joy-map-operator-pill ${operator === 'OR' ? 'active' : ''}`}
            onClick={() => onSetOperator && onSetOperator('OR')}
          >OR</button>
          <span className="joy-map-operator-hint">
            {operator === 'AND'
              ? 'Cohort = respondents matching every rule'
              : 'Cohort = respondents matching any rule (union)'}
          </span>
        </div>
      )}

      {rules.length > 0 && (
        <div className="joy-map-rules-list">
          <div className="joy-map-rules-list-title">Interpreted rules — confirm or edit:</div>
          {rules.map((rule, i) => {
            const opts = criterionOptionsByKind[rule.scale_kind] || [];
            const isExpanded = !!expanded[i];
            const isSwapping = swapping === i;
            const alts = (rule.matched_items || []).filter(m => m.item_id !== rule.item_id);
            return (
              <div key={i} className="joy-map-rule-confirm">
                <div className="joy-map-rule-confirm-head">
                  {rule.concept && <span className="joy-map-rule-concept">"{rule.concept}"</span>}
                  <button className="joy-map-rule-remove" onClick={() => removeRule(i)} title="Remove rule">×</button>
                </div>
                <div className="joy-map-rule-confirm-body">
                  <div className="joy-map-rule-item-line">
                    <span className="joy-map-rule-item">{rule.item_name}</span>
                    {rule.question_text && (
                      <span className="joy-map-rule-q"> · {rule.question_text.length > 60 ? rule.question_text.slice(0, 60) + '…' : rule.question_text}</span>
                    )}
                  </div>
                  <div className="joy-map-rule-meta-line">
                    <select
                      className="joy-map-rule-criterion-select"
                      value={rule.criterion}
                      onChange={(e) => updateRule(i, { criterion: e.target.value })}>
                      {opts.map(opt => (
                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                      ))}
                    </select>
                    {typeof rule.confidence === 'number' && (
                      <span className="joy-map-rule-confidence">confidence {(rule.confidence * 100).toFixed(0)}%</span>
                    )}
                    {typeof rule.n_responses === 'number' && (
                      <span className="joy-map-rule-nresp">n={rule.n_responses.toLocaleString()}</span>
                    )}
                    {Array.isArray(rule.fielding_ids) && rule.fielding_ids.length > 0 && (
                      <span className="joy-map-rule-fielding" title={rule.fielding_ids.join(', ')}>
                        fielded {rule.fielding_ids.length === 1
                          ? rule.fielding_ids[0]
                          : `${rule.fielding_ids[0]}–${rule.fielding_ids[rule.fielding_ids.length - 1]}`}
                      </span>
                    )}
                    {alts.length > 0 && (
                      <button className="joy-map-rule-alts-toggle" onClick={() => setExpanded({ ...expanded, [i]: !isExpanded })}>
                        {isExpanded ? 'Hide alternatives' : `See ${alts.length} alternative match${alts.length === 1 ? '' : 'es'}`}
                      </button>
                    )}
                    <button className="joy-map-rule-swap" onClick={() => setSwapping(isSwapping ? null : i)}>
                      {isSwapping ? 'Cancel swap' : 'Swap item'}
                    </button>
                  </div>
                  {isExpanded && alts.length > 0 && (
                    <div className="joy-map-rule-alts">
                      {alts.map(alt => (
                        <div key={alt.item_id} className="joy-map-rule-alt" onClick={() => swapToAlternative(i, alt)}>
                          <div className="joy-map-rule-alt-name">{alt.item_name}</div>
                          <div className="joy-map-rule-alt-q">{alt.question_text}</div>
                          <div className="joy-map-rule-alt-meta">
                            {alt.scale_kind} · n={alt.n_responses?.toLocaleString() ?? '—'}
                            {typeof alt.confidence === 'number' && ` · confidence ${(alt.confidence * 100).toFixed(0)}%`}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                  {isSwapping && (
                    <JoyPatternManualPicker
                      criterionOptionsByKind={criterionOptionsByKind}
                      onPickComplete={(picked) => {
                        updateRule(i, {
                          item_id:       picked.item_id,
                          item_name:     picked.item_name,
                          question_text: picked.question_text,
                          scale_kind:    picked.scale_kind,
                          n_responses:   picked.n_responses,
                          confidence:    null,
                          kind:          picked.scale_kind,
                          criterion:     picked.criterion,
                        });
                        setSwapping(null);
                      }}
                      onCancel={() => setSwapping(null)}
                    />
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {unresolved.length > 0 && (
        <div className="joy-map-unresolved">
          <div className="joy-map-unresolved-title">Unresolved concepts (no match found):</div>
          <ul className="joy-map-unresolved-list">
            {unresolved.map((c, i) => <li key={i}>"{c}"</li>)}
          </ul>
        </div>
      )}

      {adding ? (
        <JoyPatternManualPicker
          criterionOptionsByKind={criterionOptionsByKind}
          onPickComplete={(picked) => { addRule(picked); setAdding(false); }}
          onCancel={() => setAdding(false)}
        />
      ) : (
        <button className="btn ghost joy-map-add-manual" onClick={() => setAdding(true)}>+ Add rule manually</button>
      )}
    </div>
  );
};

// Compute the intersection of fielding_ids across rules. Returns [] when
// any rule lacks fielding_ids; returns the non-empty intersection when all
// rules share at least one fielding; returns [] when no overlap exists.
const intersectFieldings = (rules) => {
  const lists = rules
    .map(r => Array.isArray(r.fielding_ids) ? r.fielding_ids : null)
    .filter(Boolean);
  if (lists.length === 0 || lists.length !== rules.length) return null;  // null = unknown
  if (lists.length === 1) return lists[0].slice();
  return lists.reduce((acc, arr) => acc.filter(f => arr.includes(f)), lists[0].slice());
};

const JoyMapMode = () => {
  const [subView, setSubView] = useState('dance_map');
  const [filters, setFilters] = useState({});
  const [joyPatternRules, setJoyPatternRules] = useState([]);
  const [logicalOperator, setLogicalOperator] = useState('AND');
  const [cohortN, setCohortN] = useState(null);
  const [cohortNLoading, setCohortNLoading] = useState(false);
  const [brandMode, setBrandMode] = useState('text');
  const [brandText, setBrandText] = useState('');
  const [brandJson, setBrandJson] = useState('');
  const [running, setRunning] = useState(false);
  const [error, setError] = useState(null);
  const [finding, setFinding] = useState(null);

  // Audience mode is derived from what's populated.
  const hasDemographic = Object.values(filters).some(v => v);
  const hasJoyPattern  = joyPatternRules.length > 0;
  const audienceMode = (hasDemographic && hasJoyPattern) ? 'combined'
                     : hasJoyPattern                      ? 'joy_pattern'
                     : 'demographic';

  // Cross-fielding detection: empty intersection across rules' fieldings.
  const fieldingIntersection = hasJoyPattern && joyPatternRules.length > 1
    ? intersectFieldings(joyPatternRules)
    : null;
  const crossFielding = fieldingIntersection !== null && fieldingIntersection.length === 0;
  const blockedOnCrossFieldingAnd = crossFielding && logicalOperator === 'AND';

  // Live cohort n — refresh when filters / rules / operator change.
  useEffect(() => {
    let cancelled = false;
    const t = setTimeout(async () => {
      setCohortNLoading(true);
      try {
        const body = {
          audience_filters: filters,
          joy_pattern_rules: joyPatternRules.map(r => ({ item_id: r.item_id, kind: r.kind, criterion: r.criterion })),
          logical_operator: logicalOperator,
        };
        const r = await fetch('/.netlify/functions/bjl-joy-map-cohort-n', authedFetchInit({
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }));
        if (!r.ok) throw new Error(`cohort-n failed (${r.status})`);
        const j = await r.json();
        if (!cancelled) setCohortN(j.cohort_n);
      } catch (e) {
        if (!cancelled) setCohortN(null);
      } finally {
        if (!cancelled) setCohortNLoading(false);
      }
    }, 350);
    return () => { cancelled = true; clearTimeout(t); };
  }, [filters, joyPatternRules, logicalOperator]);

  const handleRun = async (operatorOverride) => {
    setError(null);
    setFinding(null);
    const effectiveOperator = operatorOverride || logicalOperator;
    let parsedJson = null;
    if (subView === 'dance_map' && brandMode === 'json' && brandJson.trim()) {
      try { parsedJson = JSON.parse(brandJson); }
      catch (e) { setError('Brand JSON did not parse: ' + e.message); return; }
    }
    if (subView === 'dance_map' && brandMode === 'text' && !brandText.trim()) {
      setError('Provide brand text or paste Waldo JSON.'); return;
    }
    setRunning(true);
    try {
      const requestBody = {
        workflow: subView,
        brand_text: subView === 'dance_map' && brandMode === 'text' ? brandText.trim() : null,
        brand_json: parsedJson,
        audience_mode: audienceMode,
        audience_filters: filters,
        joy_pattern_rules: joyPatternRules.map(r => ({
          item_id: r.item_id, kind: r.kind, criterion: r.criterion,
          fielding_ids: r.fielding_ids,
        })),
        logical_operator: effectiveOperator,
      };
      const res = await fetch('/.netlify/functions/bjl-joy-map', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody),
      }));
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Sync endpoint failed (${res.status}): ${txt.slice(0,200)}`);
      }
      const { job_id } = await res.json();
      const job = await _bjlPollJob(job_id, undefined, {
        pollIntervalMs: 2500,
        hardCapMs: 8 * 60 * 1000,
      });
      if (job.status === 'error') throw new Error(job.error || 'Job errored without detail.');
      if (!job.finding) throw new Error('Job complete but no finding returned.');
      const parsed = typeof job.finding === 'string' ? JSON.parse(job.finding) : job.finding;
      setFinding(parsed);
    } catch (err) {
      setError(String(err.message || err));
    } finally {
      setRunning(false);
    }
  };

  const handleSwitchToOrAndRun = () => {
    setLogicalOperator('OR');
    handleRun('OR');
  };

  return (
    <div className="joy-map-mode">
      <div className="joy-map-toolbar">
        <button className={`btn ${subView === 'audience_profile' ? 'primary' : 'ghost'}`} onClick={() => { setSubView('audience_profile'); setFinding(null); }}>Audience Joy Profile</button>
        <button className={`btn ${subView === 'dance_map' ? 'primary' : 'ghost'}`} onClick={() => { setSubView('dance_map'); setFinding(null); }}>Dance Map</button>
      </div>

      <div className="joy-map-inputs">
        <div className="joy-map-input-group">
          <div className="joy-map-input-label-row">
            <span className="joy-map-input-label">Audience definition</span>
            <span className="joy-map-cohort-n-live">
              Cohort n: {cohortNLoading ? '…' : (cohortN !== null ? cohortN.toLocaleString() : '—')}
            </span>
          </div>

          <div className="joy-map-audience-sub">
            <div className="joy-map-audience-sub-title">Demographics <span className="joy-map-optional">(optional)</span></div>
            <div className="joy-map-filter-grid">
              {Object.entries(JOY_MAP_FILTERS).map(([k, def]) => (
                <label className="joy-map-filter" key={k}>
                  <span className="joy-map-filter-label">{def.label}</span>
                  <select
                    value={filters[k] || ''}
                    onChange={(e) => setFilters({ ...filters, [k]: e.target.value || undefined })}>
                    <option value="">Any</option>
                    {def.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                  </select>
                </label>
              ))}
            </div>
          </div>

          <div className="joy-map-audience-sub">
            <div className="joy-map-audience-sub-title">Joy pattern <span className="joy-map-optional">(optional)</span></div>
            <JoyPatternFreetextBuilder
              rules={joyPatternRules}
              onSetRules={setJoyPatternRules}
              operator={logicalOperator}
              onSetOperator={setLogicalOperator}
            />
          </div>

          {blockedOnCrossFieldingAnd && (
            <div className="joy-map-crossfielding-warning">
              <div className="joy-map-crossfielding-title">Cross-fielding rules detected</div>
              <div className="joy-map-crossfielding-body">
                These rules were fielded in different survey waves and have no overlapping respondents. No individual answered both items. To proceed, either:
                <ul>
                  <li>Switch the logical operator to OR (combines the two populations into a union)</li>
                  <li>Pick alternative items from the same fielding wave (use "See alternative matches" on each rule)</li>
                </ul>
              </div>
              <button className="btn primary" onClick={handleSwitchToOrAndRun} disabled={running}>
                Switch to OR and run
              </button>
            </div>
          )}
        </div>

        {subView === 'dance_map' && (
          <div className="joy-map-input-group">
            <div className="joy-map-input-label">Brand input</div>
            <div className="joy-map-brand-toggle">
              <button className={`btn ${brandMode === 'text' ? 'primary' : 'ghost'}`} onClick={() => setBrandMode('text')}>Free text</button>
              <button className={`btn ${brandMode === 'json' ? 'primary' : 'ghost'}`} onClick={() => setBrandMode('json')}>Waldo JSON</button>
            </div>
            {brandMode === 'text' ? (
              <textarea
                className="joy-map-brand-textarea"
                placeholder="Paste brand offering text — positioning statement, brand story, or messaging language."
                value={brandText}
                onChange={(e) => setBrandText(e.target.value)}
                rows={5}
              />
            ) : (
              <textarea
                className="joy-map-brand-textarea"
                placeholder='Paste Waldo JSON. Minimal stub shape: {"brand_offering": "..."}'
                value={brandJson}
                onChange={(e) => setBrandJson(e.target.value)}
                rows={6}
              />
            )}
          </div>
        )}

        <div className="joy-map-actions">
          <button className="btn primary" disabled={running || blockedOnCrossFieldingAnd} onClick={() => handleRun()}>
            {running ? 'Running…' : 'Run'}
          </button>
        </div>
      </div>

      {error && <div className="joy-map-error">Error: {error}</div>}
      {running && !finding && <div className="joy-map-loading">Running joy-map pipeline…</div>}
      {finding && finding.workflow === 'dance_map' && <JoyMapDanceMapResults finding={finding} />}
      {finding && finding.workflow === 'audience_profile' && <JoyMapProfileResults finding={finding} />}
    </div>
  );
};

/* =========================================================================
 * 13. App root — shell + mode switching + shared state.
 * ========================================================================= */
const WelcomeModal = ({ onDismiss }) => (
  <div className="welcome-overlay" onClick={onDismiss}>
    <div className="welcome-modal" onClick={(e) => e.stopPropagation()}>
      <img src="assets/bjl-logo.png" alt="Brand Joy Lab" className="welcome-logo" />
      <h1 className="welcome-title">Welcome to the Brand Joy Lab.</h1>
      <p className="welcome-subtitle">Built for the curious.</p>
      <button className="btn primary welcome-cta" onClick={onDismiss}>Let's go</button>
    </div>
  </div>
);

const App = ({ authedUser = null, onSignOut = null } = {}) => {
  const [mode, setMode] = useState(() => {
    const saved = localStorage.getItem("bjl_mode_v2");
    return saved === "batch" ? "outreach" : (saved || "intelligence");
  });
  const [drawerOpen, setDrawerOpen] = useState(true);
  const [drawerFilter, setDrawerFilter] = useState("all");
  const [evidenceRows, setEvidenceRows] = useState([]);
  const [strategistContext, setStrategistContext] = useState("");
  // Session key: incrementing this forces the active mode component to remount,
  // wiping its local state (conversation turns, loaded Waldo files, draft
  // results, etc.) without lifting every piece of state into App.
  const [sessionKey, setSessionKey] = useState(0);
  const newSession = () => {
    setEvidenceRows([]);
    setSessionKey(k => k + 1);
  };
  // Welcome modal shows on every page load (refresh / new tab). It is NOT
  // shown when the user clicks "New session" — that button is an in-tool
  // soft reset and doesn't trigger a reload, so no persistence is needed.
  const [showWelcome, setShowWelcome] = useState(true);
  const dismissWelcome = () => setShowWelcome(false);

  useEffect(() => { localStorage.setItem("bjl_mode_v2", mode); }, [mode]);

  // Migrate legacy "batch" mode value to "outreach" — Batch has been folded
  // into Outreach. Also guards against stale localStorage after this change.
  useEffect(() => { if (mode === "batch") setMode("outreach"); }, [mode]);

  // Keep-warm: ping /api/claude on mount so the function is hot when the user acts
  useEffect(() => {
    fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1, messages: [{ role: "user", content: "." }] }),
    }).catch(() => {});
  }, []);

  const crumbs = {
    intelligence: ["Workbench", "Intelligence engine", "Ask the Lab"],
    outreach:     ["Workbench", "Outreach", "Accounts"],
    joy_map:      ["Workbench", "Joy Map"],
  }[mode] || ["Workbench"];

  const showDrawer = drawerOpen && mode !== "outreach" && mode !== "joy_map";

  return (
    <div className="app" data-screen-label={`BJL · ${mode}`}>
      <Rail mode={mode} setMode={setMode} />
      <div className="main">
        <TopBar
          crumbs={crumbs}
          actions={
            <>
              {mode === "intelligence" && (
                <button className="btn ghost" onClick={() => setDrawerOpen(!drawerOpen)}>
                  <Icon name="evidence" size={13} />{drawerOpen ? "Hide evidence" : "Show evidence"}
                </button>
              )}
              <button className="btn" onClick={newSession}>
                <Icon name="plus" size={12} /> New session
              </button>
              <button className="btn ghost icon-only" title="About the Lab"
                onClick={() => setShowWelcome(true)}>?</button>
              {authedUser && (
                <div className="bjl-user-menu" title={authedUser.email}>
                  <span className="bjl-user-email">{authedUser.email}</span>
                  {onSignOut && (
                    <button className="btn ghost bjl-user-signout" onClick={onSignOut}>Sign out</button>
                  )}
                </div>
              )}
            </>
          }
        />
        <div className={`body ${showDrawer ? "" : "no-drawer"}`}>
          <div style={mode === "outreach"
            ? {minHeight: 0, display: "flex", flexDirection: "column", overflow: "auto"}
            : {overflow: "hidden", minHeight: 0, display: "flex", flexDirection: "column"}}>
            {mode === "intelligence" && <IntelligenceMode
              key={`intel-${sessionKey}`}
              setEvidenceRows={setEvidenceRows}
              strategistContext={strategistContext}
              setStrategistContext={setStrategistContext} />}
            {mode === "outreach" && <BatchMode
              key={`outreach-${sessionKey}`}
              strategistContext={strategistContext}
              setStrategistContext={setStrategistContext} />}
            {mode === "joy_map" && <JoyMapMode
              key={`joymap-${sessionKey}`} />}
          </div>
          {showDrawer && <EvidenceDrawer rows={evidenceRows} filter={drawerFilter} onFilter={setDrawerFilter} />}
        </div>
      </div>
      {showWelcome && <WelcomeModal onDismiss={dismissWelcome} />}
    </div>
  );
};

/* =========================================================================
 * AuthGate — Microsoft 365 SSO via Supabase Auth.
 *
 * Wraps <App />. On boot:
 *   1. fetch /api/bjl-config → { supabaseUrl, supabaseAnonKey, authEnforced }
 *   2. if authEnforced is false (pre-Azure-live), render App directly.
 *   3. otherwise initialize Supabase client, check existing session,
 *      render LoginScreen / RejectedScreen / App accordingly.
 *
 * Exposes window.__bjlAuth = { getToken, signOut, user, enforced } so the
 * existing fetch helpers (authedFetchInit) can attach Bearer tokens. Also
 * exposes window.__bjlRejected(email) so functions can flip the user to
 * the rejected screen if a 403 not_whitelisted comes back from the API
 * (covers the case where MS auth succeeds but the email isn't whitelisted).
 * ========================================================================= */

const LoginScreen = ({ onSignIn, signingIn }) => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <img src="assets/bjl-logo.png" alt="Brand Joy Lab" className="bjl-auth-logo" />
      <h1 className="bjl-auth-title">Welcome to the Brand Joy Lab.</h1>
      <p className="bjl-auth-subtitle">Sign in with your PETERMAYER Microsoft account to continue.</p>
      <button
        className="btn primary bjl-auth-cta"
        onClick={onSignIn}
        disabled={signingIn}
      >
        {signingIn ? "Redirecting…" : "Sign in with Microsoft"}
      </button>
    </div>
  </div>
);

const RejectedScreen = ({ email, onRetry }) => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <h1 className="bjl-auth-title">Access not authorized</h1>
      <p className="bjl-auth-subtitle">
        You're signed in as <strong>{email || "(unknown)"}</strong>, but this email isn't on the BJL Intelligence Engine whitelist.
      </p>
      <p className="bjl-auth-subtitle">
        Contact Eli at <a href="mailto:haddowe@peteramayer.com">haddowe@peteramayer.com</a> to request access.
      </p>
      <button className="btn ghost bjl-auth-cta" onClick={onRetry}>Sign out and try a different account</button>
    </div>
  </div>
);

const AuthLoadingScreen = () => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <img src="assets/bjl-logo.png" alt="Brand Joy Lab" className="bjl-auth-logo" />
      <p className="bjl-auth-subtitle">Loading…</p>
    </div>
  </div>
);

const AuthGate = () => {
  const [config, setConfig] = useState(null);
  const [client, setClient] = useState(null);
  const [session, setSession] = useState(null);
  // authState: 'loading' | 'login' | 'authed' | 'rejected'
  const [authState, setAuthState] = useState("loading");
  const [rejectedEmail, setRejectedEmail] = useState(null);
  const [signingIn, setSigningIn] = useState(false);

  // Boot: load config, init client, hydrate session
  useEffect(() => {
    let cancelled = false;
    fetch("/api/bjl-config", { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((cfg) => {
        if (cancelled) return;
        if (!cfg) {
          // Config endpoint failed — fall through to authed=true to preserve
          // legacy behavior. The function-level gate is the real enforcement
          // layer; if AUTH_ENFORCED=true on the server, the user will get
          // a 401 from the API and signOut will fire.
          console.warn("[AuthGate] /api/bjl-config failed; falling back to authed=true");
          setConfig({ authEnforced: false });
          setAuthState("authed");
          return;
        }
        setConfig(cfg);

        // Pre-Azure-live: AUTH_ENFORCED is not set. Skip the gate entirely.
        if (!cfg.authEnforced) {
          setAuthState("authed");
          return;
        }

        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase || !window.supabase.createClient) {
          console.error("[AuthGate] missing supabase config or library; cannot enforce auth");
          setAuthState("login");
          return;
        }
        const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        setClient(sb);
        sb.auth.getSession().then(({ data }) => {
          if (cancelled) return;
          if (data && data.session) {
            setSession(data.session);
            setAuthState("authed");
          } else {
            setAuthState("login");
          }
        });
        sb.auth.onAuthStateChange((event, sess) => {
          if (sess) {
            setSession(sess);
            setAuthState((prev) => (prev === "rejected" ? "rejected" : "authed"));
          } else {
            setSession(null);
            setAuthState("login");
          }
        });
      })
      .catch((e) => {
        console.error("[AuthGate] boot threw:", e);
        if (!cancelled) setAuthState("login");
      });
    return () => { cancelled = true; };
  }, []);

  const signIn = useCallback(() => {
    if (!client) return;
    setSigningIn(true);
    client.auth.signInWithOAuth({
      provider: "azure",
      options: {
        scopes: "openid email profile",
        redirectTo: window.location.origin,
      },
    });
  }, [client]);

  const signOut = useCallback(async () => {
    setRejectedEmail(null);
    if (client) {
      try { await client.auth.signOut(); } catch (e) { console.warn("[AuthGate] signOut threw:", e); }
    }
    setSession(null);
    setAuthState("login");
  }, [client]);

  // Expose globals for the fetch helpers to read at call time.
  useEffect(() => {
    window.__bjlAuth = {
      getToken: () => (session && session.access_token) || null,
      signOut,
      user: session && session.user ? {
        id: session.user.id,
        email: session.user.email,
        name: (session.user.user_metadata && session.user.user_metadata.name) || null
      } : null,
      enforced: !!(config && config.authEnforced),
    };
    window.__bjlRejected = (email) => {
      setRejectedEmail(email);
      setAuthState("rejected");
    };
    return () => {
      // Cleanup on unmount only (component lives for the page lifetime)
    };
  }, [session, signOut, config]);

  if (authState === "loading") return <AuthLoadingScreen />;
  if (authState === "rejected") return <RejectedScreen email={rejectedEmail} onRetry={signOut} />;
  if (authState === "login") return <LoginScreen onSignIn={signIn} signingIn={signingIn} />;

  // authed — render the main app, passing user info + sign-out
  const user = (session && session.user) ? {
    id: session.user.id,
    email: session.user.email,
    name: (session.user.user_metadata && session.user.user_metadata.name) || null
  } : null;
  return <App authedUser={user} onSignOut={config && config.authEnforced ? signOut : null} />;
};

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);
  </script>
</body>
</html>
