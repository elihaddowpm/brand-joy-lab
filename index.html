const BatchEmailRow = ({ result, onUpdate }) => {
  const { contact, text, error, sources, polished, scorecard, revisionHistory, humanReviewRequired, brief, dismissed, approved } = result;
  const { subject, body } = parseSubjectBody(text || "");
  const [editSubject, setEditSubject] = useState(subject);
  const [editBody, setEditBody] = useState(body);
  const bodyRef = useRef(null);

  useEffect(() => {
    setEditSubject(subject);
    setEditBody(body);
  }, [text]);

  useEffect(() => {
    if (bodyRef.current) {
      bodyRef.current.style.height = "auto";
      bodyRef.current.style.height = bodyRef.current.scrollHeight + "px";
    }
  }, [editBody]);

  const hasEdits = editSubject !== subject || editBody !== body;

  const composeText = () => editSubject
    ? "Subject: " + editSubject + "\n\n" + editBody
    : editBody;

  const handleSaveApprove = () => {
    if (typeof onUpdate !== "function") return;
    const newText = composeText();
    // Only edited drafts feed the corpus — they're the high-signal examples.
    const wasEdited = newText !== (result.originalGenerated || result.text);
    if (wasEdited) {
      postApprovedEmail(result, { subject: editSubject, body: editBody, finalText: newText });
    }
    onUpdate(prev => ({
      ...prev,
      text: newText,
      approved: true,
      approvedAt: new Date().toISOString(),
      originalGenerated: prev.originalGenerated || prev.text,
      userEdited: newText !== (prev.originalGenerated || prev.text),
    }));
  };

  const handleDiscardEdits = () => {
    setEditSubject(subject);
    setEditBody(body);
  };

  const copyText = () => navigator.clipboard.writeText(composeText());

  const subjInputStyle = {
    flex: 1, border: "none", background: "transparent",
    font: "inherit", color: "inherit", outline: "none", padding: 0,
  };
  const bodyTextareaStyle = {
    width: "100%", border: "none", background: "transparent",
    font: "inherit", color: "inherit", outline: "none",
    padding: 0, margin: 0, resize: "none", overflow: "hidden",
    whiteSpace: "pre-wrap", lineHeight: 1.55,
  };
  const btnStyle = {
    fontSize: 12, padding: "4px 10px",
    border: "1px solid var(--grey-4, #d5d5d5)", borderRadius: 3,
    background: "white", color: "var(--grey-1)", cursor: "pointer",
    fontFamily: "inherit",
  };
  const primaryBtnStyle = {
    ...btnStyle,
    background: approved && !hasEdits ? "#e8f5e9" : "var(--grey-1, #222)",
    color: approved && !hasEdits ? "#2a7a2a" : "white",
    borderColor: approved && !hasEdits ? "#bcd9bc" : "var(--grey-1, #222)",
  };

  return (
    <div className="row-email v2 expanded" style={approved ? { borderLeft: "3px solid #4caf50" } : undefined}>
      <div className="re-head">
        <div>
          <div className="re-to">{contact.name}</div>
          <div className="re-role">{[contact.role, contact.email].filter(Boolean).join(" · ")}</div>
        </div>
        <div className="re-subj" style={{ display: "flex", gap: 6, alignItems: "baseline" }}>
          <span className="sub-label">Subj</span>
          <input
            type="text"
            value={editSubject}
            onChange={e => setEditSubject(e.target.value)}
            placeholder="(no subject)"
            disabled={!!error}
            style={subjInputStyle}
          />
        </div>
        <div className="re-actions">
          {!error && (
            <button className="icon-btn" title="Copy" onClick={copyText}>
              <Icon name="copy" />
            </button>
          )}
        </div>
      </div>
      {error ? (
        <div className="re-error">Failed: {error}</div>
      ) : (
        <>
          <textarea
            ref={bodyRef}
            value={editBody}
            onChange={e => setEditBody(e.target.value)}
            style={bodyTextareaStyle}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center" }}>
            <button
              type="button"
              style={primaryBtnStyle}
              onClick={handleSaveApprove}
              disabled={approved && !hasEdits}
              title={approved && !hasEdits ? "Already approved" : (hasEdits ? "Save your edits and approve this email" : "Approve this email as the example")}
            >
              {approved && !hasEdits ? "✓ Approved" : (hasEdits ? "Save edits & approve" : "Approve")}
            </button>
            {hasEdits ? (
              <button type="button" style={btnStyle} onClick={handleDiscardEdits} title="Revert your edits">
                Discard edits
              </button>
            ) : null}
            {approved && hasEdits ? (
              <span style={{ fontSize: 11, color: "var(--grey-2)" }}>
                unsaved edits since last approval
              </span>
            ) : null}
          </div>
          <EmailSources
            sources={sources}
            polished={polished}
            scorecard={scorecard}
            revisionHistory={revisionHistory}
            humanReviewRequired={humanReviewRequired}
            brief={brief}
            text={text}
            dismissed={dismissed}
            onUpdate={onUpdate}
          />
        </>
      )}
    </div>
  );
};

const JoyMapDeltaBadge = ({ cohortValue, corpusValue, metricLabel }) => {
  const c = Number(cohortValue);
  const x = Number(corpusValue);
  if (!Number.isFinite(c) || !Number.isFinite(x)) return null;
  const delta = c - x;
  if (Math.abs(delta) < 1) return null;
  const sign = delta > 0 ? '+' : '';
  const unit = metricLabel === 'JI' ? '' : 'pp';
  const rounded = metricLabel === 'JI' ? Math.round(delta) : Math.round(delta * 10) / 10;
  const tone = delta > 0 ? 'positive' : 'negative';
  return <span className={`joy-map-delta-badge joy-map-delta-${tone}`}>{sign}{rounded}{unit}</span>;
};

const JoyMapMiniGauge = ({ value, metricLabel, accent }) => {
  const v = Number(value);
  if (!Number.isFinite(v)) return null;
  let max, ref1, ref2;
  if (metricLabel === 'JI') { max = 100; ref1 = 60; ref2 = 70; }
  else if (metricLabel === 'Tag rate') { max = 25; ref1 = 5; ref2 = 15; }
  else { max = 100; ref1 = 50; ref2 = 65; }
  const clamped = Math.max(0, Math.min(v, max));
  const pct = (clamped / max) * 100;
  const ref1Pct = (ref1 / max) * 100;
  const ref2Pct = (ref2 / max) * 100;
  return (
    <div className="joy-map-mini-gauge" aria-hidden="true">
      <div className="joy-map-mini-gauge-bar">
        <div className="joy-map-mini-gauge-tick" style={{ left: `${ref1Pct}%` }} />
        <div className="joy-map-mini-gauge-tick" style={{ left: `${ref2Pct}%` }} />
        <div className="joy-map-mini-gauge-dot" style={{ left: `${pct}%`, background: accent }} />
      </div>
      <div className="joy-map-mini-gauge-scale">
        <span>0</span>
        <span style={{ left: `${ref1Pct}%` }}>{ref1}{metricLabel === 'JI' ? '' : '%'}</span>
        <span style={{ left: `${ref2Pct}%` }}>{ref2}{metricLabel === 'JI' ? '' : '%'}</span>
        <span style={{ right: 0 }}>{max}{metricLabel === 'JI' ? '' : '%'}</span>
      </div>
    </div>
  );
};

  // Audience Map state
  const [amDescription, setAmDescription] = useState('');
  const [amRunning, setAmRunning] = useState(false);
  const [amError, setAmError] = useState(null);
  const [amFinding, setAmFinding] = useState(null);
  const [recentMaps, setRecentMaps] = useState([]);
  // Dance Map state
  const [dmSelectedMapId, setDmSelectedMapId] = useState(null);
  const [dmBrandMode, setDmBrandMode] = useState('text');
  const [dmBrandText, setDmBrandText] = useState('');
  const [dmBrandJson, setDmBrandJson] = useState('');
  const [dmRunning, setDmRunning] = useState(false);
  const [dmError, setDmError] = useState(null);
  const [dmFinding, setDmFinding] = useState(null);

  const handleAudienceMapRun = async () => {
    setAmError(null);
    setAmFinding(null);
    if (!amDescription.trim()) { setAmError('Audience description is required.'); return; }
    setAmRunning(true);
    try {
      const res = await fetch('/.netlify/functions/bjl-audience-map', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ description: amDescription.trim() }),
      }));
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`audience-map enqueue failed (${res.status}): ${txt.slice(0, 200)}`);
      }
      const { job_id } = await res.json();
      const job = await _bjlPollJob(job_id, undefined, {
        pollIntervalMs: 2500,
        hardCapMs: 8 * 60 * 1000,
      });
      if (job.status === 'error') throw new Error(job.error || 'Audience Map job errored without detail.');
      if (!job.finding) throw new Error('Audience Map job complete but no finding returned.');
      const parsed = typeof job.finding === 'string' ? JSON.parse(job.finding) : job.finding;
      if (parsed.unresolved) {
        setAmError(parsed.unresolved_reason || 'Audience description could not be routed.');
        setAmFinding(parsed);
        return;
      }
      if (parsed.low_n_refused) {
        setAmError(parsed.message || `Reverse-engineered audience too small (n=${parsed.reverse_engineered_cohort_n}).`);
        setAmFinding(parsed);
        return;
      }
      setAmFinding(parsed);
      // Add to recent maps (most recent first, dedupe by job_id)
      setRecentMaps(prev => [
        {
          job_id,
          description: amDescription.trim(),
          routing_notice: parsed.routing && parsed.routing.routing_notice,
          reverse_engineered_cohort_n: parsed.reverse_engineered_cohort_n,
          completed_at: new Date().toISOString(),
        },
        ...prev.filter(m => m.job_id !== job_id),
      ].slice(0, 10));
      setDmSelectedMapId(job_id);
    } catch (err) {
      setAmError(String(err.message || err));
    } finally {
      setAmRunning(false);
    }
  };

  const handleDanceMapRun = async () => {
    setDmError(null);
    setDmFinding(null);
    if (!dmSelectedMapId) {
      setDmError('Select an Audience Map first (create one in the Audience Map tab).');
      return;
    }
    let parsedJson = null;
    if (dmBrandMode === 'json' && dmBrandJson.trim()) {
      try { parsedJson = JSON.parse(dmBrandJson); }
      catch (e) { setDmError('Brand JSON did not parse: ' + e.message); return; }
    }
    if (dmBrandMode === 'text' && !dmBrandText.trim()) {
      setDmError('Provide brand text or paste Waldo JSON.'); return;
    }
    setDmRunning(true);
    try {
      const requestBody = {
        workflow: 'dance_map',
        brand_text: dmBrandMode === 'text' ? dmBrandText.trim() : null,
        brand_json: parsedJson,
        audience_map_job_id: dmSelectedMapId,
      };
      const res = await fetch('/.netlify/functions/bjl-joy-map', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody),
      }));
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Dance Map enqueue failed (${res.status}): ${txt.slice(0,200)}`);
      }
      const { job_id } = await res.json();
      const job = await _bjlPollJob(job_id, undefined, {
        pollIntervalMs: 2500,
        hardCapMs: 8 * 60 * 1000,
      });
      if (job.status === 'error') throw new Error(job.error || 'Dance Map job errored without detail.');
      if (!job.finding) throw new Error('Dance Map job complete but no finding returned.');
      const parsed = typeof job.finding === 'string' ? JSON.parse(job.finding) : job.finding;
      setDmFinding(parsed);
    } catch (err) {
      setDmError(String(err.message || err));
    } finally {
      setDmRunning(false);
    }
  };

  return (
    <div className="joy-map-mode">
      <div className="joy-map-toolbar">
        <button className={`btn ${subView === 'audience_map' ? 'primary' : 'ghost'}`} onClick={() => setSubView('audience_map')}>Audience Map</button>
        <button className={`btn ${subView === 'dance_map' ? 'primary' : 'ghost'}`} onClick={() => setSubView('dance_map')}>Dance Map</button>
      </div>

      {subView === 'audience_map' && (
        <div className="joy-map-inputs">
          <div className="joy-map-input-group">
            <div className="joy-map-input-label">Audience description</div>
            <textarea
              className="joy-map-brand-textarea"
              placeholder="Describe the audience you want to map. Examples: 'Rock and Roll Hall of Fame fans', 'people who love music and museums', 'millennial parents in the Southeast', 'QSR customers who care about value'."
              value={amDescription}
              onChange={(e) => setAmDescription(e.target.value)}
              rows={4}
            />
          </div>
          <div className="joy-map-actions">
            <button className="btn primary" disabled={amRunning || !amDescription.trim()} onClick={handleAudienceMapRun}>
              {amRunning ? 'Running…' : 'Run'}
            </button>
          </div>
          {amError && <div className="joy-map-error">Error: {amError}</div>}
          {amRunning && !amFinding && <div className="joy-map-loading">Building Audience Map (4 passes — routing, profile, synthesis, reverse-engineer)…</div>}
          {amFinding && !amFinding.unresolved && !amFinding.low_n_refused && <AudienceMapResults finding={amFinding} />}
        </div>
      )}

      {subView === 'dance_map' && (
        <div className="joy-map-inputs">
          <div className="joy-map-input-group">
            <div className="joy-map-input-label">Audience Map</div>
            {recentMaps.length === 0 ? (
              <div className="joy-map-empty-state">
                <div>No Audience Maps in this session yet.</div>
                <button className="btn primary" onClick={() => setSubView('audience_map')}>Create an Audience Map first</button>
              </div>
            ) : (
              <div className="joy-map-am-picker">
                {recentMaps.map(m => (
                  <label key={m.job_id} className={`joy-map-am-option ${dmSelectedMapId === m.job_id ? 'selected' : ''}`}>
                    <input
                      type="radio"
                      name="dm-audience-map"
                      value={m.job_id}
                      checked={dmSelectedMapId === m.job_id}
                      onChange={() => setDmSelectedMapId(m.job_id)}
                    />
                    <div className="joy-map-am-option-body">
                      <div className="joy-map-am-option-desc">"{m.description}"</div>
                      <div className="joy-map-am-option-meta">
                        {m.routing_notice}{typeof m.reverse_engineered_cohort_n === 'number' ? ` · n=${m.reverse_engineered_cohort_n.toLocaleString()}` : ''}
                      </div>
                    </div>
                  </label>
                ))}
              </div>
            )}
          </div>

          <div className="joy-map-input-group">
            <div className="joy-map-input-label">Brand input</div>
            <div className="joy-map-brand-toggle">
              <button className={`btn ${dmBrandMode === 'text' ? 'primary' : 'ghost'}`} onClick={() => setDmBrandMode('text')}>Free text</button>
              <button className={`btn ${dmBrandMode === 'json' ? 'primary' : 'ghost'}`} onClick={() => setDmBrandMode('json')}>Waldo JSON</button>
            </div>
            {dmBrandMode === 'text' ? (
              <textarea
                className="joy-map-brand-textarea"
                placeholder="Paste brand offering text — positioning statement, brand story, or messaging language."
                value={dmBrandText}
                onChange={(e) => setDmBrandText(e.target.value)}
                rows={5}
              />
            ) : (
              <textarea
                className="joy-map-brand-textarea"
                placeholder='Paste Waldo JSON. The source-aware parser will extract brand emphasis, tactical signals, and friction points.'
                value={dmBrandJson}
                onChange={(e) => setDmBrandJson(e.target.value)}
                rows={6}
              />
            )}
          </div>

          <div className="joy-map-actions">
            <button className="btn primary" disabled={dmRunning || !dmSelectedMapId} onClick={handleDanceMapRun}>
              {dmRunning ? 'Running…' : 'Run'}
            </button>
          </div>

          {dmError && <div className="joy-map-error">Error: {dmError}</div>}
          {dmRunning && !dmFinding && <div className="joy-map-loading">Running Dance Map synthesis…</div>}
          {dmFinding && <JoyMapDanceMapResults finding={dmFinding} />}
        </div>
      )}
    </div>
  );
};

/* =========================================================================
 * 12c. PublicCorpusMode — review queue for Public Joy Lab Chat (v6).
 *      Staged insights (published=false) get reviewed, edited, and
 *      flipped live here. Captured visitor questions
 *      (bjl_public_questions) sit alongside as the lead-handling queue.
 * ========================================================================= */

const PublicCorpusMode = () => {
  const [tab, setTab] = useState('insights');  // 'insights' | 'questions' | 'analytics'
  const [insights, setInsights] = useState([]);
  const [questions, setQuestions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [busyId, setBusyId] = useState(null);

  const reload = async () => {
    setLoading(true); setError(null);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus?action=list_all', authedFetchInit());
      if (!r.ok) throw new Error(`load failed (${r.status})`);
      const j = await r.json();
      setInsights(j.insights || []);
      setQuestions(j.questions || []);
    } catch (err) { setError(String(err.message || err)); }
    finally { setLoading(false); }
  };
  useEffect(() => { reload(); }, []);

  const stagedCount = insights.filter(i => !i.published).length;
  const liveCount   = insights.filter(i =>  i.published).length;
  const newCount    = questions.filter(q => q.status === 'new').length;

  const patchInsight = async (id, patch) => {
    setBusyId(id);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update_insight', id, ...patch }),
      }));
      // v7.3 — surface the actual reason a publish/update fails. The DB has
      // BEFORE-UPDATE triggers that reject rows naming gated entities, plus
      // backend validators that reject malformed patches. Both return 400
      // with a structured { error } body; the old `update failed (${r.status})`
      // wrapper threw that detail away, leaving Eli with no diagnostic.
      if (!r.ok) {
        const reason = await r.json().catch(() => null);
        const detail = reason && reason.error ? `: ${reason.error}` : '';
        throw new Error(`update failed (${r.status})${detail}`);
      }
      const j = await r.json();
      setInsights(prev => prev.map(i => i.id === id ? j.insight : i));
      setEditingId(null);
    } catch (err) { setError(String(err.message || err)); }
    finally { setBusyId(null); }
  };

  const deleteInsight = async (id) => {
    if (!window.confirm('Delete this insight permanently? This cannot be undone.')) return;
    setBusyId(id);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete_insight', id }),
      }));
      if (!r.ok) throw new Error(`delete failed (${r.status})`);
      setInsights(prev => prev.filter(i => i.id !== id));
    } catch (err) { setError(String(err.message || err)); }
    finally { setBusyId(null); }
  };

  const setQuestionStatus = async (id, status) => {
    setBusyId(id);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update_question', id, status }),
      }));
      if (!r.ok) throw new Error(`update failed (${r.status})`);
      const j = await r.json();
      setQuestions(prev => prev.map(q => q.id === id ? j.question : q));
    } catch (err) { setError(String(err.message || err)); }
    finally { setBusyId(null); }
  };

  return (
    <div className="public-corpus-mode">
      <div className="public-corpus-tabs">
        <button className={`btn ${tab === 'insights' ? 'primary' : 'ghost'}`} onClick={() => setTab('insights')}>
          Insights · {stagedCount} staged / {liveCount} live
        </button>
        <button className={`btn ${tab === 'questions' ? 'primary' : 'ghost'}`} onClick={() => setTab('questions')}>
          Captured questions · {newCount} new
        </button>
        <button className={`btn ${tab === 'analytics' ? 'primary' : 'ghost'}`} onClick={() => setTab('analytics')}>
          Analytics
        </button>
        <button className="btn ghost" onClick={reload} disabled={loading}>{loading ? 'Loading…' : 'Refresh'}</button>
        {tab === 'insights' && (
          <PromoteToPublicButton defaults={{
            title: '', insight: '', stat: '', category: '',
            topic_tags: [], question_framings: [],
            confidence: 'high', created_from: 'manual_stage',
          }} />
        )}
        <PublicCorpusOpsButtons />
      </div>

      {error && <div className="joy-map-error">Error: {error}</div>}

      {tab === 'insights' && (
        <div className="public-corpus-insights">
          {insights.length === 0 && !loading && (
            <div className="public-corpus-empty">
              No insights yet. Stage one from a finding via the "Publish to public" button on a Joy Map or Intelligence result.
            </div>
          )}
          {insights.map(ins => (
            <PublicInsightCard
              key={ins.id}
              insight={ins}
              editing={editingId === ins.id}
              busy={busyId === ins.id}
              onEdit={() => setEditingId(ins.id)}
              onCancelEdit={() => setEditingId(null)}
              onSave={(patch) => patchInsight(ins.id, patch)}
              onTogglePublish={() => patchInsight(ins.id, { published: !ins.published })}
              onDelete={() => deleteInsight(ins.id)}
            />
          ))}
        </div>
      )}

      {tab === 'questions' && (
        <div className="public-corpus-questions">
          {questions.length === 0 && !loading && (
            <div className="public-corpus-empty">No captured questions yet.</div>
          )}
          {questions.map(q => (
            <div key={q.id} className={`public-question-card status-${q.status}`}>
              <div className="public-question-head">
                <span className={`public-question-status status-${q.status}`}>{q.status}</span>
                <span className="public-question-when">{new Date(q.created_at).toLocaleString()}</span>
                {q.category_guess && <span className="public-question-category">{q.category_guess}</span>}
              </div>
              <div className="public-question-body">"{q.question}"</div>
              {q.email && <div className="public-question-email">↳ {q.email}</div>}
              {Array.isArray(q.matched_insight_slugs) && q.matched_insight_slugs.length > 0 && (
                <div className="public-question-closest">
                  Closest offered: {q.matched_insight_slugs.join(', ')}
                </div>
              )}
              <div className="public-question-actions">
                {q.status !== 'reviewing' && <button className="btn ghost" disabled={busyId === q.id} onClick={() => setQuestionStatus(q.id, 'reviewing')}>Mark reviewing</button>}
                {q.status !== 'answered'  && <button className="btn ghost" disabled={busyId === q.id} onClick={() => setQuestionStatus(q.id, 'answered')}>Mark answered</button>}
                {q.status !== 'closed'    && <button className="btn ghost" disabled={busyId === q.id} onClick={() => setQuestionStatus(q.id, 'closed')}>Close</button>}
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === 'analytics' && <PublicCorpusAnalytics />}
    </div>
  );
};

// v8.6 — Public chat analytics tab. Reads the
// bjl_public_chat_analytics_summary + bjl_public_chat_analytics_daily
// views via bjl-public-corpus?action=analytics. Lifetime + 7d + 30d
// rollup tiles on top; daily table below; manual refresh + CSV export.
const PublicCorpusAnalytics = () => {
  const [data, setData] = useState({ summary: {}, daily: [] });
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lastLoad, setLastLoad] = useState(null);

  const reload = async () => {
    setLoading(true); setError(null);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus?action=analytics', authedFetchInit());
      if (!r.ok) throw new Error(`load failed (${r.status})`);
      const j = await r.json();
      setData({ summary: j.summary || {}, daily: j.daily || [] });
      setLastLoad(new Date());
    } catch (err) { setError(String(err.message || err)); }
    finally { setLoading(false); }
  };
  useEffect(() => { reload(); }, []);

  const fmt = v => (v == null ? '—' : Number(v).toLocaleString());
  const pct = v => (v == null ? '—' : `${Number(v).toFixed(1)}%`);

  const downloadCsv = () => {
    if (!data.daily || data.daily.length === 0) return;
    const header = ['day','unique_visitors','total_queries','converted_visitors','leads_submitted','leads_declined','conversion_rate_pct'];
    const rows = data.daily.map(d => header.map(k => {
      const v = d[k];
      if (v == null) return '';
      const s = String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(','));
    const csv = [header.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `bjl-public-chat-analytics-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  if (error) return <div className="joy-map-error">Error: {error}</div>;
  if (loading && !lastLoad) return <div className="public-corpus-empty">Loading analytics…</div>;

  const s = data.summary || {};

  return (
    <div className="public-corpus-analytics">
      <div className="analytics-toolbar">
        <span className="analytics-updated">
          {lastLoad ? `Updated ${lastLoad.toLocaleTimeString()}` : ''}
        </span>
        <button className="btn ghost" disabled={loading} onClick={reload}>{loading ? 'Refreshing…' : 'Refresh'}</button>
        <button className="btn ghost" disabled={!data.daily || data.daily.length === 0} onClick={downloadCsv}>Export CSV</button>
      </div>

      <div className="analytics-tile-grid">
        <AnalyticsTile label="Unique visitors" rows={[
          { k: 'Lifetime', v: fmt(s.lifetime_visitors) },
          { k: 'Last 30 days', v: fmt(s.visitors_30d) },
          { k: 'Last 7 days',  v: fmt(s.visitors_7d) },
        ]} />
        <AnalyticsTile label="Questions asked" rows={[
          { k: 'Lifetime', v: fmt(s.lifetime_queries) },
          { k: 'Last 30 days', v: fmt(s.queries_30d) },
          { k: 'Last 7 days',  v: fmt(s.queries_7d) },
        ]} />
        <AnalyticsTile label="Leads submitted" rows={[
          { k: 'Lifetime', v: fmt(s.lifetime_leads_submitted) },
          { k: 'Last 30 days', v: fmt(s.leads_submitted_30d) },
          { k: 'Last 7 days',  v: fmt(s.leads_submitted_7d) },
        ]} />
        <AnalyticsTile label="Conversion rate" rows={[
          { k: 'Lifetime', v: pct(s.lifetime_conversion_rate_pct) },
          { k: 'Last 30 days', v: pct(s.conversion_rate_30d_pct) },
          { k: 'Last 7 days',  v: pct(s.conversion_rate_7d_pct) },
        ]} />
        <AnalyticsTile label="Engagement per visitor" rows={[
          { k: 'Mean questions',   v: fmt(s.mean_queries_per_visitor) },
          { k: 'Median questions', v: fmt(s.median_queries_per_visitor) },
          { k: 'Max one visitor',  v: fmt(s.max_queries_one_visitor) },
        ]} />
      </div>

      <div className="analytics-section-title">Daily — last 30 days</div>
      {data.daily.length === 0 ? (
        <div className="public-corpus-empty">No daily activity yet.</div>
      ) : (
        <table className="analytics-daily-table">
          <thead>
            <tr>
              <th>Day</th>
              <th>Visitors</th>
              <th>Questions</th>
              <th>Leads submitted</th>
              <th>Leads declined</th>
              <th>Converted</th>
              <th>Conversion %</th>
            </tr>
          </thead>
          <tbody>
            {data.daily.map(d => (
              <tr key={d.day}>
                <td>{d.day}</td>
                <td>{fmt(d.unique_visitors)}</td>
                <td>{fmt(d.total_queries)}</td>
                <td>{fmt(d.leads_submitted)}</td>
                <td>{fmt(d.leads_declined)}</td>
                <td>{fmt(d.converted_visitors)}</td>
                <td>{pct(d.conversion_rate_pct)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
};

const AnalyticsTile = ({ label, rows }) => (
  <div className="analytics-tile">
    <div className="analytics-tile-label">{label}</div>
    {rows.map((r, i) => (
      <div key={i} className="analytics-tile-row">
        <span className="analytics-tile-k">{r.k}</span>
        <span className="analytics-tile-v">{r.v}</span>
      </div>
    ))}
  </div>
);

const PublicInsightCard = ({ insight, editing, busy, onEdit, onCancelEdit, onSave, onTogglePublish, onDelete }) => {
  const [draft, setDraft] = useState(insight);
  useEffect(() => { setDraft(insight); }, [insight]);

  if (!editing) {
    return (
      <div className={`public-insight-card ${insight.published ? 'live' : 'staged'}`}>
        <div className="public-insight-head">
          <span className={`public-insight-status ${insight.published ? 'live' : 'staged'}`}>
            {insight.published ? 'LIVE' : 'STAGED'}
          </span>
          <span className="public-insight-category">{insight.category}</span>
          <span className="public-insight-confidence">{insight.confidence || 'high'}</span>
          {insight.source_n && <span className="public-insight-n">n={insight.source_n}</span>}
        </div>
        <div className="public-insight-title">{insight.title}</div>
        <div className="public-insight-body">{insight.insight}</div>
        {insight.stat && <div className="public-insight-stat">{insight.stat}</div>}
        {insight.supporting_quote && <div className="public-insight-quote">"{insight.supporting_quote}"</div>}
        <div className="public-insight-meta">
          <div><strong>Slug:</strong> {insight.slug}</div>
          {insight.source_note && <div><strong>Source:</strong> {insight.source_note}</div>}
          {Array.isArray(insight.topic_tags) && insight.topic_tags.length > 0 && (
            <div><strong>Tags:</strong> {insight.topic_tags.join(', ')}</div>
          )}
          {Array.isArray(insight.question_framings) && insight.question_framings.length > 0 && (
            <div><strong>Framings:</strong> {insight.question_framings.map((q, i) => <div key={i} className="public-insight-framing">"{q}"</div>)}</div>
          )}
        </div>
        <div className="public-insight-actions">
          <button className="btn" disabled={busy} onClick={onTogglePublish}>
            {insight.published ? 'Unpublish' : 'Publish'}
          </button>
          <button className="btn ghost" disabled={busy} onClick={onEdit}>Edit</button>

// v6.3 — Operator buttons in the Public Corpus pane for the two routine
// maintenance ops:
//   - Populate embeddings: fills NULL embeddings on insights + verbatim
//     truths, and (one-time, force_all mode) regenerates bjl_laws
//     embeddings so all four layers share the same model.
//   - Refresh score snapshot: recomputes bjl_public_scores from
//     bjl_responses (~45s background job, preserves public_safe).
const PublicCorpusOpsButtons = () => {
  const [running, setRunning] = useState(null);  // 'embed_incremental' | 'embed_force' | 'refresh' | null
  const [lastResult, setLastResult] = useState(null);

  const runEmbed = async (mode) => {
    setRunning(mode === 'force_all' ? 'embed_force' : 'embed_incremental');
    setLastResult(null);
    try {
      const r = await fetch('/.netlify/functions/bjl-embed-public-corpus', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode }),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || j.message || `embed failed (${r.status})`);
      setLastResult({ kind: 'embed', mode, ...j });
    } catch (err) {
      setLastResult({ kind: 'error', error: String(err.message || err) });
    } finally {
      setRunning(null);
    }
  };

  const runRefresh = async () => {
    setRunning('refresh');
    setLastResult(null);
    try {
      const r = await fetch('/.netlify/functions/bjl-refresh-public-scores', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || `refresh failed (${r.status})`);
      setLastResult({ kind: 'refresh', ...j });
    } catch (err) {
      setLastResult({ kind: 'error', error: String(err.message || err) });
    } finally {
      setRunning(null);
    }
  };

  return (
    <div className="public-corpus-ops">
      <button className="btn ghost" disabled={!!running} onClick={() => runEmbed('incremental')}
              title="Embed any rows missing vectors (insights, verbatim truths, laws)">
        {running === 'embed_incremental' ? 'Embedding…' : 'Populate embeddings'}
      </button>
      <button className="btn ghost" disabled={!!running} onClick={() => runEmbed('force_all')}
              title="Re-embed ALL rows. Use once to standardize laws on text-embedding-3-small.">
        {running === 'embed_force' ? 'Re-embedding all…' : 'Re-embed all'}
      </button>
      <button className="btn ghost" disabled={!!running} onClick={runRefresh}
              title="Recompute bjl_public_scores from bjl_responses. Runs in background (~60s).">
        {running === 'refresh' ? 'Refreshing…' : 'Refresh scores'}
      </button>
      {lastResult && lastResult.kind === 'embed' && (
        <span className="public-corpus-ops-result">
          {Object.entries(lastResult.results || {}).map(([t, r]) => `${t}: ${r.embedded} embedded`).join(' · ')}
        </span>
      )}
      {lastResult && lastResult.kind === 'refresh' && (
        <span className="public-corpus-ops-result">{lastResult.message || 'Refresh dispatched.'}</span>
      )}
      {lastResult && lastResult.kind === 'error' && (
        <span className="public-corpus-ops-result error">{lastResult.error}</span>
      )}
    </div>
  );
};

/* =========================================================================
 * AuthGate — Microsoft 365 SSO via Supabase Auth.
 *
 * Wraps <App />. On boot:
 *   1. fetch /api/bjl-config → { supabaseUrl, supabaseAnonKey, authEnforced }
 *   2. if authEnforced is false (pre-Azure-live), render App directly.
 *   3. otherwise initialize Supabase client, check existing session,
 *      render LoginScreen / RejectedScreen / App accordingly.
 *
 * Exposes window.__bjlAuth = { getToken, signOut, user, enforced } so the
 * existing fetch helpers (authedFetchInit) can attach Bearer tokens. Also
 * exposes window.__bjlRejected(email) so functions can flip the user to
 * the rejected screen if a 403 not_whitelisted comes back from the API
 * (covers the case where MS auth succeeds but the email isn't whitelisted).
 * ========================================================================= */

const LoginScreen = ({ onSignIn, signingIn }) => (

    <div className="bjl-auth-card">

  </div>
);

const RejectedScreen = ({ email, onRetry }) => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <h1 className="bjl-auth-title">Access not authorized</h1>
      <p className="bjl-auth-subtitle">
        You're signed in as <strong>{email || "(unknown)"}</strong>, but this email isn't on the BJL Intelligence Engine whitelist.
      </p>
      <p className="bjl-auth-subtitle">
        Contact Eli at <a href="mailto:haddowe@peteramayer.com">haddowe@peteramayer.com</a> to request access.
      </p>
      <button className="btn ghost bjl-auth-cta" onClick={onRetry}>Sign out and try a different account</button>
    </div>
  </div>
);

const AuthLoadingScreen = () => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <img src="assets/bjl-logo.png" alt="Brand Joy Lab" className="bjl-auth-logo" />
      <p className="bjl-auth-subtitle">Loading…</p>
    </div>
  </div>
);

const AuthGate = () => {
  const [config, setConfig] = useState(null);
  const [client, setClient] = useState(null);
  const [session, setSession] = useState(null);
  // authState: 'loading' | 'login' | 'authed' | 'rejected'
  const [authState, setAuthState] = useState("loading");
  const [rejectedEmail, setRejectedEmail] = useState(null);
  const [signingIn, setSigningIn] = useState(false);

  // Boot: load config, init client, hydrate session
  useEffect(() => {
    let cancelled = false;
    fetch("/api/bjl-config", { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((cfg) => {
        if (cancelled) return;
        if (!cfg) {
          // Config endpoint failed — fall through to authed=true to preserve
          // legacy behavior. The function-level gate is the real enforcement
          // layer; if AUTH_ENFORCED=true on the server, the user will get
          // a 401 from the API and signOut will fire.
          console.warn("[AuthGate] /api/bjl-config failed; falling back to authed=true");
          setConfig({ authEnforced: false });
          setAuthState("authed");
          return;
        }
        setConfig(cfg);

        // Pre-Azure-live: AUTH_ENFORCED is not set. Skip the gate entirely.
        if (!cfg.authEnforced) {
          setAuthState("authed");
          return;
        }

        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase || !window.supabase.createClient) {
          console.error("[AuthGate] missing supabase config or library; cannot enforce auth");
          setAuthState("login");
          return;
        }
        const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        setClient(sb);
        sb.auth.getSession().then(({ data }) => {
          if (cancelled) return;
          if (data && data.session) {
            setSession(data.session);
            setAuthState("authed");
          } else {
            setAuthState("login");
          }
        });
        sb.auth.onAuthStateChange((event, sess) => {
          if (sess) {
            setSession(sess);
            setAuthState((prev) => (prev === "rejected" ? "rejected" : "authed"));
          } else {
            setSession(null);
            setAuthState("login");
          }
        });
      })
      .catch((e) => {
        console.error("[AuthGate] boot threw:", e);
        if (!cancelled) setAuthState("login");
      });
    return () => { cancelled = true; };
  }, []);

  const signIn = useCallback(() => {
    if (!client) return;
    setSigningIn(true);
    client.auth.signInWithOAuth({
      provider: "azure",
      options: {
        scopes: "openid email profile",
        redirectTo: window.location.origin,
      },
    });
  }, [client]);

  const signOut = useCallback(async () => {
    setRejectedEmail(null);
    if (client) {
      try { await client.auth.signOut(); } catch (e) { console.warn("[AuthGate] signOut threw:", e); }
    }
    setSession(null);
    setAuthState("login");
  }, [client]);

  // Expose globals for the fetch helpers to read at call time.
  useEffect(() => {
    window.__bjlAuth = {
      getToken: () => (session && session.access_token) || null,
      signOut,
      user: session && session.user ? {
        id: session.user.id,
        email: session.user.email,
        name: (session.user.user_metadata && session.user.user_metadata.name) || null
      } : null,
      enforced: !!(config && config.authEnforced),
    };
    window.__bjlRejected = (email) => {
      setRejectedEmail(email);
      setAuthState("rejected");
    };
    return () => {
      // Cleanup on unmount only (component lives for the page lifetime)
    };
  }, [session, signOut, config]);

  if (authState === "loading") return <AuthLoadingScreen />;
  if (authState === "rejected") return <RejectedScreen email={rejectedEmail} onRetry={signOut} />;
  if (authState === "login") return <LoginScreen onSignIn={signIn} signingIn={signingIn} />;

  // authed — render the main app, passing user info + sign-out
  const user = (session && session.user) ? {
    id: session.user.id,
    email: session.user.email,
    name: (session.user.user_metadata && session.user.user_metadata.name) || null
  } : null;
  return <App authedUser={user} onSignOut={config && config.authEnforced ? signOut : null} />;
};

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);
  </script>
</body>
</html>
