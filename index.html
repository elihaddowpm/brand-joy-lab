const JoyMapDeltaBadge = ({ cohortValue, corpusValue, metricLabel }) => {
  const c = Number(cohortValue);
  const x = Number(corpusValue);
  if (!Number.isFinite(c) || !Number.isFinite(x)) return null;
  const delta = c - x;
  if (Math.abs(delta) < 1) return null;
  const sign = delta > 0 ? '+' : '';
  const unit = metricLabel === 'JI' ? '' : 'pp';
  const rounded = metricLabel === 'JI' ? Math.round(delta) : Math.round(delta * 10) / 10;
  const tone = delta > 0 ? 'positive' : 'negative';
  return <span className={`joy-map-delta-badge joy-map-delta-${tone}`}>{sign}{rounded}{unit}</span>;
};

const JoyMapMiniGauge = ({ value, metricLabel, accent }) => {
  const v = Number(value);
  if (!Number.isFinite(v)) return null;
  let max, ref1, ref2;
  if (metricLabel === 'JI') { max = 100; ref1 = 60; ref2 = 70; }
  else if (metricLabel === 'Tag rate') { max = 25; ref1 = 5; ref2 = 15; }
  else { max = 100; ref1 = 50; ref2 = 65; }
  const clamped = Math.max(0, Math.min(v, max));
  const pct = (clamped / max) * 100;
  const ref1Pct = (ref1 / max) * 100;
  const ref2Pct = (ref2 / max) * 100;
  return (
    <div className="joy-map-mini-gauge" aria-hidden="true">
      <div className="joy-map-mini-gauge-bar">
        <div className="joy-map-mini-gauge-tick" style={{ left: `${ref1Pct}%` }} />
        <div className="joy-map-mini-gauge-tick" style={{ left: `${ref2Pct}%` }} />
        <div className="joy-map-mini-gauge-dot" style={{ left: `${pct}%`, background: accent }} />
      </div>
      <div className="joy-map-mini-gauge-scale">
        <span>0</span>
        <span style={{ left: `${ref1Pct}%` }}>{ref1}{metricLabel === 'JI' ? '' : '%'}</span>
        <span style={{ left: `${ref2Pct}%` }}>{ref2}{metricLabel === 'JI' ? '' : '%'}</span>
        <span style={{ right: 0 }}>{max}{metricLabel === 'JI' ? '' : '%'}</span>
      </div>
    </div>
  );
};

// ======================================================================
// JoyMapMode — Phase 2 orchestrator
// Two subviews: Audience Map (single text input) + Dance Map (picker + brand)
// Recent Audience Maps held in session state.
// ======================================================================

const JoyMapMode = () => {
  const [subView, setSubView] = useState('audience_map');
  // Audience Map state
  const [amDescription, setAmDescription] = useState('');
  const [amRunning, setAmRunning] = useState(false);
  const [amError, setAmError] = useState(null);
  const [amFinding, setAmFinding] = useState(null);
  const [recentMaps, setRecentMaps] = useState([]);
  // Dance Map state
  const [dmSelectedMapId, setDmSelectedMapId] = useState(null);
  const [dmBrandMode, setDmBrandMode] = useState('text');
  const [dmBrandText, setDmBrandText] = useState('');
  const [dmBrandJson, setDmBrandJson] = useState('');
  const [dmRunning, setDmRunning] = useState(false);
  const [dmError, setDmError] = useState(null);
  const [dmFinding, setDmFinding] = useState(null);

  const handleAudienceMapRun = async () => {
    setAmError(null);
    setAmFinding(null);
    if (!amDescription.trim()) { setAmError('Audience description is required.'); return; }
    setAmRunning(true);
    try {
      const res = await fetch('/.netlify/functions/bjl-audience-map', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ description: amDescription.trim() }),
      }));
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`audience-map enqueue failed (${res.status}): ${txt.slice(0, 200)}`);
      }
      const { job_id } = await res.json();
      const job = await _bjlPollJob(job_id, undefined, {
        pollIntervalMs: 2500,
        hardCapMs: 8 * 60 * 1000,
      });
      if (job.status === 'error') throw new Error(job.error || 'Audience Map job errored without detail.');
      if (!job.finding) throw new Error('Audience Map job complete but no finding returned.');
      const parsed = typeof job.finding === 'string' ? JSON.parse(job.finding) : job.finding;
      if (parsed.unresolved) {
        setAmError(parsed.unresolved_reason || 'Audience description could not be routed.');
        setAmFinding(parsed);
        return;
      }
      if (parsed.low_n_refused) {
        setAmError(parsed.message || `Reverse-engineered audience too small (n=${parsed.reverse_engineered_cohort_n}).`);
        setAmFinding(parsed);
        return;
      }
      setAmFinding(parsed);
      // Add to recent maps (most recent first, dedupe by job_id)
      setRecentMaps(prev => [
        {
          job_id,
          description: amDescription.trim(),
          routing_notice: parsed.routing && parsed.routing.routing_notice,
          reverse_engineered_cohort_n: parsed.reverse_engineered_cohort_n,
          completed_at: new Date().toISOString(),
        },
        ...prev.filter(m => m.job_id !== job_id),
      ].slice(0, 10));
      setDmSelectedMapId(job_id);
    } catch (err) {
      setAmError(String(err.message || err));
    } finally {
      setAmRunning(false);
    }
  };

  const handleDanceMapRun = async () => {
    setDmError(null);
    setDmFinding(null);
    if (!dmSelectedMapId) {
      setDmError('Select an Audience Map first (create one in the Audience Map tab).');
      return;
    }
    let parsedJson = null;
    if (dmBrandMode === 'json' && dmBrandJson.trim()) {
      try { parsedJson = JSON.parse(dmBrandJson); }
      catch (e) { setDmError('Brand JSON did not parse: ' + e.message); return; }
    }
    if (dmBrandMode === 'text' && !dmBrandText.trim()) {
      setDmError('Provide brand text or paste Waldo JSON.'); return;
    }
    setDmRunning(true);
    try {
      const requestBody = {
        workflow: 'dance_map',
        brand_text: dmBrandMode === 'text' ? dmBrandText.trim() : null,
        brand_json: parsedJson,
        audience_map_job_id: dmSelectedMapId,
      };
      const res = await fetch('/.netlify/functions/bjl-joy-map', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody),
      }));
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Dance Map enqueue failed (${res.status}): ${txt.slice(0,200)}`);
      }
      const { job_id } = await res.json();
      const job = await _bjlPollJob(job_id, undefined, {
        pollIntervalMs: 2500,
        hardCapMs: 8 * 60 * 1000,
      });
      if (job.status === 'error') throw new Error(job.error || 'Dance Map job errored without detail.');
      if (!job.finding) throw new Error('Dance Map job complete but no finding returned.');
      const parsed = typeof job.finding === 'string' ? JSON.parse(job.finding) : job.finding;
      setDmFinding(parsed);
    } catch (err) {
      setDmError(String(err.message || err));
    } finally {
      setDmRunning(false);
    }
  };

  return (
    <div className="joy-map-mode">
      <div className="joy-map-toolbar">
        <button className={`btn ${subView === 'audience_map' ? 'primary' : 'ghost'}`} onClick={() => setSubView('audience_map')}>Audience Map</button>
        <button className={`btn ${subView === 'dance_map' ? 'primary' : 'ghost'}`} onClick={() => setSubView('dance_map')}>Dance Map</button>
      </div>

      {subView === 'audience_map' && (
        <div className="joy-map-inputs">
          <div className="joy-map-input-group">
            <div className="joy-map-input-label">Audience description</div>
            <textarea
              className="joy-map-brand-textarea"
              placeholder="Describe the audience you want to map. Examples: 'Rock and Roll Hall of Fame fans', 'people who love music and museums', 'millennial parents in the Southeast', 'QSR customers who care about value'."
              value={amDescription}
              onChange={(e) => setAmDescription(e.target.value)}
              rows={4}
            />
          </div>
          <div className="joy-map-actions">
            <button className="btn primary" disabled={amRunning || !amDescription.trim()} onClick={handleAudienceMapRun}>
              {amRunning ? 'Running…' : 'Run'}
            </button>
          </div>
          {amError && <div className="joy-map-error">Error: {amError}</div>}
          {amRunning && !amFinding && <div className="joy-map-loading">Building Audience Map (4 passes — routing, profile, synthesis, reverse-engineer)…</div>}
          {amFinding && !amFinding.unresolved && !amFinding.low_n_refused && <AudienceMapResults finding={amFinding} />}
        </div>
      )}

      {subView === 'dance_map' && (
        <div className="joy-map-inputs">
          <div className="joy-map-input-group">
            <div className="joy-map-input-label">Audience Map</div>
            {recentMaps.length === 0 ? (
              <div className="joy-map-empty-state">
                <div>No Audience Maps in this session yet.</div>
                <button className="btn primary" onClick={() => setSubView('audience_map')}>Create an Audience Map first</button>
              </div>
            ) : (
              <div className="joy-map-am-picker">
                {recentMaps.map(m => (
                  <label key={m.job_id} className={`joy-map-am-option ${dmSelectedMapId === m.job_id ? 'selected' : ''}`}>
                    <input
                      type="radio"
                      name="dm-audience-map"
                      value={m.job_id}
                      checked={dmSelectedMapId === m.job_id}
                      onChange={() => setDmSelectedMapId(m.job_id)}
                    />
                    <div className="joy-map-am-option-body">
                      <div className="joy-map-am-option-desc">"{m.description}"</div>
                      <div className="joy-map-am-option-meta">
                        {m.routing_notice}{typeof m.reverse_engineered_cohort_n === 'number' ? ` · n=${m.reverse_engineered_cohort_n.toLocaleString()}` : ''}
                      </div>
                    </div>
                  </label>
                ))}
              </div>
            )}
          </div>

          <div className="joy-map-input-group">
            <div className="joy-map-input-label">Brand input</div>
            <div className="joy-map-brand-toggle">
              <button className={`btn ${dmBrandMode === 'text' ? 'primary' : 'ghost'}`} onClick={() => setDmBrandMode('text')}>Free text</button>
              <button className={`btn ${dmBrandMode === 'json' ? 'primary' : 'ghost'}`} onClick={() => setDmBrandMode('json')}>Waldo JSON</button>
            </div>
            {dmBrandMode === 'text' ? (
              <textarea
                className="joy-map-brand-textarea"
                placeholder="Paste brand offering text — positioning statement, brand story, or messaging language."
                value={dmBrandText}
                onChange={(e) => setDmBrandText(e.target.value)}
                rows={5}
              />
            ) : (
              <textarea
                className="joy-map-brand-textarea"
                placeholder='Paste Waldo JSON. The source-aware parser will extract brand emphasis, tactical signals, and friction points.'
                value={dmBrandJson}
                onChange={(e) => setDmBrandJson(e.target.value)}
                rows={6}
              />
            )}
          </div>

          <div className="joy-map-actions">
            <button className="btn primary" disabled={dmRunning || !dmSelectedMapId} onClick={handleDanceMapRun}>
              {dmRunning ? 'Running…' : 'Run'}
            </button>
          </div>

          {dmError && <div className="joy-map-error">Error: {dmError}</div>}
          {dmRunning && !dmFinding && <div className="joy-map-loading">Running Dance Map synthesis…</div>}
          {dmFinding && <JoyMapDanceMapResults finding={dmFinding} />}
        </div>
      )}
    </div>
  );
};

const App = ({ authedUser = null, onSignOut = null } = {}) => {
  const [mode, setMode] = useState(() => {
    const saved = localStorage.getItem("bjl_mode_v2");
    return saved === "batch" ? "outreach" : (saved || "intelligence");
  });
  const [drawerOpen, setDrawerOpen] = useState(true);
  const [drawerFilter, setDrawerFilter] = useState("all");
  const [evidenceRows, setEvidenceRows] = useState([]);
  const [strategistContext, setStrategistContext] = useState("");
  // Session key: incrementing this forces the active mode component to remount,
  // wiping its local state (conversation turns, loaded Waldo files, draft
  // results, etc.) without lifting every piece of state into App.
  const [sessionKey, setSessionKey] = useState(0);
  const newSession = () => {
    setEvidenceRows([]);
    setSessionKey(k => k + 1);
  };
  // Welcome modal shows on every page load (refresh / new tab). It is NOT
  // shown when the user clicks "New session" — that button is an in-tool
  // soft reset and doesn't trigger a reload, so no persistence is needed.
  const [showWelcome, setShowWelcome] = useState(true);
  const dismissWelcome = () => setShowWelcome(false);

  useEffect(() => { localStorage.setItem("bjl_mode_v2", mode); }, [mode]);

  // Migrate legacy "batch" mode value to "outreach" — Batch has been folded
  // into Outreach. Also guards against stale localStorage after this change.
  useEffect(() => { if (mode === "batch") setMode("outreach"); }, [mode]);

  // Keep-warm: ping /api/claude on mount so the function is hot when the user acts
  useEffect(() => {
    fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1, messages: [{ role: "user", content: "." }] }),
    }).catch(() => {});
  }, []);

  const crumbs = {
    intelligence: ["Workbench", "Intelligence engine", "Ask the Lab"],
    outreach:     ["Workbench", "Outreach", "Accounts"],
    joy_map:      ["Workbench", "Joy Map"],
  }[mode] || ["Workbench"];

  const showDrawer = drawerOpen && mode !== "outreach" && mode !== "joy_map";

  return (
    <div className="app" data-screen-label={`BJL · ${mode}`}>
      <Rail mode={mode} setMode={setMode} />
      <div className="main">
        <TopBar
          crumbs={crumbs}
          actions={
            <>
              {mode === "intelligence" && (
                <button className="btn ghost" onClick={() => setDrawerOpen(!drawerOpen)}>
                  <Icon name="evidence" size={13} />{drawerOpen ? "Hide evidence" : "Show evidence"}
                </button>
              )}
              <button className="btn" onClick={newSession}>
                <Icon name="plus" size={12} /> New session
              </button>
              <button className="btn ghost icon-only" title="About the Lab"
                onClick={() => setShowWelcome(true)}>?</button>
              {authedUser && (
                <div className="bjl-user-menu" title={authedUser.email}>
                  <span className="bjl-user-email">{authedUser.email}</span>
                  {onSignOut && (
                    <button className="btn ghost bjl-user-signout" onClick={onSignOut}>Sign out</button>
                  )}
                </div>
              )}
            </>
          }
        />
        <div className={`body ${showDrawer ? "" : "no-drawer"}`}>
          <div style={mode === "outreach"
            ? {minHeight: 0, display: "flex", flexDirection: "column", overflow: "auto"}
            : {overflow: "hidden", minHeight: 0, display: "flex", flexDirection: "column"}}>
            {mode === "intelligence" && <IntelligenceMode
              key={`intel-${sessionKey}`}
              setEvidenceRows={setEvidenceRows}
              strategistContext={strategistContext}
              setStrategistContext={setStrategistContext} />}
            {mode === "outreach" && <BatchMode

              strategistContext={strategistContext}

            {mode === "joy_map" && <JoyMapMode

          {showDrawer && <EvidenceDrawer rows={evidenceRows} filter={drawerFilter} onFilter={setDrawerFilter} />}

      </div>
      {showWelcome && <WelcomeModal onDismiss={dismissWelcome} />}

  );

/* =========================================================================
 * AuthGate — Microsoft 365 SSO via Supabase Auth.
 *
 * Wraps <App />. On boot:
 *   1. fetch /api/bjl-config → { supabaseUrl, supabaseAnonKey, authEnforced }
 *   2. if authEnforced is false (pre-Azure-live), render App directly.
 *   3. otherwise initialize Supabase client, check existing session,
 *      render LoginScreen / RejectedScreen / App accordingly.
 *
 * Exposes window.__bjlAuth = { getToken, signOut, user, enforced } so the
 * existing fetch helpers (authedFetchInit) can attach Bearer tokens. Also
 * exposes window.__bjlRejected(email) so functions can flip the user to
 * the rejected screen if a 403 not_whitelisted comes back from the API
 * (covers the case where MS auth succeeds but the email isn't whitelisted).
 * ========================================================================= */

const LoginScreen = ({ onSignIn, signingIn }) => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <img src="assets/bjl-logo.png" alt="Brand Joy Lab" className="bjl-auth-logo" />
      <h1 className="bjl-auth-title">Welcome to the Brand Joy Lab.</h1>
      <p className="bjl-auth-subtitle">Sign in with your PETERMAYER Microsoft account to continue.</p>
      <button
        className="btn primary bjl-auth-cta"
        onClick={onSignIn}
        disabled={signingIn}
      >
        {signingIn ? "Redirecting…" : "Sign in with Microsoft"}
      </button>
    </div>
  </div>
);

const RejectedScreen = ({ email, onRetry }) => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <h1 className="bjl-auth-title">Access not authorized</h1>
      <p className="bjl-auth-subtitle">
        You're signed in as <strong>{email || "(unknown)"}</strong>, but this email isn't on the BJL Intelligence Engine whitelist.
      </p>
      <p className="bjl-auth-subtitle">
        Contact Eli at <a href="mailto:haddowe@peteramayer.com">haddowe@peteramayer.com</a> to request access.
      </p>
      <button className="btn ghost bjl-auth-cta" onClick={onRetry}>Sign out and try a different account</button>
    </div>
  </div>
);

const AuthLoadingScreen = () => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <img src="assets/bjl-logo.png" alt="Brand Joy Lab" className="bjl-auth-logo" />
      <p className="bjl-auth-subtitle">Loading…</p>
    </div>
  </div>
);

const AuthGate = () => {
  const [config, setConfig] = useState(null);
  const [client, setClient] = useState(null);
  const [session, setSession] = useState(null);
  // authState: 'loading' | 'login' | 'authed' | 'rejected'
  const [authState, setAuthState] = useState("loading");
  const [rejectedEmail, setRejectedEmail] = useState(null);
  const [signingIn, setSigningIn] = useState(false);

  // Boot: load config, init client, hydrate session
  useEffect(() => {
    let cancelled = false;
    fetch("/api/bjl-config", { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((cfg) => {
        if (cancelled) return;
        if (!cfg) {
          // Config endpoint failed — fall through to authed=true to preserve
          // legacy behavior. The function-level gate is the real enforcement
          // layer; if AUTH_ENFORCED=true on the server, the user will get
          // a 401 from the API and signOut will fire.
          console.warn("[AuthGate] /api/bjl-config failed; falling back to authed=true");
          setConfig({ authEnforced: false });
          setAuthState("authed");
          return;
        }
        setConfig(cfg);

        // Pre-Azure-live: AUTH_ENFORCED is not set. Skip the gate entirely.
        if (!cfg.authEnforced) {
          setAuthState("authed");
          return;
        }

        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase || !window.supabase.createClient) {
          console.error("[AuthGate] missing supabase config or library; cannot enforce auth");
          setAuthState("login");
          return;
        }
        const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        setClient(sb);
        sb.auth.getSession().then(({ data }) => {
          if (cancelled) return;
          if (data && data.session) {
            setSession(data.session);
            setAuthState("authed");
          } else {
            setAuthState("login");
          }
        });
        sb.auth.onAuthStateChange((event, sess) => {
          if (sess) {
            setSession(sess);
            setAuthState((prev) => (prev === "rejected" ? "rejected" : "authed"));
          } else {
            setSession(null);
            setAuthState("login");
          }
        });
      })
      .catch((e) => {
        console.error("[AuthGate] boot threw:", e);
        if (!cancelled) setAuthState("login");
      });
    return () => { cancelled = true; };
  }, []);

  const signIn = useCallback(() => {
    if (!client) return;
    setSigningIn(true);
    client.auth.signInWithOAuth({
      provider: "azure",
      options: {
        scopes: "openid email profile",
        redirectTo: window.location.origin,
      },
    });
  }, [client]);

  const signOut = useCallback(async () => {
    setRejectedEmail(null);
    if (client) {
      try { await client.auth.signOut(); } catch (e) { console.warn("[AuthGate] signOut threw:", e); }
    }
    setSession(null);
    setAuthState("login");
  }, [client]);

  // Expose globals for the fetch helpers to read at call time.
  useEffect(() => {
    window.__bjlAuth = {
      getToken: () => (session && session.access_token) || null,
      signOut,
      user: session && session.user ? {
        id: session.user.id,
        email: session.user.email,
        name: (session.user.user_metadata && session.user.user_metadata.name) || null
      } : null,
      enforced: !!(config && config.authEnforced),
    };
    window.__bjlRejected = (email) => {
      setRejectedEmail(email);
      setAuthState("rejected");
    };
    return () => {
      // Cleanup on unmount only (component lives for the page lifetime)
    };
  }, [session, signOut, config]);

  if (authState === "loading") return <AuthLoadingScreen />;
  if (authState === "rejected") return <RejectedScreen email={rejectedEmail} onRetry={signOut} />;
  if (authState === "login") return <LoginScreen onSignIn={signIn} signingIn={signingIn} />;

  // authed — render the main app, passing user info + sign-out
  const user = (session && session.user) ? {
    id: session.user.id,
    email: session.user.email,
    name: (session.user.user_metadata && session.user.user_metadata.name) || null
  } : null;
  return <App authedUser={user} onSignOut={config && config.authEnforced ? signOut : null} />;
};

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);
  </script>
</body>
</html>
