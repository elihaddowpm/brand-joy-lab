/* =========================================================================
 * 1. PORTED UTILITIES — from the V1 frontend (archive/index_v1.html), verbatim.
 * ========================================================================= */

const sanitizeEmail = (text) => {
  return text
    // Strip https:// or http:// when followed by www. — the www-prefixed URL renders
    // as a clickable link in every email client and we avoid the model's habit of
    // autocapitalizing the protocol after a sentence-ending period.
    .replace(/\b[Hh]ttps?:\/\/(?=www\.)/g, '')
    // For the rare URL with https:// but no www. prefix, lowercase the protocol.
    .replace(/\bHttps:\/\//g, 'https://')
    .replace(/\bHttp:\/\//g, 'http://')
    .replace(/Won'tBow/g, "Won't Bow")
    .replace(/Won’tBow/g, "Won’t Bow")
    .replace(/^\*{1,2}\n/, '')
    .replace(/^\*{1,2}\s*/, '')
    .replace(/^(Subject:)\*{1,2}\s*/, '$1')
    .replace(/\.\s*,/g, '.')
    .replace(/\.\./g, '.')
    .replace(/ \. /g, '. ')
    .replace(/\. ([a-z])/g, (m, c) => '. ' + c.toUpperCase())
    .replace(/\.\s*,/g, '.')
    .replace(/\.\./g, '.')
    .replace(/\bJI=\d+\.?\d*/g, '')
    .replace(/a Joy Index of \d+\.?\d*/gi, 'a high joy score')
    .replace(/Joy Index of \d+\.?\d*/gi, 'high on the joy scale')
    .replace(/scores a \d+\.?\d* (on|for|in)/gi, 'scores highly $1')
    .replace(/\d+\.?\d* (on the [Jj]oy|on our [Jj]oy)/g, 'highly $1')
    .replace(/The high on the joy scale/gi, 'This high joy score')
    .replace(/\n(Ryan|Eli|Shannon|Dana|Chris|Tameka|Deandra|Mauricio|Pete|Stella|Nicole|Christina|Terri|Dustin|Drew|Jen|Carol|Amy|Tim|Luis|Stephen|Jim|Nate|Hiroshi|Jessica|Dan)\s*$/, '\n[Your name]');
};

const stripMarkers = (text) => text.replace(/[\[\(]\s*(?:BJL|CRED)\s*[\]\)]\s*\n?/gi, '');
const CRED_MARKER_RE = /[\[\(]\s*CRED\s*[\]\)]/i;

const validateCredentials = async (emailText, strategistCtx) => {
  if (!strategistCtx || !strategistCtx.trim()) return stripMarkers(emailText);
  if (!CRED_MARKER_RE.test(emailText)) {
    return stripMarkers(emailText);
  }
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    const credMatch = emailText.match(/[\[\(]\s*CRED\s*[\]\)]\s*\n?([\s\S]*?)(?=\n\n[A-Z]|\nWould|\nWorth|\nBest|\nThanks|\[Your name\]|$)/i);
    if (!credMatch) return stripMarkers(emailText);
    const credParagraph = credMatch[1].trim();
    const prompt = 'APPROVED SOURCE MATERIAL — the only text you may draw from:\n---\n' + strategistCtx + '\n---\n\nAGENCY CREDENTIAL PARAGRAPH TO REWRITE:\n---\n' + credParagraph + '\n---\n\nTask: Rewrite this paragraph so every specific claim, client name, and credential comes directly from the APPROVED SOURCE MATERIAL above. You may paraphrase but must not add, invent, or imply anything not in the source material. Keep it to two sentences maximum — this is an intro email. Return only the rewritten paragraph — no markers, no commentary, no subject line.';
    const res = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal,
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 600,
        system: 'You rewrite agency credential paragraphs to use only approved source material. Return only the rewritten paragraph.',
        messages: [{ role: 'user', content: prompt }]
      })
    });
    clearTimeout(timer);
    const cleanEmail = stripMarkers(emailText);
    if (!res.ok) return cleanEmail;
    const data = await res.json();
    const rewrittenCred = (data.content?.map(b => b.type === 'text' ? b.text : '').filter(Boolean).join('\n') || '').trim();
    if (!rewrittenCred) return cleanEmail;
    return cleanEmail.replace(credParagraph, rewrittenCred);
  } catch(e) {
    return stripMarkers(emailText);
  }
};

const extractProspectContext = ({ waldo, bjlInsights, strategistContext, prospectCategory }) => {
  const pain_keywords = [];
  const audience_hints = [];
  let pain_shape = "brand";
  let needs_current_proof = false;
  let needs_quantitative_proof = true;
  if (waldo) {
    const waldoText = JSON.stringify(waldo).toLowerCase();
    const performanceIndicators = ["roas", "cac", "attribution", "booking cost", "performance marketing",
      "conversion", "cost per", "media efficiency", "media waste", "measurement",
      "ceo pressure on revenue", "revenue pressure", "budget cut", "flat budget",
      "fragmented media", "multi-location", "portfolio", "multi-property"];
    const performanceHits = performanceIndicators.filter(term => waldoText.includes(term));
    if (performanceHits.length >= 2) pain_shape = "performance";
    else if (performanceHits.length === 1) pain_shape = "mixed";
    pain_keywords.push(...performanceHits);
    const brandIndicators = ["positioning", "repositioning", "brand refresh", "identity", "platform",
      "differentiation", "category", "audience shift", "rebrand", "tagline",
      "creative", "emotional territory", "perception", "resonance"];
    pain_keywords.push(...brandIndicators.filter(term => waldoText.includes(term)));
    const audienceIndicators = ["multicultural", "diverse audience", "black", "latino", "gen z", "millennial",
      "boomer", "family", "parents", "wellness", "luxury", "heritage",
      "performance marketing", "destination", "tourism", "cvb", "hospitality"];
    audience_hints.push(...audienceIndicators.filter(term => waldoText.includes(term)));
  }
  if (bjlInsights) {
    const bjlLower = bjlInsights.toLowerCase();
    const joyKeywords = ["escape", "discovery", "reconnection", "reset", "anticipation", "playful",
      "tranquil", "relational", "aspirational", "wonder", "belonging"];
    pain_keywords.push(...joyKeywords.filter(term => bjlLower.includes(term)));
  }
  return {
    category: prospectCategory || null,
    pain_shape,
    pain_keywords: [...new Set(pain_keywords)],
    audience_hints: [...new Set(audience_hints)],
    needs_current_proof,
    needs_quantitative_proof,
  };
};

/* =========================================================================
 * Writing OS — Step 1: evaluator
 *
 * Standalone quality reviewer for draft emails. Takes a brief, subject, and
 * body and returns a structured scorecard. The judge model is Haiku 4.5 —
 * fast and cheap enough to run after every draft without blocking the user.
 *
 * This function is NOT yet wired into generateOneEmail (per the Writing OS
 * Build Order). It's exposed at window.evaluateEmail so the rubric can be
 * validated independently against real emails before pipeline integration.
 *
 * Console usage:
 *   await window.evaluateEmail({
 *     brief: "Short intro email with a case study reference",
 *     subject: "Building Birmingham's brand",
 *     body: "Dear Jessica, ..."
 *   })
 *
 * Returns:
 *   { ok: true,  scorecard: { hook_specific: { pass, note }, ... } }
 *   { ok: false, error: "timeout" | "parse_failed" | "evaluator_429" | ... }
 * ========================================================================= */

const EMAIL_EVALUATION_RUBRIC = {
  hook_specific:              "Does the opening reference something specific and observed about this prospect — not a general industry statement or compliment?",
  no_unsolicited_methodology: "Does the email avoid generic marketing theory sentences that were not called for in the brief? If the brief requested a BJL finding, case study reference, or article share, those elements are appropriate and should pass. Only flag sentences that describe general marketing principles unprompted — e.g. 'brands that win understand narrative momentum', 'destinations with clear emotional territory generate more earned attention.'",
  no_prescription:            "Does the email avoid telling the prospect what they need to do, what their situation requires, or what will happen if they act? Referencing a BJL finding, case study outcome, or article insight is not prescription — flag only sentences that tell the prospect their strategy must change or what they should do next.",
  no_disclaimer:              "Does the email avoid apologizing for the outreach or denying that it is a pitch?",
  no_rhetorical_question:     "Does the email avoid posing a rhetorical question to the prospect about their industry or challenge?",
  subject_clean:              "Is the subject line a real subject line — not wrapped in brackets, not a placeholder description?",
  under_150_words:            "Is the email body under 150 words?",
  collaborative_ask:          "Does the closing ask feel mutual — offering something AND inviting their input — rather than just requesting a meeting slot?",
};

const EVALUATOR_SYSTEM_PROMPT =
  "You are a quality reviewer for cold outreach emails. You will receive the original brief, the subject line, and the email body. Read all three and return a JSON scorecard only — no commentary, no preamble. For each check, return true if the email passes and false if it fails. If false, add a one-sentence note. When evaluating no_unsolicited_methodology and no_prescription, use the brief to determine whether research findings, case study references, or article references were requested — if so, those elements are appropriate and should pass.";

const evaluateEmail = async ({ brief, subject, body } = {}) => {
  const rubricText = Object.entries(EMAIL_EVALUATION_RUBRIC)
    .map(([key, desc]) => "- " + key + ": " + desc)
    .join("\n");

  const exampleShape =
    "{\n" +
    Object.keys(EMAIL_EVALUATION_RUBRIC)
      .map(k => '  "' + k + '": { "pass": true, "note": "" }')
      .join(",\n") +
    "\n}";

  const userMessage = [
    "BRIEF:",
    String(brief || "(no brief provided)").trim(),
    "",
    "SUBJECT:",
    String(subject || "(no subject)").trim(),
    "",
    "EMAIL BODY:",
    String(body || "(no body)").trim(),
    "",
    "RUBRIC:",
    rubricText,
    "",
    "Return ONLY a JSON object of this exact shape (no markdown, no code fences, no commentary):",
    exampleShape,
  ].join("\n");

  console.log("[evaluate] → request", {
    briefLen: (brief || "").length,
    subjLen:  (subject || "").length,
    bodyLen:  (body || "").length,
  });

  let res;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    res = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 900,
        system: EVALUATOR_SYSTEM_PROMPT,
        messages: [{ role: "user", content: userMessage }],
      }),
    });
    clearTimeout(timer);
  } catch (e) {
    const error = e.name === "AbortError" ? "timeout" : (e.message || "network_error");
    console.warn("[evaluate] ← network/abort", error);
    return { ok: false, error, scorecard: null };
  }

  if (res.status !== 200) {
    console.warn("[evaluate] ← non-200", res.status);
    return { ok: false, error: "evaluator_" + res.status, scorecard: null };
  }

  let data;
  try { data = await res.json(); } catch (e) {
    return { ok: false, error: "response_not_json", scorecard: null };
  }
  const raw = (data.content || [])
    .map(b => b && b.type === "text" ? (b.text || "") : "")
    .filter(Boolean)
    .join("")
    .trim();

  // Strip markdown code fences if the model wrapped its JSON despite
  // being asked not to.
  const cleaned = raw
    .replace(/^```(?:json)?\s*/i, "")
    .replace(/```\s*$/i, "")
    .trim();

  let parsed = null;
  try { parsed = JSON.parse(cleaned); } catch (e) {
    console.warn("[evaluate] ← JSON parse failed:", cleaned.slice(0, 200));
    return { ok: false, error: "parse_failed", scorecard: null, raw: cleaned };
  }

  // Normalize each check to { pass: boolean, note: string }. The model may
  // emit boolean shortcuts or omit notes on passes; coerce so downstream
  // consumers (Step 2 reviser, Step 3 scorecard UI) can rely on the shape.
  const scorecard = {};
  Object.keys(EMAIL_EVALUATION_RUBRIC).forEach(k => {
    const v = parsed[k];
    if (v && typeof v === "object") {
      scorecard[k] = {
        pass: v.pass === true,
        note: typeof v.note === "string" ? v.note : "",
      };
    } else if (typeof v === "boolean") {
      scorecard[k] = { pass: v, note: "" };
    } else {
      scorecard[k] = { pass: false, note: "missing in response" };
    }
  });

  const passCount = Object.values(scorecard).filter(c => c.pass).length;
  const failCount = Object.keys(scorecard).length - passCount;
  console.log("[evaluate] ← scorecard", { pass: passCount, fail: failCount, scorecard });

  return { ok: true, error: null, scorecard };
};

// Expose for console-based rubric validation. Step 2 (reviser) will consume
// this function from inside generateOneEmail once the pipeline is wired
// (Step 3 of the Build Order).
if (typeof window !== "undefined") {
  window.evaluateEmail = evaluateEmail;
  window.EMAIL_EVALUATION_RUBRIC = EMAIL_EVALUATION_RUBRIC;
}

/* =========================================================================
 * Writing OS — Step 2: targeted reviser
 *
 * Standalone surgical editor that consumes the scorecard from Step 1 and
 * fires one targeted revision call per failed check. Each call is given
 * exactly one instruction; the model is instructed to preserve everything
 * else verbatim. Calls run sequentially so each reviser sees the prior fix.
 *
 * This function is NOT yet wired into generateOneEmail. It's exposed at
 * window.reviseEmail so the revision behavior can be validated against
 * real evaluator output in the browser console before pipeline integration
 * (Step 3 of the Build Order).
 *
 * Console usage:
 *   const evalRes = await window.evaluateEmail({ brief, subject, body });
 *   const revRes  = await window.reviseEmail({
 *     brief, subject, body, scorecard: evalRes.scorecard,
 *   });
 *   // Re-evaluate to verify the revisions passed:
 *   const evalAfter = await window.evaluateEmail({
 *     brief, subject: revRes.subject, body: revRes.body,
 *   });
 *
 * Returns:
 *   {
 *     ok: true,            // every requested revision applied
 *     subject: "...",      // possibly updated
 *     body: "...",         // possibly updated
 *     revisions: [{ key, note, applied: true }, ...],
 *     errors: [],
 *   }
 * ========================================================================= */

const EMAIL_REVISION_INSTRUCTIONS = {
  hook_specific:
    "The opening sentence of this email is a general industry statement rather than a specific observation about this prospect. Rewrite the opening using the prospect signal from the brief. Keep everything else identical.",
  no_unsolicited_methodology:
    "This email contains a sentence that explains why PETERMAYER's approach works in general rather than making a specific observation about this prospect. Remove or rewrite that sentence so it is specific to this prospect's situation. Keep everything else identical.",
  no_prescription:
    "This email tells the prospect what they need to do, what their situation requires, or what will happen if they act. Soften or remove that sentence so it observes rather than prescribes. Keep everything else identical.",
  no_disclaimer:
    "This email apologizes for the outreach or denies that it is a pitch (e.g. \"I'm not looking to pitch you\", \"this isn't a sales call\"). Remove that sentence entirely. Keep everything else identical.",
  no_rhetorical_question:
    "This email poses a rhetorical question to the prospect about their industry or challenge. Rewrite the question as a direct statement or remove it. Keep everything else identical.",
  subject_clean:
    "The subject line is not a real subject — it may be wrapped in brackets, a placeholder description, or otherwise unusable. Replace it with a real subject line (no brackets, no placeholder syntax) drawn from the email's specific content. Keep the email body identical.",
  under_150_words:
    "The email body is over 150 words. Trim it to under 150 words by cutting the weakest sentence first. Preserve the hook, the offer, the closing ask, and any specific data point, case study reference, or article URL.",
  collaborative_ask:
    "The closing ask reads as transactional rather than mutual. Rewrite the ask so it offers something AND invites the prospect's input (e.g. \"Happy to share our thinking and learn what you're seeing\"). Keep everything else identical.",
};

const EMAIL_REVISER_SYSTEM_PROMPT =
  "You are a targeted editor for cold outreach emails. Each call gives you one specific failed check from a quality rubric. Apply only the requested edit. Preserve everything else verbatim — the hook (unless that is the check), the data point, the case study reference, the article URL, the closing ask (unless that is the check), and the sign-off. Return the full revised email starting with a \"Subject:\" line, followed by a blank line, followed by the body. No commentary, no labels, no preamble.";

// Parse a reviser response into { subject, body }. The reviser is prompted
// to emit "Subject: <line>\n\n<body>"; we tolerate missing subject prefix
// by treating the whole response as body (and the caller falls back to the
// prior subject in that case).
const parseRevisionResponse = (text) => {
  const trimmed = String(text || "").trim();
  const m = trimmed.match(/^\s*Subject:\s*([^\n]*)\n+([\s\S]*)$/i);
  if (m) return { subject: m[1].trim(), body: m[2].trim() };
  return { subject: "", body: trimmed };
};

const runOneRevisionCall = async ({ brief, subject, body, key, instruction, note }) => {
  const noteLine = note ? "Evaluator note: " + note : "";
  const currentEmail =
    (subject ? "Subject: " + subject + "\n\n" : "") + (body || "");
  const userMessage = [
    "You are revising a cold outreach email. Apply ONE targeted edit only.",
    "",
    "FAILED CHECK: " + key,
    noteLine,
    "",
    "INSTRUCTION:",
    instruction,
    "",
    "ORIGINAL BRIEF (for context):",
    String(brief || "(no brief provided)").trim(),
    "",
    "CURRENT EMAIL:",
    currentEmail,
    "",
    "Return the full revised email in this exact shape (no commentary, no labels, no preamble):",
    "Subject: <subject text>",
    "",
    "<body text>",
  ].filter(Boolean).join("\n");

  console.log("[revise] → " + key);

  let res;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    res = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 900,
        system: EMAIL_REVISER_SYSTEM_PROMPT,
        messages: [{ role: "user", content: userMessage }],
      }),
    });
    clearTimeout(timer);
  } catch (e) {
    const error = e.name === "AbortError" ? "timeout" : (e.message || "network_error");
    console.warn("[revise] ← " + key + " network/abort", error);
    return { ok: false, error };
  }

  if (res.status !== 200) {
    console.warn("[revise] ← " + key + " non-200", res.status);
    return { ok: false, error: "reviser_" + res.status };
  }

  let data;
  try { data = await res.json(); } catch (e) {
    return { ok: false, error: "response_not_json" };
  }
  const raw = (data.content || [])
    .map(b => b && b.type === "text" ? (b.text || "") : "")
    .filter(Boolean)
    .join("")
    .trim();

  if (!raw) {
    console.warn("[revise] ← " + key + " empty_response");
    return { ok: false, error: "empty_response" };
  }

  const parsed = parseRevisionResponse(raw);
  console.log("[revise] ← " + key + " ok", {
    subjLen: (parsed.subject || "").length,
    bodyLen: (parsed.body || "").length,
  });
  // If the reviser dropped the subject prefix, keep the prior subject —
  // most checks operate on the body and shouldn't touch the subject.
  return {
    ok: true,
    subject: parsed.subject || subject || "",
    body: parsed.body || body || "",
  };
};

const reviseEmail = async ({ brief, subject, body, scorecard } = {}) => {
  const failures = Object.entries(scorecard || {})
    .filter(([, c]) => c && c.pass === false)
    .map(([key, c]) => ({ key, note: (c && c.note) || "" }));

  if (failures.length === 0) {
    console.log("[revise] no failures — passthrough");
    return { ok: true, subject: subject || "", body: body || "", revisions: [], errors: [] };
  }

  console.log("[revise] " + failures.length + " failure(s) to fix:", failures.map(f => f.key));

  let curSubject = subject || "";
  let curBody = body || "";
  const revisions = [];
  const errors = [];

  for (const { key, note } of failures) {
    const instruction = EMAIL_REVISION_INSTRUCTIONS[key];
    if (!instruction) {
      console.warn("[revise] no instruction for check:", key);
      errors.push({ key, error: "no_instruction" });
      revisions.push({ key, note, applied: false });
      continue;
    }
    const result = await runOneRevisionCall({
      brief, subject: curSubject, body: curBody, key, instruction, note,
    });
    if (result.ok) {
      curSubject = result.subject;
      curBody = result.body;
      revisions.push({ key, note, applied: true });
    } else {
      errors.push({ key, error: result.error });
      revisions.push({ key, note, applied: false });
    }
  }

  return {
    ok: errors.length === 0,
    subject: curSubject,
    body: curBody,
    revisions,
    errors,
  };
};

// Expose for console-based validation. Step 3 (pipeline wiring) will
// consume reviseEmail from inside generateOneEmail, looped with
// evaluateEmail at most twice before flagging the draft for human review.
if (typeof window !== "undefined") {
  window.reviseEmail = reviseEmail;
  window.EMAIL_REVISION_INSTRUCTIONS = EMAIL_REVISION_INSTRUCTIONS;
}

  if (c.includes('motorsport') || c.includes('racing') || c.includes('nascar')) return 'Sports & Entertainment';

  if (c.includes('tech') || c.includes('telecom')) return 'Technology / Telecom';
  if (c.includes('retail') || c.includes('grocery')) return 'Retail / Grocery';
  return 'Other';
};

const parseWaldoJSON = (text) => {
  const raw = JSON.parse(text);
  let accounts;
  if (Array.isArray(raw)) accounts = raw;
  else if (raw.accounts && Array.isArray(raw.accounts)) accounts = raw.accounts;
  else if (raw.company || raw.id) accounts = [raw];
  else throw new Error('No accounts array found and could not detect a single account object');
  accounts = accounts.map((a, i) => ({
    ...a,
    id: a.id || a.company || ('account_' + i),
    contacts: Array.isArray(a.contacts) ? a.contacts : (a.contact ? [a.contact] : []),
  }));
  return { pilot: raw.pilot || raw.company || 'Waldo Intelligence', accounts };
};

/* Signal scoring + role-based rotation.
 *
 * Fix 1: Waldo extraction sometimes assigns a secondary signal type (a new
 * hire, an org change) as `top_signal` even when a higher-value signal type
 * (an executive public quote) exists in deep_signals. We rescore all
 * signals by signal_type priority — with a small bonus for direct quotes —
 * and use the highest as the primary hook.
 *
 * Fix 2: In batch mode, multiple contacts at the same account were all
 * seeing the same hook. We now pick a role-affinity-matched signal per
 * contact and track used origins across the per-account loop so two
 * contacts don't open with the same sentence.
 */
const SIGNAL_PRIORITY = {
  executive_public_statement: 5,
  executive_mandate: 4,
  organizational_change: 3,
  campaign_or_activation: 2,
  general_context: 1,
};

const ROLE_SIGNAL_AFFINITY = [
  { keywords: ['ceo', 'president', 'chief executive'],   prefer: 'executive_mandate' },
  { keywords: ['cmo', 'chief marketing', 'marketing'],   prefer: 'executive_public_statement' },
  { keywords: ['cso', 'chief strategy', 'strategy'],     prefer: 'executive_mandate' },
  { keywords: ['sales', 'revenue', 'partnerships'],      prefer: 'organizational_change' },
  { keywords: ['director', 'vp', 'vice president'],      prefer: 'campaign_or_activation' },
];

const scoreSignal = (s) => {
  if (!s) return -1;
  const base = SIGNAL_PRIORITY[s.signal_type] || 0;
  const quoteBonus = (s.exact_quote && String(s.exact_quote).trim()) ? 0.5 : 0;
  return base + quoteBonus;
};

// Returns [{ sig, origin }, ...] sorted high-to-low. `origin` is a stable
// identifier so the per-account batch loop can track which signals have
// already been assigned to earlier contacts.
const allSignalsForAccount = (account) => {
  if (!account) return [];
  const arr = [];
  if (account.top_signal) arr.push({ sig: account.top_signal, origin: 'top' });
  (account.deep_signals || []).forEach((s, i) => arr.push({ sig: s, origin: 'deep_' + i }));
  return arr.slice().sort((a, b) => scoreSignal(b.sig) - scoreSignal(a.sig));
};

const preferredTypeForRole = (role) => {
  const r = String(role || '').toLowerCase();
  const m = ROLE_SIGNAL_AFFINITY.find(rsa => rsa.keywords.some(k => r.includes(k)));
  return m ? m.prefer : null;
};

const pickPrimarySignal = (account) => {
  const sorted = allSignalsForAccount(account);
  return sorted.length ? sorted[0] : null;
};

// Pick a signal for this specific contact. Role-affinity match wins if a
// signal of the preferred type exists AND hasn't been used by an earlier
// contact at the same account. Otherwise fall back to the highest-priority
// unused signal. Last resort: the global top (may repeat).
const pickSignalForContact = (account, contactRole, usedOrigins) => {
  const sorted = allSignalsForAccount(account);
  if (sorted.length === 0) return null;
  const used = usedOrigins || new Set();
  const preferred = preferredTypeForRole(contactRole);
  if (preferred) {
    const prefMatch = sorted.find(s => s.sig.signal_type === preferred && !used.has(s.origin));
    if (prefMatch) return prefMatch;
  }
  const anyUnused = sorted.find(s => !used.has(s.origin));
  if (anyUnused) return anyUnused;
  return sorted[0];
};

// Rebuild an account object with `chosen.sig` as top_signal and every other
// signal demoted to deep_signals. Lets buildWaldoSystemContext stay
// signal-agnostic — it just formats whatever account it's handed.
const accountWithPrimarySignal = (account, chosen) => {
  if (!account || !chosen || !chosen.sig) return account;
  const allSigs = allSignalsForAccount(account);
  const others = allSigs.filter(s => s.origin !== chosen.origin).map(s => s.sig);
  return { ...account, top_signal: chosen.sig, deep_signals: others };
};

const buildWaldoSystemContext = (account, opts) => {
  if (!account) return '';
  // Fix 1: rescore signals so the highest-priority by signal_type wins
  // the primary slot. Callers can pass opts.primarySignal to override
  // (used for per-contact rotation in batch mode).
  const chosen = (opts && opts.primarySignal) || pickPrimarySignal(account);
  const effective = chosen ? accountWithPrimarySignal(account, chosen) : account;

  const lines = [];
  lines.push('=== WALDO PROSPECT INTELLIGENCE ===');
  lines.push('');
  const tension = effective.creative_tension || effective.top_signal?.why_it_matters || '';
  if (tension) {
    lines.push('STRATEGIC TENSION (primary brief — the problem BJL data must speak to):');
    lines.push(tension);
    lines.push('');
  }
  const urgency = effective.top_signal?.urgency || 'Building';
  const urgencyGuidance = {
    'Now': 'The email should feel timely and anchored to something happening right now. Reference the top signal directly if it strengthens the outreach.',
    'Seasonal': 'Anchor the frame to the current moment without over-indexing on urgency.',
    'Building': 'Frame the opportunity as forward-looking. Do not imply a crisis that does not exist.',
  };
  lines.push('URGENCY: ' + urgency + ' — ' + (urgencyGuidance[urgency] || ''));
  lines.push('');
  if (effective.top_signal) {
    lines.push('PRIMARY SIGNAL: ' + (effective.top_signal.headline || ''));
    if (effective.top_signal.detail) lines.push('Detail: ' + effective.top_signal.detail);
    if (effective.top_signal.exact_quote) {
      lines.push('EXACT QUOTE FROM THEIR LEADERSHIP: \"' + effective.top_signal.exact_quote + '\"');
      lines.push('(If you use this quote, use it verbatim — these are their own words.)');
    }
    if (effective.top_signal.why_it_matters) lines.push('Why it matters: ' + effective.top_signal.why_it_matters);
  }
  lines.push('');
  const hook = effective.sharpened_hook || effective.suggested_hook || '';
  if (hook) {
    lines.push('SHARPENED HOOK (directional — find your own expression grounded in BJL data):');
    lines.push(hook);
    lines.push('');
  }
  if (effective.petermayer_relevance) {
    lines.push('PETERMAYER POSITIONING FOR THIS ACCOUNT:');
    lines.push(effective.petermayer_relevance);
    lines.push('');
  }
  const deepSignals = effective.deep_signals || [];
  if (deepSignals.length) {
    lines.push('DEEP SIGNALS (background intelligence — use to inform which BJL findings are most relevant):');
    deepSignals.forEach(s => {
      lines.push('  [' + (s.signal_type || 'Signal') + '] ' + (s.headline || ''));
      if (s.exact_quote) lines.push('    Exact quote: \"' + s.exact_quote + '\"');
      if (s.why_it_matters) lines.push('    Why it matters: ' + s.why_it_matters);
    });
  }
  lines.push('');
  lines.push('=== END WALDO INTELLIGENCE ===');
  return lines.join('\n');
};

/* =========================================================================
 * 2. parseBatchFile — ported verbatim from the live deploy (CSV + XLSX).
 * ========================================================================= */
const parseBatchFile = (file) => {
  return new Promise((resolve, reject) => {
    const isXLSX = file.name.match(/\.xlsx?$/i);
    const reader = new FileReader();
    const extractContacts = (headers, rows) => {
      const h = headers.map(hh => String(hh || "").toLowerCase().trim());
      const find = (...terms) => h.findIndex(hh => terms.some(t => hh.includes(t)));
      const fullNameIdx = find("full name");
      const firstNameIdx = find("first name", "firstname");
      const lastNameIdx = find("last name", "lastname");
      const titleIdx = find("title", "role", "position");
      const companyIdx = find("company", "org", "account");
      const emailIdx = find("email");
      const descIdx = find("description", "desc");
      const industriesIdx = find("industries", "industry", "sector");
      const brandsIdx = find("associated brands", "brands");
      const contextIdx = find("context", "notes", "intel");
      const hasName = fullNameIdx >= 0 || firstNameIdx >= 0;
      if (!hasName && companyIdx < 0) throw new Error("Could not find Name or Company columns. Headers: " + h.slice(0,10).join(", "));
      return rows.map(vals => {
        const get = (i) => i >= 0 && vals[i] != null ? String(vals[i]).trim() : "";
        const name = get(fullNameIdx) || [get(firstNameIdx), get(lastNameIdx)].filter(Boolean).join(" ");
        const ctxParts = [
          get(descIdx) ? "About: " + get(descIdx) : "",
          get(industriesIdx) ? "Industries: " + get(industriesIdx) : "",
          get(brandsIdx) ? "Brands: " + get(brandsIdx) : "",
          get(contextIdx),
        ].filter(Boolean);
        return { name, company: get(companyIdx), role: get(titleIdx), email: get(emailIdx), context: ctxParts.join(" | ") };
      }).filter(c => c.name || c.company);
    };
    if (isXLSX) {
      reader.onload = (e) => {
        try {
          if (!window.XLSX) { reject("SheetJS not loaded — try refreshing the page."); return; }
          const wb = window.XLSX.read(e.target.result, { type: "array" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const data = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
          const nonEmpty = data.filter(r => r.some(c => c !== ""));
          if (nonEmpty.length < 2) { reject("Spreadsheet needs a header row and at least one contact."); return; }
          const contacts = extractContacts(nonEmpty[0], nonEmpty.slice(1));
          if (!contacts.length) { reject("No contacts found after the header row."); return; }
          resolve(contacts);
        } catch (err) { reject("Could not parse Excel file: " + err.message); }
      };
      reader.onerror = () => reject("File read error");
      reader.readAsArrayBuffer(file);
      return;
    }
    reader.onload = (e) => {
      try {
        const parseCSVLine = (line) => {
          const cols = []; let cur = "", inQ = false;
          for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"' && !inQ) inQ = true;
            else if (c === '"' && inQ && line[i+1] === '"') { cur += '"'; i++; }
            else if (c === '"' && inQ) inQ = false;
            else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ""; }
            else cur += c;
          }
          cols.push(cur.trim());
          return cols;
        };
        const text = e.target.result;
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) { reject("File needs a header row and at least one contact."); return; }
        const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().replace(/['"]/g,"").trim());
        const contacts = extractContacts(headers, lines.slice(1).map(parseCSVLine));
        if (!contacts.length) { reject("No contacts found after the header row."); return; }
        resolve(contacts);
      } catch (err) { reject("Could not parse file: " + err.message); }
    };
    reader.onerror = () => reject("File read error");
    reader.readAsText(file);
  });
};

/* =========================================================================
 * 3. queryBJL / investigateQuery — async job-queue clients.
 *
 * V2 was originally written against an SSE backend that emitted streaming
 * status / chunk / evidence / investigation_note events. The current backend
 * uses an enqueue + poll architecture (see netlify/functions/bjl-query*.js):
 *   - POST /api/bjl-query                  -> { job_id }, HTTP 202
 *   - GET  /api/bjl-query-status?id=<id>   -> { status, finding, scratch, ... }
 *   - status flips: pending -> running -> complete | error
 *
 * To preserve V2's UI contract (phase pill, evidence drawer, accumulating
 * chunk handlers, investigation notes), these clients enqueue a job and poll,
 * synthesizing V2's expected event stream from polled state. Streaming text
 * is collapsed to one onChunk(finding) emitted at the end — same trade as
 * the V1 frontend, accepted for correctness on long queries.
 * ========================================================================= */

// Shared poll helper. Polls /api/bjl-query-status until terminal state.
// Calls onTransition(job) once per status change. Returns the terminal job row.
//
// Hard cap raised from 5 min to 10 min after thorough investigations on
// multi-axis questions ("tensions, generational, income, regional patterns")
// were averaging 4.4 min and one ran 5.75 min — completing successfully on
// the backend but losing the result client-side because the cap was 5 min.
//
// Recovery on timeout: when the cap is reached, fire ONE final status check
// before throwing. If the job actually completed during the request that
// would have crossed the cap (or while a polling tick was throttled by the
// browser when the tab was backgrounded), return the completed job instead
// of timing out. Only throw the timeout error if the final check confirms
// the job is still running.

// Auth-aware fetch init helper. Reads the current Supabase session token
// from window.__bjlAuth (populated by AuthGate further down in this file)
// and attaches it as a Bearer header. Resolved at call time, not module
// load, because the token can refresh mid-conversation. When auth is in
// bypass mode (pre-Azure-live), getToken() returns null and no header is
// attached — preserving the existing unauthenticated behavior.
const authedFetchInit = (extraInit = {}) => {
  const token = (typeof window !== "undefined" && window.__bjlAuth && window.__bjlAuth.getToken)
    ? window.__bjlAuth.getToken()
    : null;
  const baseHeaders = extraInit.headers || {};
  const headers = token
    ? { ...baseHeaders, Authorization: "Bearer " + token }
    : { ...baseHeaders };
  return { ...extraInit, headers };
};

/* Extract the { blocks[], typed structured fields } that the synthesizer
 * emits and the background function persists as a `structured_synth_output`
 * scratch meta entry. Returns null when the turn didn't produce blocks
 * (e.g. conversational-posture answers, older jobs from before the
 * insight-blocks PR). */
function extractStructuredSynth(scratch) {
  if (!Array.isArray(scratch)) return null;
  for (let i = scratch.length - 1; i >= 0; i--) {
    const entry = scratch[i];
    if (entry && entry.type === 'structured_synth_output') return entry;
  }
  return null;
}
