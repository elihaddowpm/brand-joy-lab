const BatchEmailRow = ({ result, onUpdate }) => {
  const { contact, text, error, sources, polished, scorecard, revisionHistory, humanReviewRequired, brief, dismissed, approved } = result;
  const { subject, body } = parseSubjectBody(text || "");
  const [editSubject, setEditSubject] = useState(subject);
  const [editBody, setEditBody] = useState(body);
  const bodyRef = useRef(null);

  useEffect(() => {
    setEditSubject(subject);
    setEditBody(body);
  }, [text]);

  useEffect(() => {
    if (bodyRef.current) {
      bodyRef.current.style.height = "auto";
      bodyRef.current.style.height = bodyRef.current.scrollHeight + "px";
    }
  }, [editBody]);

  const hasEdits = editSubject !== subject || editBody !== body;

  const composeText = () => editSubject
    ? "Subject: " + editSubject + "\n\n" + editBody
    : editBody;

  const handleSaveApprove = () => {
    if (typeof onUpdate !== "function") return;
    const newText = composeText();
    // Only edited drafts feed the corpus — they're the high-signal examples.
    const wasEdited = newText !== (result.originalGenerated || result.text);
    if (wasEdited) {
      postApprovedEmail(result, { subject: editSubject, body: editBody, finalText: newText });
    }
    onUpdate(prev => ({
      ...prev,
      text: newText,
      approved: true,
      approvedAt: new Date().toISOString(),
      originalGenerated: prev.originalGenerated || prev.text,
      userEdited: newText !== (prev.originalGenerated || prev.text),
    }));
  };

  const handleDiscardEdits = () => {
    setEditSubject(subject);
    setEditBody(body);
  };

  const copyText = () => navigator.clipboard.writeText(composeText());

  const subjInputStyle = {
    flex: 1, border: "none", background: "transparent",
    font: "inherit", color: "inherit", outline: "none", padding: 0,
  };
  const bodyTextareaStyle = {
    width: "100%", border: "none", background: "transparent",
    font: "inherit", color: "inherit", outline: "none",
    padding: 0, margin: 0, resize: "none", overflow: "hidden",
    whiteSpace: "pre-wrap", lineHeight: 1.55,
  };
  const btnStyle = {
    fontSize: 12, padding: "4px 10px",
    border: "1px solid var(--grey-4, #d5d5d5)", borderRadius: 3,
    background: "white", color: "var(--grey-1)", cursor: "pointer",
    fontFamily: "inherit",
  };
  const primaryBtnStyle = {
    ...btnStyle,
    background: approved && !hasEdits ? "#e8f5e9" : "var(--grey-1, #222)",
    color: approved && !hasEdits ? "#2a7a2a" : "white",
    borderColor: approved && !hasEdits ? "#bcd9bc" : "var(--grey-1, #222)",
  };

  return (
    <div className="row-email v2 expanded" style={approved ? { borderLeft: "3px solid #4caf50" } : undefined}>
      <div className="re-head">
        <div>
          <div className="re-to">{contact.name}</div>
          <div className="re-role">{[contact.role, contact.email].filter(Boolean).join(" · ")}</div>
        </div>
        <div className="re-subj" style={{ display: "flex", gap: 6, alignItems: "baseline" }}>
          <span className="sub-label">Subj</span>
          <input
            type="text"
            value={editSubject}
            onChange={e => setEditSubject(e.target.value)}
            placeholder="(no subject)"
            disabled={!!error}
            style={subjInputStyle}
          />
        </div>
        <div className="re-actions">
          {!error && (
            <button className="icon-btn" title="Copy" onClick={copyText}>
              <Icon name="copy" />
            </button>
          )}
        </div>
      </div>
      {error ? (
        <div className="re-error">Failed: {error}</div>
      ) : (
        <>
          <textarea
            ref={bodyRef}
            value={editBody}
            onChange={e => setEditBody(e.target.value)}
            style={bodyTextareaStyle}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center" }}>
            <button
              type="button"
              style={primaryBtnStyle}
              onClick={handleSaveApprove}
              disabled={approved && !hasEdits}
              title={approved && !hasEdits ? "Already approved" : (hasEdits ? "Save your edits and approve this email" : "Approve this email as the example")}
            >
              {approved && !hasEdits ? "✓ Approved" : (hasEdits ? "Save edits & approve" : "Approve")}
            </button>
            {hasEdits ? (
              <button type="button" style={btnStyle} onClick={handleDiscardEdits} title="Revert your edits">
                Discard edits
              </button>
            ) : null}
            {approved && hasEdits ? (
              <span style={{ fontSize: 11, color: "var(--grey-2)" }}>
                unsaved edits since last approval
              </span>
            ) : null}
          </div>
          <EmailSources
            sources={sources}
            polished={polished}
            scorecard={scorecard}
            revisionHistory={revisionHistory}
            humanReviewRequired={humanReviewRequired}
            brief={brief}
            text={text}
            dismissed={dismissed}
            onUpdate={onUpdate}
          />
        </>
      )}
    </div>
  );
};

const JoyMapDeltaBadge = ({ cohortValue, corpusValue, metricLabel }) => {
  const c = Number(cohortValue);
  const x = Number(corpusValue);
  if (!Number.isFinite(c) || !Number.isFinite(x)) return null;
  const delta = c - x;
  if (Math.abs(delta) < 1) return null;
  const sign = delta > 0 ? '+' : '';
  const unit = metricLabel === 'JI' ? '' : 'pp';
  const rounded = metricLabel === 'JI' ? Math.round(delta) : Math.round(delta * 10) / 10;
  const tone = delta > 0 ? 'positive' : 'negative';
  return <span className={`joy-map-delta-badge joy-map-delta-${tone}`}>{sign}{rounded}{unit}</span>;
};

const JoyMapMiniGauge = ({ value, metricLabel, accent }) => {
  const v = Number(value);
  if (!Number.isFinite(v)) return null;
  let max, ref1, ref2;
  if (metricLabel === 'JI') { max = 100; ref1 = 60; ref2 = 70; }
  else if (metricLabel === 'Tag rate') { max = 25; ref1 = 5; ref2 = 15; }
  else { max = 100; ref1 = 50; ref2 = 65; }
  const clamped = Math.max(0, Math.min(v, max));
  const pct = (clamped / max) * 100;
  const ref1Pct = (ref1 / max) * 100;
  const ref2Pct = (ref2 / max) * 100;
  return (
    <div className="joy-map-mini-gauge" aria-hidden="true">
      <div className="joy-map-mini-gauge-bar">
        <div className="joy-map-mini-gauge-tick" style={{ left: `${ref1Pct}%` }} />
        <div className="joy-map-mini-gauge-tick" style={{ left: `${ref2Pct}%` }} />
        <div className="joy-map-mini-gauge-dot" style={{ left: `${pct}%`, background: accent }} />
      </div>
      <div className="joy-map-mini-gauge-scale">
        <span>0</span>
        <span style={{ left: `${ref1Pct}%` }}>{ref1}{metricLabel === 'JI' ? '' : '%'}</span>
        <span style={{ left: `${ref2Pct}%` }}>{ref2}{metricLabel === 'JI' ? '' : '%'}</span>
        <span style={{ right: 0 }}>{max}{metricLabel === 'JI' ? '' : '%'}</span>
      </div>
    </div>
  );
};

// ======================================================================
// JoyMapMode — the Joy Map workflow.
//
// Not tabs. One linear run:
//
//   STEP 1  INTAKE   — brand + context, with the resolution ladder
//   STEP 2  COHORT   — which split of the focal item we are reading
//   STEP 3  RUN      — the sixteen alignment rows, with depth taps
//   STEP 4  BULLETIN — send a row or a finding across as a candidate
//
// Steps 1-3 are one page (the Run view). The Bulletin is the second
// and only other view. Everything else that used to live here — the
// Audience Map tab, the Dance Map tab, the Predictions tab, roster as
// a destination — is gone. The renderers for the first two survive as
// module-level components (AudienceMapResults, JoyMapDanceMapResults);
// they have no entry point in this pane any more.
//
// A run is a saved artifact: its intake, context and cohort persist to
// local storage and can be reloaded into the form. Results are not
// cached — a reloaded run is re-run against live data.
// ======================================================================

const RUNS_STORAGE_KEY = 'bjl_joy_map_runs';
const MAX_SAVED_RUNS = 20;

const loadSavedRuns = () => {
  try {
    const raw = window.localStorage.getItem(RUNS_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
};

const JoyMapMode = () => {
  // Exactly two views.
  const [view, setView] = useState('run');

  // Step 1 context. Persists with the saved run.
  const [runEngagement, setRunEngagement] = useState('');
  const [runGeography, setRunGeography] = useState('');
  const [runContext, setRunContext] = useState('');
  const [savedRuns, setSavedRuns] = useState(loadSavedRuns);

  // Step 4 — the compose drawer. Non-null means a draft is open.
  const [compose, setCompose] = useState(null);
  const [composeToast, setComposeToast] = useState(null);

  // Connections state — one map per column, up to two columns for
  // side-by-side (Herschend two-door format). Each column carries its
  // own label + input (query OR focal-id csv) + running/error/result
  // state. Query goes through the front-door resolver; ids go direct.
  const [cxColumns, setCxColumns] = useState([
    { id: 'A', label: 'Door A', queryInput: '', focalIdsCsv: '', running: false, error: null, result: null },
    { id: 'B', label: 'Door B', queryInput: '', focalIdsCsv: '', running: false, error: null, result: null },
  ]);
  // Staff-only toggle. When true, modeled rows whose sign conflicts
  // with the measured territory mean lift (on 3+ pairs) are shown;
  // when false (default), those rows are hidden client-side.
  const [cxShowConflicting, setCxShowConflicting] = useState(false);
  // Cohort preset. Only 'leaners' is live until p_mode lands on the
  // three DB functions; the selector shows the others as disabled.
  const [cxCohortPreset, setCxCohortPreset] = useState('leaners');
  const setCxColumn = (id, patch) => setCxColumns(prev => prev.map(c => c.id === id ? { ...c, ...patch } : c));

  // Row-expand: per-territory profile cache. Key format
  // "focalIdsSorted::territoryKey" — matches the spec's "cache per
  // (focal, territory) per session" note. Each entry is
  // { loading?: true, error?: string, items?: [...] }.
  const [cxProfileCache, setCxProfileCache] = useState({});
  const cacheKey = (focalIds, territoryKey) =>
    `${(focalIds || []).slice().map(Number).sort((a,b) => a-b).join(',')}::${territoryKey}`;

  const fetchProfile = async (focalIds, territoryKey) => {
    const k = cacheKey(focalIds, territoryKey);
    if (cxProfileCache[k] && (cxProfileCache[k].items || cxProfileCache[k].error)) return;
    setCxProfileCache(prev => ({ ...prev, [k]: { loading: true } }));
    try {
      if (window.__bjlAuth && window.__bjlAuth.getSession) await window.__bjlAuth.getSession();
      const r = await fetch('/.netlify/functions/bjl-territory-profile', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ focal_item_ids: focalIds, territory_key: territoryKey }),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error((j && j.error) || `request failed (${r.status})`);
      setCxProfileCache(prev => ({ ...prev, [k]: { items: Array.isArray(j.items) ? j.items : [] } }));
    } catch (e) {
      setCxProfileCache(prev => ({ ...prev, [k]: { error: String(e.message || e) } }));
    }
  };

  // Roster tap — cache per territory_key.
  const [cxRosterCache, setCxRosterCache] = useState({});
  const fetchRoster = async (territoryKey) => {
    if (cxRosterCache[territoryKey] && (cxRosterCache[territoryKey].items || cxRosterCache[territoryKey].error)) return;
    setCxRosterCache(prev => ({ ...prev, [territoryKey]: { loading: true } }));
    try {
      if (window.__bjlAuth && window.__bjlAuth.getSession) await window.__bjlAuth.getSession();
      const r = await fetch('/.netlify/functions/bjl-territory-roster', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ territory_key: territoryKey }),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error((j && j.error) || `request failed (${r.status})`);
      setCxRosterCache(prev => ({ ...prev, [territoryKey]: { items: Array.isArray(j.items) ? j.items : [] } }));
    } catch (e) {
      setCxRosterCache(prev => ({ ...prev, [territoryKey]: { error: String(e.message || e) } }));
    }
  };

  // Prediction ledger. No longer a destination — the rows render as
  // pending-prediction chips on the territories they target and as a
  // section in the Bulletin, so this loads once and is read by both.
  const [cxPredictions, setCxPredictions] = useState({ loading: false, error: null, rows: null });
  const fetchPredictions = async () => {
    setCxPredictions({ loading: true, error: null, rows: null });
    try {
      if (window.__bjlAuth && window.__bjlAuth.getSession) await window.__bjlAuth.getSession();
      const r = await fetch('/.netlify/functions/bjl-model-predictions', authedFetchInit({ method: 'POST' }));
      const j = await r.json();
      if (!r.ok) throw new Error((j && j.error) || `request failed (${r.status})`);
      setCxPredictions({ loading: false, error: null, rows: Array.isArray(j.predictions) ? j.predictions : [] });
    } catch (e) {
      setCxPredictions({ loading: false, error: String(e.message || e), rows: null });
    }
  };

  // forceRungB re-runs the same query but tells the resolver to skip
  // its own items and read the category around them instead. It is the
  // one-tap escape offered by the pre-run halt card.
  const runConnectionsColumn = async (columnId, forceRungB) => {
    const col = cxColumns.find(c => c.id === columnId);
    if (!col) return;
    const ids = col.focalIdsCsv
      .split(/[,\s]+/)
      .map(s => parseInt(s, 10))
      .filter(n => Number.isFinite(n) && n > 0);
    const query = (col.queryInput || '').trim();
    if (ids.length === 0 && !query) {
      setCxColumn(columnId, { error: 'Enter a query (front-door resolver) or focal item ids (comma-separated).', result: null });
      return;
    }
    setCxColumn(columnId, { running: true, error: null, result: null });
    const invoke = async () => fetch('/.netlify/functions/bjl-joy-map-connections', authedFetchInit({
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ids.length > 0 ? { focal_item_ids: ids } : { query, force_rung_b: !!forceRungB }),
    }));
    try {
      if (window.__bjlAuth && window.__bjlAuth.getSession) await window.__bjlAuth.getSession();
      let r = await invoke();
      let j = await r.json();
      if (r.status === 401 && j && j.auth_failed) {
        if (window.__bjlAuth && window.__bjlAuth.getSession) await window.__bjlAuth.getSession();
        r = await invoke();
        j = await r.json();
      }
      if (!r.ok) {
        const detail = (j && (j.auth_failed
          ? 'Session token was rejected after a fresh refresh. Sign out and sign back in.'
          : j.error)) || `request failed (${r.status})`;
        throw new Error(detail);
      }
      setCxColumn(columnId, { result: j });
    } catch (e) {
      setCxColumn(columnId, { error: String(e.message || e) });
    } finally {
      setCxColumn(columnId, { running: false });
    }
  };

  // Save the run artifact — intake + context + cohort. Results are
  // deliberately not stored: reloading a run re-runs it against live
  // data rather than showing a stale sweep.
  const saveRun = (doors) => {
    const artifact = {
      run_id: `run_${Date.now()}`,
      saved_at: new Date().toISOString(),
      engagement: runEngagement.trim(),
      geography: runGeography.trim(),
      context: runContext.trim(),
      cohort_preset: cxCohortPreset,
      doors,
    };
    setSavedRuns(prev => {
      const next = [artifact, ...prev].slice(0, MAX_SAVED_RUNS);
      try { window.localStorage.setItem(RUNS_STORAGE_KEY, JSON.stringify(next)); }
      catch (e) { console.warn('[joy-map] run artifact not saved:', e.message); }
      return next;
    });
  };

  const restoreRun = (artifact) => {
    setRunEngagement(artifact.engagement || '');
    setRunGeography(artifact.geography || '');
    setRunContext(artifact.context || '');
    if (artifact.cohort_preset) {
      const p = COHORT_PRESETS.find(x => x.key === artifact.cohort_preset);
      if (p && p.live) setCxCohortPreset(p.key);
    }
    setCxColumns(prev => prev.map(c => {
      const d = (artifact.doors || []).find(x => x.id === c.id);
      return d
        ? { ...c, label: d.label || c.label, queryInput: d.query || '', focalIdsCsv: d.focal_ids_csv || '', result: null, error: null }
        : { ...c, result: null, error: null };
    }));
  };

  // Step 3. Runs every door that carries an input, then saves the run.
  const runAllDoors = async () => {
    const filled = cxColumns.filter(c => c.queryInput.trim() || c.focalIdsCsv.trim());
    if (filled.length === 0) return;
    fetchPredictions();
    await Promise.all(filled.map(c => runConnectionsColumn(c.id)));
    saveRun(filled.map(c => ({
      id: c.id, label: c.label, query: c.queryInput.trim(), focal_ids_csv: c.focalIdsCsv.trim(),
    })));
  };

  const activePreset = COHORT_PRESETS.find(p => p.key === cxCohortPreset) || COHORT_PRESETS[0];
  const anyRunning = cxColumns.some(c => c.running);
  const anyInput = cxColumns.some(c => c.queryInput.trim() || c.focalIdsCsv.trim());

  return (
    <div className="joy-map-mode">
      {/* Two views. That is the whole pane. */}
      <div className="joy-map-toolbar">
        <button className={`btn ${view === 'run' ? 'primary' : 'ghost'}`} onClick={() => setView('run')}>Run</button>
        <button className={`btn ${view === 'bulletin' ? 'primary' : 'ghost'}`} onClick={() => { setView('bulletin'); fetchPredictions(); }}>Opportunity Bulletin</button>
      </div>

      {composeToast && (
        <div className="joy-map-toast">
          <span>{composeToast}</span>
          <button className="btn ghost" onClick={() => { setComposeToast(null); setView('bulletin'); }}>Open the Bulletin</button>
          <button className="btn ghost" onClick={() => setComposeToast(null)}>Dismiss</button>
        </div>
      )}

      {view === 'run' && (
        <div className="joy-map-run">

          {/* ---------------- STEP 1 — INTAKE ---------------- */}
          <section className="run-step">
            <div className="run-step-head"><span className="run-step-n">1</span> Intake — brand and context</div>
            <div className="run-step-note">
              One door for a single read; two for a side-by-side (the two-door format — a client with two competing brands or gates). Type a brand, attraction or category for the front-door resolver, <em>or</em> paste focal item ids directly. When the run lands, the focal card states which rung of the resolution ladder applied — a substitution is never silent.
            </div>

            <div className="run-doors">
              {cxColumns.map(col => (
                <div key={col.id} className="run-door">
                  <input
                    className="joy-map-cx-label-input"
                    value={col.label}
                    onChange={(e) => setCxColumn(col.id, { label: e.target.value })}
                    placeholder="Door label (e.g. Door A)"
                  />
                  <label className="joy-map-cx-input-label">Brand, attraction or category
                    <input
                      type="text"
                      value={col.queryInput}
                      onChange={(e) => setCxColumn(col.id, { queryInput: e.target.value })}
                      placeholder="e.g. Silver Dollar City, or theme parks"
                      disabled={col.running}
                    />
                  </label>
                  <label className="joy-map-cx-input-label" style={{marginTop: 8}}>Or focal item ids (1–4, comma-separated)
                    <input
                      type="text"
                      value={col.focalIdsCsv}
                      onChange={(e) => setCxColumn(col.id, { focalIdsCsv: e.target.value })}
                      placeholder="e.g. 4646, 4607"
                      disabled={col.running}
                    />
                  </label>
                </div>
              ))}
            </div>

            {/* Resolution ladder, rung (c). The panel read is what we
                have; the client first-party cohort is a V3 slot and
                renders disabled rather than silently absent. */}
            <div className="run-ladder">
              <div className="run-ladder-label">Source</div>
              <label className="run-ladder-opt">
                <input type="radio" name="run-source" checked readOnly />
                BJL panel — fielded items, with the substitution labelled when the brand isn't fielded nationally
              </label>
              <label className="run-ladder-opt disabled">
                <input type="radio" name="run-source" disabled />
                Client first-party cohort <span className="run-pending">(V3 — not built)</span>
              </label>
            </div>

            <div className="run-context-fields">
              <label className="joy-map-cx-input-label">Engagement
                <input type="text" value={runEngagement} onChange={(e) => setRunEngagement(e.target.value)}
                  placeholder="e.g. Herschend 2026 — Silver Dollar City" />
              </label>
              <label className="joy-map-cx-input-label">Geography note
                <input type="text" value={runGeography} onChange={(e) => setRunGeography(e.target.value)}
                  placeholder="e.g. Branson DMA question, read on the national panel" />
              </label>
              <label className="joy-map-cx-input-label">Context
                <textarea rows={3} value={runContext} onChange={(e) => setRunContext(e.target.value)}
                  placeholder="What prompted this run, and what would count as an answer." />
              </label>
            </div>

            {savedRuns.length > 0 && (
              <details className="run-saved">
                <summary>{savedRuns.length} saved run{savedRuns.length === 1 ? '' : 's'}</summary>
                <ul className="run-saved-list">
                  {savedRuns.map(r => (
                    <li key={r.run_id}>
                      <button className="btn ghost" onClick={() => restoreRun(r)}>Reload</button>
                      <span className="run-saved-desc">
                        {(r.doors || []).map(d => `${d.label}: ${d.query || d.focal_ids_csv || '—'}`).join(' · ') || '—'}
                      </span>
                      <span className="run-saved-meta">
                        {r.engagement || 'no engagement'} · {r.cohort_preset || 'leaners'} · {r.saved_at ? new Date(r.saved_at).toLocaleString() : '—'}
                      </span>
                    </li>
                  ))}
                </ul>
                <div className="run-saved-note">
                  Runs are saved in this browser, not on the server. Reloading restores the intake, the context and the cohort; the sweep itself is re-run against live data rather than replayed from cache.
                </div>
              </details>
            )}
          </section>

          {/* ---------------- STEP 2 — COHORT ---------------- */}
          <section className="run-step">
            <div className="run-step-head"><span className="run-step-n">2</span> Cohort isolation</div>
            {/* The preset changes only the cohort CTE; the focal ids
                are identical downstream. Devotees and the gate need
                p_mode on the three DB functions, which is not in the
                database yet — those options stay disabled and say so. */}
            <div className="joy-map-cx-preset">
              {COHORT_PRESETS.map(p => (
                <button
                  key={p.key}
                  className={`btn ${cxCohortPreset === p.key ? 'primary' : 'ghost'}`}
                  disabled={!p.live}
                  title={p.live ? p.sentence : `${p.sentence} Not available until the p_mode parameter lands on the sweep functions.`}
                  onClick={() => setCxCohortPreset(p.key)}
                >
                  {p.label}{p.live ? '' : ' (pending p_mode)'}
                </button>
              ))}
            </div>
            <div className="run-cohort-sentence">{activePreset.sentence}</div>
            <label style={{display:'inline-flex', alignItems:'center', gap:6, fontSize:12, color:'var(--iron-darker,#5a5a55)', marginTop: 10}}>
              <input type="checkbox" checked={cxShowConflicting} onChange={(e) => setCxShowConflicting(e.target.checked)} />
              Staff-only: show sign-conflicting modeled rows (modeled diamond disagrees with the measured territory mean on 3+ pairs)
            </label>
          </section>

          {/* ---------------- STEP 3 — RUN ---------------- */}
          <section className="run-step">
            <div className="run-step-head"><span className="run-step-n">3</span> Run — the sixteen life territories</div>
            <div className="run-step-note">
              Sixteen territories, one row each. Every row carries an alignment state — ALIGNED, MISALIGNED, GROWTH, UNCLAIMED, FLAT — plus the lead pair, a magnitude chip, a THIN badge when fewer than three pairs sit behind the lead, and the modeled diamond against the measured territory mean (staff). Tap a row for the territory profile; tap again inside it for the roster. This is the analysis — there is nowhere else to go. r_internal never renders.
            </div>
            <div className="joy-map-actions">
              <button className="btn primary" disabled={anyRunning || !anyInput} onClick={runAllDoors}>
                {anyRunning ? 'Running…' : 'Run'}
              </button>
              {!anyInput && <span className="run-step-hint">Fill at least one door in step 1.</span>}
            </div>
            <div className="joy-map-cx-grid">
              {cxColumns.map(col => (
                (col.running || col.error || col.result) ? (
                  <div key={col.id} className="joy-map-cx-column">
                    <div className="joy-map-cx-column-head-label">{col.label}</div>
                    {col.running && <div className="joy-map-loading">Sweeping the sixteen territories…</div>}
                    {col.error && <div className="joy-map-error" style={{marginTop: 10}}>Error: {col.error}</div>}
                    {col.result && (
                      <JoyMapConnectionsSweep
                        result={col.result}
                        showConflicting={cxShowConflicting}
                        profileCache={cxProfileCache}
                        onOpenProfile={(tKey) => fetchProfile(col.result.focals.map(f => f.item_id), tKey)}
                        rosterCache={cxRosterCache}
                        onOpenRoster={(tKey) => fetchRoster(tKey)}
                        predictions={cxPredictions.rows}
                        cohortPreset={cxCohortPreset}
                        doorLabel={col.label}
                        engagement={runEngagement}
                        onSendToBulletin={setCompose}
                        onRunRungB={col.queryInput.trim() ? () => runConnectionsColumn(col.id, true) : null}
                      />
                    )}
                  </div>
                ) : null
              ))}
            </div>
          </section>
        </div>
      )}

      {view === 'bulletin' && (
        <OpportunityBulletin predictionState={cxPredictions} onLoadPredictions={fetchPredictions} />
      )}

      {/* ---------------- STEP 4 — SEND TO BULLETIN ---------------- */}
      {compose && (
        <BulletinCompose
          draft={compose}
          onClose={() => setCompose(null)}
          onCreated={(opp) => {
            setCompose(null);
            setComposeToast(`Candidate #${opp.opportunity_id} created — "${opp.title}".`);
          }}
        />
      )}
    </div>
  );
};

// -------------------------------------------------------------------------
// JoyMapConnectionsSweep — three-tier renderer.
//
// SQL contract (from server):
//   bjl_joy_map_sweep_v2(focal) s JOIN bjl_joy_map_modeled(focal, model)
//   USING (ord, territory)
//
// Row anatomy (per territory):
//   1. Measured lead bar: lift_points, direction-color, focal↔other.
//   2. Diamond (modeled): modeled_lift_points plotted AGAINST
//      measured_territory_mean_lift (never against the lead bar).
//   3. Magnitude chip: territory_magnitude.
//   4. THIN badge when pairs_behind < 3.
//   5. Verdict styles: measured / flat / unmeasured-dashed /
//      model_abstains (holdout r shown) / model_abstains_cohort.
//   6. Sign-conflict suppression: modeled row hidden client-side
//      when sign(modeled) !== sign(measured_territory_mean_lift) AND
//      pairs_behind >= 3. Staff-only toggle brings it back.
// r never renders. holdout_r renders on model_abstains rows only.
// -------------------------------------------------------------------------
// Alignment state — the client-language recoding of the staff verdict.
// Deterministic from columns we already have (verdict + direction +
// territory_magnitude); no backend change. GROWTH is evaluated first
// because a big-magnitude territory with a non-positive lead is the
// money cell, not merely a misalignment.
const GROWTH_MAGNITUDE_FLOOR = 55;

const ALIGNMENT_COPY = {
  ALIGNED:    'The brand already rises with this territory. Own what you have.',
  MISALIGNED: 'People who love this territory move away from the brand. That is a strategy question — the territory belongs to someone else — not a failure.',
  GROWTH:     'Big feeling, unowned. The territory carries real magnitude and the brand has no positive claim on it.',
  UNCLAIMED:  'No ledger pair covers this territory for this focal set, and the magnitude is modest. Honest gap — co-fielding candidate.',
  FLAT:       'Checked. Nothing there.',
};

const alignmentState = (t) => {
  const verdict = t.verdict || '';
  const magnitude = t.territory_magnitude == null ? null : Number(t.territory_magnitude);
  const direction = t.direction || (t.lead && t.lead.direction) || null;
  const positiveLead = verdict === 'measured' && direction === 'rises with';

  if (magnitude != null && magnitude >= GROWTH_MAGNITUDE_FLOOR && !positiveLead) return 'GROWTH';
  if (verdict === 'measured') return positiveLead ? 'ALIGNED' : 'MISALIGNED';
  if (verdict === 'flat') return 'FLAT';
  if (verdict === 'unmeasured') return 'UNCLAIMED';
  // Tolerance: an unknown verdict string surfaces verbatim rather than
  // blanking the row (fixture 4).
  return verdict || 'UNKNOWN';
};

// Cohort presets. The preset changes only the cohort CTE inside the
// three DB functions; the focal ids are identical downstream. Devotees
// and the behavioural/demographic gate need the p_mode parameter on
// bjl_joy_map_sweep_v2 / _modeled / bjl_territory_profile, which is not
// in the database yet — those options stay disabled and say so.
const COHORT_PRESETS = [
  { key: 'leaners',  label: 'Leaners',  live: true,
    sentence: 'Warm half versus cool half of the focal item, split against each person\u2019s own baseline.' },
  { key: 'devotees', label: 'Devotees', live: false,
    sentence: 'Top third versus bottom third on the focal item, split against each person\u2019s own baseline.' },
  { key: 'gate',     label: 'Behavioural / demographic gate', live: false,
    sentence: 'A focal split taken inside a gate (occupation, decision-maker role, generation, region).' },
];

// -------------------------------------------------------------------------
// Brand resolution ladder (step 1 of the run).
//
//   a. Brand items fielded          → read the brand item directly.
//   b. Brand unfielded (the common  → resolve to category + audience
//      case)                          anchors, substitution LABELLED.
//   c. Client first-party cohort    → V3. Rendered disabled; not built.
//
// Derived client-side from what the front door already returns: the
// query text and the item names it resolved to. A rung-(a) read is one
// where a content word of the query survives into a resolved item
// name; anything else is a substitution and says so on the focal card.
// -------------------------------------------------------------------------
// The rung is decided on the server, where eligibility against the
// scored ledger is knowable. The client used to guess it by looking for
// query tokens surviving into an item name; that guess could not see
// whether the item was scored, which is the thing that actually matters.
const RESOLUTION_RUNG_LABEL = {
  direct: 'Rung — direct ids',
  a:      'Rung a — fielded on scored items',
  b:      'Rung b — unfielded, read through substitutes',
  none:   'Ladder exhausted — nothing scored to read',
};

// Evidence tiers offered on a bulletin card. A draft arrives with the
// tier already derived from the row it came from; the analyst can
// change it, but never to something the row cannot carry.
const EVIDENCE_TIERS = ['measured', 'modeled', 'unmeasured', 'signal-only'];

// Modeled only counts as a tier when the model actually spoke and
// carries a holdout accuracy. Abstaining or accuracy-less rows fall
// back to unmeasured rather than borrowing credibility.
const deriveEvidenceTier = (t) => {
  if (t.verdict === 'measured') return 'measured';
  const m = t.modeled;
  const spoke = m && m.verdict && !/^model_abstains/.test(m.verdict) && m.holdout_r != null && m.lift_points != null;
  return spoke ? 'modeled' : 'unmeasured';
};

const JoyMapConnectionsSweep = ({ result, showConflicting, profileCache, onOpenProfile, rosterCache, onOpenRoster, predictions, cohortPreset, doorLabel, engagement, onSendToBulletin, onRunRungB }) => {
  if (!result || !Array.isArray(result.territories)) return null;

  // Front-door escalation surface. When the brief comes back as
  // needs_clarification or out_of_scope, the endpoint short-circuits
  // with an empty territories list — without this card, the column
  // would look inert. Same pattern as the connections-beta pane's
  // clarification card.
  const brief = result.brief || null;
  if (brief && brief.shape === 'needs_clarification') {
    return (
      <div className="conn-clarify" style={{marginTop: 12}}>
        <div className="conn-clarify-eyebrow">Clarification needed</div>
        <div className="conn-clarify-question">
          {brief.clarifying_question || 'Could you rephrase — I need a specific experience, brand, or category to run this against.'}
        </div>
        {brief.shape_reasoning && (
          <div className="conn-clarify-reason">Front door: {brief.shape_reasoning}</div>
        )}
      </div>
    );
  }
  if (brief && brief.shape === 'out_of_scope') {
    return (
      <div className="conn-clarify" style={{marginTop: 12}}>
        <div className="conn-clarify-eyebrow">Out of scope for the Joy Map</div>
        <div className="conn-clarify-question">
          The Joy Map connections sweep reads how experiences and brands travel together across the 16 life territories — try a question of that shape.
        </div>
        {brief.shape_reasoning && (
          <div className="conn-clarify-reason">Front door: {brief.shape_reasoning}</div>
        )}
      </div>
    );
  }
  if (result.note && Array.isArray(result.focals) && result.focals.length === 0) {
    return (
      <div className="conn-clarify" style={{marginTop: 12}}>
        <div className="conn-clarify-eyebrow">No focals</div>
        <div className="conn-clarify-question">{result.note}</div>
      </div>
    );
  }
  // Ladder exhausted. Nothing the resolver found is in the scored
  // ledger and the category behind it has nothing either. Saying so is
  // the whole output — there is no map underneath this.
  if (result.resolution && result.resolution.rung === 'none') {
    return (
      <div className="conn-clarify" style={{marginTop: 12}}>
        <div className="conn-clarify-eyebrow">Resolution ladder exhausted</div>
        <div className="conn-clarify-question">{result.resolution.line}</div>
        {Array.isArray(result.resolution.dropped) && result.resolution.dropped.length > 0 && (
          <div className="conn-clarify-reason">
            Dropped: {result.resolution.dropped.map(d => `${d.item_name || `#${d.item_id}`} (id ${d.item_id})`).join('; ')}
          </div>
        )}
      </div>
    );
  }

  const focals = Array.isArray(result.focals) ? result.focals : [];
  const territories = result.territories;
  const modelVersion = result.model_version || null;
  const colorPalette = ['#7a2e10', '#1d6a58', '#40527a', '#7a5b1d'];
  const focalColorByName = new Map();
  focals.forEach((f, i) => {
    if (f.item_name) focalColorByName.set(f.item_name, colorPalette[i % colorPalette.length]);
  });

  const directionArrow = (dir) => dir === 'rises with' ? '↔' : dir === 'runs against' ? '⇄' : '·';
  const directionColor = (dir) => dir === 'rises with' ? '#1d6a58' : dir === 'runs against' ? '#7a2e10' : '#5a5a55';
  const signedNum = (n) => n == null ? '—' : `${n > 0 ? '+' : ''}${n}`;

  const renderPairLine = (row, isLead) => {
    if (!row) return null;
    const color = row.focal_item ? (focalColorByName.get(row.focal_item) || '#5a5a55') : '#5a5a55';
    return (
      <div className={`joy-map-cx-pair-line ${isLead ? 'is-lead' : 'is-runner'}`}>
        <span className="joy-map-cx-pair-focal" style={{color}}>{row.focal_item || '—'}</span>
        <span className="joy-map-cx-pair-arrow" style={{color: directionColor(row.direction)}}>
          {' '}{directionArrow(row.direction)}{' '}
        </span>
        <span className="joy-map-cx-pair-other">{row.other_item || '—'}</span>
        {row.other_family && row.other_family !== 'joy' && (
          <span className="joy-map-cx-pair-family"> · {row.other_family}</span>
        )}
        {/* Rendering contract: no number appears without its n at equal
            prominence, and the base leads so every lift arrives
            pre-qualified by the evidence under it. A +20.7 on n=375 and a
            +20.8 on n=7,452 are not peers, and the line must not let them
            read as peers. Visual confidence weighting — bar weight scaled
            to base — is the proper treatment and belongs to the CD brief;
            this ordering is the cheap half that holds until then. */}
        <span className="joy-map-cx-pair-metrics">
          {row.shared_answerers != null && <span>n={row.shared_answerers.toLocaleString()}</span>}
          {row.pct_move_together != null && <span> · {row.pct_move_together}% together</span>}
          {row.lift_points != null && <span> · <strong style={{color: directionColor(row.direction)}}>{signedNum(row.lift_points)}</strong></span>}
        </span>
      </div>
    );
  };

  // Modeled diamond, plotted against the territory mean lift (not the
  // lead bar). modeled_verdict is display text, not an enum —
  // anything matching /^model_abstains/ styles muted and the string
  // renders verbatim (per section 0.1 of the functional-wiring spec:
  // "model_abstains_coherence", "model_abstains_items", etc. may
  // appear).
  const renderModeledDiamond = (t) => {
    const m = t.modeled;
    if (!m) return null;
    const verdictStr = m.verdict || '';
    const isAbstain = /^model_abstains/.test(verdictStr);
    if (isAbstain) {
      return (
        <div className="joy-map-cx-modeled abstains">
          <span className="joy-map-cx-modeled-label">Model estimate</span>
          <span className="joy-map-cx-modeled-abstain">
            {verdictStr} — accuracy r = {m.holdout_r != null ? m.holdout_r : '—'}
            {m.coherence != null ? `, coherence ${m.coherence}` : ''}
            {verdictStr === 'model_abstains_cohort' && (m.cohort_hot != null || m.cohort_cool != null)
              ? ` (cohort hot ${m.cohort_hot ?? '—'} / cool ${m.cohort_cool ?? '—'})`
              : ''
            }. No estimate rendered for this territory.
          </span>
        </div>
      );
    }
    // Suppression only fires when sign_conflict AND the territory has
    // >= 3 pairs behind the lead (server sets suppress_on_conflict).
    // Below-threshold conflicts still surface as a badge on the
    // diamond so the reader sees the disagreement.
    if (m.suppress_on_conflict && !showConflicting) {
      return (
        <div className="joy-map-cx-modeled suppressed">
          <span className="joy-map-cx-modeled-label">Model estimate</span>
          <span className="joy-map-cx-modeled-suppress">
            hidden — modeled diamond disagrees in sign with the measured territory mean lift, and the territory has 3+ pairs behind it. Toggle "Show sign-conflicting modeled rows" above to reveal.
          </span>
        </div>
      );
    }
    // On unmeasured territories, there is no measured territory mean
    // to plot against — show the modeled read as an absolute value
    // (the "fill the gap" case, gated by holdout_r).
    const hasMeasuredMean = m.measured_territory_mean_lift != null;
    return (
      <div className="joy-map-cx-modeled modeled">
        <span className="joy-map-cx-modeled-label">
          Model estimate {m.holdout_r != null ? `(accuracy r=${m.holdout_r})` : ''}
        </span>
        <span className="joy-map-cx-modeled-diamond">
          {hasMeasuredMean
            ? <>◆ <strong>{signedNum(m.lift_points)}</strong> vs territory mean <strong>{signedNum(m.measured_territory_mean_lift)}</strong></>
            : <>◆ <strong>{signedNum(m.lift_points)}</strong> pts (no measured territory mean — model fills the gap)</>
          }
        </span>
        {m.sign_conflict && (
          <span className="joy-map-cx-modeled-conflict">
            · sign conflict{m.suppress_on_conflict ? ' (staff override)' : ' (below suppression threshold)'}
          </span>
        )}
        {m.coherence != null && (
          <span className="joy-map-cx-modeled-r"> · coherence {m.coherence}</span>
        )}
        {m.centroid_items != null && (
          <span className="joy-map-cx-modeled-r"> · {m.centroid_items} centroid items</span>
        )}
      </div>
    );
  };

  const modelAbstains = territories.filter(t =>
    t.modeled && t.modeled.verdict && /^model_abstains/.test(t.modeled.verdict)
  ).length;
  const focalIdsForCache = focals.map(f => f.item_id);
  const preset = COHORT_PRESETS.find(p => p.key === cohortPreset) || COHORT_PRESETS[0];
  const resolution = result.resolution || { rung: 'direct', line: '' };
  const halt = result.halt || null;

  // The population sentence every claim inherits. One string, written
  // once, so a card in the Bulletin says exactly what the focal card
  // said about who was counted.
  const populationSentence =
    `${preset.label} cohort on ${focals.map(f => f.item_name || `#${f.item_id}`).join(' + ') || 'the focal set'}` +
    ` — ${result.cohort_hot != null ? result.cohort_hot.toLocaleString() : '—'} hot / ` +
    `${result.cohort_cool != null ? result.cohort_cool.toLocaleString() : '—'} cool. ${preset.sentence}` +
    (resolution.rung === 'b' ? ` Substitution: ${resolution.line}` : '');

  const claimContext = {
    engagement: engagement || '',
    door_label: doorLabel || '',
    focal_ids: focalIdsForCache,
    population: populationSentence,
    model_version: modelVersion,
  };

  // Pending predictions that target a territory on this map. A ledger
  // row counts when it is unverified and either carries no focal set or
  // carries exactly this one.
  // Step 4 — the only bridge to the Bulletin. Every draft is built
  // from a row that was actually measured or modeled; the Bulletin
  // never invents a claim, and the analyst supplies the action, the
  // window and any marketplace signals on the compose form.
  const territoryDraft = (t, state) => {
    const lead = t.lead;
    const leadSentence = lead
      ? `Lead pair: ${lead.focal_item || '—'} ${lead.direction || '·'} ${lead.other_item || '—'}, lift ${signedNum(lead.lift_points)} points across ${lead.shared_answerers != null ? lead.shared_answerers.toLocaleString() : '—'} shared answerers.`
      : 'No measured lead pair covers this territory for this focal set.';
    return {
      origin: `Territory row — ${t.territory} (${state})`,
      engagement: claimContext.engagement,
      title: `${t.territory} — ${state}`,
      claim_summary: [
        ALIGNMENT_COPY[state] || `Alignment state '${state}'.`,
        leadSentence,
        t.territory_magnitude != null ? `Territory magnitude ${t.territory_magnitude}.` : '',
        t.thin ? 'THIN — fewer than three pairs sit behind the lead.' : '',
      ].filter(Boolean).join(' '),
      claim_population: claimContext.population,
      evidence_tier: deriveEvidenceTier(t),
      claim_items: claimContext.focal_ids,
    };
  };

  const focalKey = focalIdsForCache.slice().map(Number).sort((a, b) => a - b).join(',');
  const pendingByTerritory = new Map();
  for (const p of (Array.isArray(predictions) ? predictions : [])) {
    if (p.verified_at) continue;
    if (!p.territory_key) continue;
    const pf = Array.isArray(p.focal_items) ? p.focal_items.map(Number).sort((a, b) => a - b).join(',') : '';
    if (pf && pf !== focalKey) continue;
    if (!pendingByTerritory.has(p.territory_key)) pendingByTerritory.set(p.territory_key, []);
    pendingByTerritory.get(p.territory_key).push(p);
  }

  return (
    <div className="joy-map-cx-sweep">
      {/* Focal card (mandatory per spec). Every map has a focal
          card, showing item wording(s), the door label, and the
          cohort_hot/cohort_cool split with the "split against each
          person's own baseline" sentence. */}
      <div className="joy-map-cx-focal-card">
        <div className="joy-map-cx-focal-card-eyebrow">Focal card</div>
        <ul className="joy-map-cx-focal-card-items">
          {focals.map(f => (
            <li key={f.item_id} style={{borderLeftColor: focalColorByName.get(f.item_name) || '#5a5a55'}}>
              <span className="joy-map-cx-focal-card-name">{f.item_name || `#${f.item_id}`}</span>
              <span className="joy-map-cx-focal-card-id"> · id {f.item_id}</span>
            </li>
          ))}
        </ul>
        {/* Resolution ladder. Which rung applied is stated here, on
            the card, so a substitution is never silent. */}
        <div className={`joy-map-cx-resolution rung-${resolution.rung}`}>
          <span className="joy-map-cx-resolution-rung">{RESOLUTION_RUNG_LABEL[resolution.rung] || resolution.rung}</span>
          <span className="joy-map-cx-resolution-line">{resolution.line}</span>
        </div>
        <div className="joy-map-cx-focal-card-cohort">
          Cohort (<strong>{preset.label}</strong>): <strong>{result.cohort_hot != null ? result.cohort_hot.toLocaleString() : '—'}</strong> hot / <strong>{result.cohort_cool != null ? result.cohort_cool.toLocaleString() : '—'}</strong> cool.
          <span style={{fontStyle: 'italic'}}> {preset.sentence}</span>
        </div>
        {modelVersion && (
          <div className="joy-map-cx-focal-card-model">
            model: {modelVersion}{modelAbstains > 0 ? ` · ${modelAbstains} territor${modelAbstains === 1 ? 'y' : 'ies'} abstain` : ''}
          </div>
        )}
      </div>
      {/* Gate 3 — pre-run halt. The rows are withheld, not emptied:
          sixteen leads computed off a handful of people read exactly
          like sixteen leads computed off thousands. */}
      {halt && (
        <div className="joy-map-cx-halt">
          <div className="joy-map-cx-halt-eyebrow">Halted — cohort below floor</div>
          <div className="joy-map-cx-halt-line">{halt.line}</div>
          <div className="joy-map-cx-halt-ladder">
            Ladder outcome: {RESOLUTION_RUNG_LABEL[resolution.rung] || resolution.rung}. {resolution.line}
          </div>
          {resolution.rung !== 'b' && onRunRungB && (
            <button className="btn primary" onClick={onRunRungB}>
              Read the category instead
            </button>
          )}
        </div>
      )}
      {!halt && (
      <ul className="joy-map-cx-sweep-rows">
        {territories.map(t => {
          const verdictClass = `verdict-${t.verdict || 'unknown'}`;
          const lead = t.lead;
          const territoryKey = t.territory_key || null;
          const cacheK = territoryKey ? `${focalIdsForCache.slice().sort((a,b)=>a-b).join(',')}::${territoryKey}` : null;
          const profile = cacheK ? (profileCache || {})[cacheK] : null;
          const rosterEntry = territoryKey ? (rosterCache || {})[territoryKey] : null;
          const state = alignmentState(t);
          const pending = territoryKey ? (pendingByTerritory.get(territoryKey) || []) : [];
          return (
            <li key={`${t.ord}-${t.territory}`} className={`joy-map-cx-row ${verdictClass} state-${state}`}>
              <div className="joy-map-cx-row-head">
                <span className="joy-map-cx-row-ord">{String(t.ord).padStart(2, '0')}</span>
                <span className="joy-map-cx-row-domain">
                  {t.territory}
                  {t.emotional_job && <span className="joy-map-cx-row-emojob"> · {t.emotional_job}</span>}
                </span>
                <span className={`joy-map-cx-state state-${state}`} title={ALIGNMENT_COPY[state] || `Alignment state: ${state}`}>{state}</span>
                <span className={`joy-map-cx-row-verdict ${verdictClass}`}>{t.verdict || 'unknown'}</span>
                {pending.length > 0 && (
                  <span className="joy-map-cx-chip prediction" title={pending.map(p => `#${p.prediction_id} predicted ${p.predicted_lift} pts`).join(' · ')}>
                    prediction registered — receipt due {pending[0].fielding_id || 'next fielding'}
                  </span>
                )}
                {t.territory_magnitude != null && (
                  <span className="joy-map-cx-chip magnitude" title="territory_magnitude">
                    magnitude {t.territory_magnitude}
                  </span>
                )}
                {t.thin && (
                  <span className="joy-map-cx-chip thin" title={`pairs_behind = ${t.pairs_behind} (< 3)`}>
                    THIN
                  </span>
                )}
              </div>
              <div className={`joy-map-cx-state-line state-${state}`}>
                {ALIGNMENT_COPY[state] || `Alignment state '${state}' — no plain-language reading registered for this state yet.`}
              </div>
              {t.verdict === 'measured' && lead && (
                <div className="joy-map-cx-row-body">
                  {renderPairLine(lead, true)}
                  {t.runner_ups.length > 0 && (
                    <details className="joy-map-cx-runners">
                      <summary>{t.runner_ups.length} runner-up{t.runner_ups.length === 1 ? '' : 's'} behind the lead</summary>
                      {t.runner_ups.map((ru, i) => <div key={`ru-${i}`}>{renderPairLine(ru, false)}</div>)}
                    </details>
                  )}
                  {t.attitude_intent.length > 0 && (
                    <details className="joy-map-cx-runners">
                      <summary>{t.attitude_intent.length} attitude/intent split row{t.attitude_intent.length === 1 ? '' : 's'}</summary>
                      {t.attitude_intent.map((ai, i) => <div key={`ai-${i}`}>{renderPairLine(ai, false)}</div>)}
                    </details>
                  )}
                </div>
              )}
              {t.verdict === 'flat' && lead && (
                <div className="joy-map-cx-row-body">
                  <div className="joy-map-cx-row-flat-note">
                    Lead pair on {t.territory} shows no meaningful within-person co-movement. Content, not empty.
                  </div>
                  {renderPairLine(lead, true)}
                </div>
              )}
              {t.verdict === 'unmeasured' && (
                <div className="joy-map-cx-row-body">
                  <div className="joy-map-cx-row-flat-note">
                    No ledger pair covers {t.territory} for this focal set. Unmeasured — candidate for co-fielding on the {t.territory} anchor items.
                  </div>
                </div>
              )}
              {t.verdict && t.verdict !== 'measured' && t.verdict !== 'flat' && t.verdict !== 'unmeasured' && (
                <div className="joy-map-cx-row-body">
                  <div className="joy-map-cx-row-flat-note">
                    Verdict '{t.verdict}' for {t.territory}: no measured lead surfaced. Content, not empty.
                  </div>
                  {lead && renderPairLine(lead, true)}
                </div>
              )}
              {renderModeledDiamond(t)}
              {onSendToBulletin && (
                <div className="joy-map-cx-row-send">
                  <button
                    className="btn ghost joy-map-send-btn"
                    onClick={() => onSendToBulletin(territoryDraft(t, state))}
                    title="Pre-fill a candidate opportunity card from this row. You add the action, the window and any signals."
                  >
                    Send to Bulletin →
                  </button>
                </div>
              )}
              {/* Row expand — territory profile. Fires only when
                  territory_key is present (LEFT JOIN could leave it
                  null if bjl_territories lags the sweep function).
                  Cache is per (focal, territory) per session. */}
              {territoryKey && onOpenProfile && (
                <details
                  className="joy-map-cx-profile-details"
                  onToggle={(e) => { if (e.target.open) onOpenProfile(territoryKey); }}
                >
                  <summary>Territory profile — what's in {t.territory}</summary>
                  <JoyMapTerritoryProfile
                    profile={profile}
                    territoryKey={territoryKey}
                    territoryName={t.territory}
                    rosterEntry={rosterEntry}
                    onOpenRoster={onOpenRoster}
                    claimContext={claimContext}
                    onSendToBulletin={onSendToBulletin}
                  />
                </details>
              )}
            </li>
          );
        })}
      </ul>
      )}
    </div>
  );
};

// -------------------------------------------------------------------------
// JoyMapTerritoryProfile — three-group renderer for one territory's
// items, fetched via bjl-territory-profile. Groups by item_verdict:
//   measured  → sorted by measured_lift desc
//   inferred  → sorted by |modeled_lift_raw| desc
//   unmeasured (or other) → collapsed count with expandable list
// Roster tap sits at the bottom.
// -------------------------------------------------------------------------
const JoyMapTerritoryProfile = ({ profile, territoryKey, territoryName, rosterEntry, onOpenRoster, claimContext, onSendToBulletin }) => {
  if (!profile) return <div className="joy-map-cx-profile-body">Loading…</div>;
  if (profile.loading) return <div className="joy-map-cx-profile-body">Fetching territory profile…</div>;
  if (profile.error) return <div className="joy-map-cx-profile-body joy-map-error">Error: {profile.error}</div>;
  const items = Array.isArray(profile.items) ? profile.items : [];
  if (items.length === 0) {
    return (
      <div className="joy-map-cx-profile-body">
        <div className="joy-map-cx-row-flat-note">No items mapped for {territoryName}.</div>
        <RosterTap territoryKey={territoryKey} rosterEntry={rosterEntry} onOpenRoster={onOpenRoster} />
      </div>
    );
  }
  const measured  = items.filter(i => i.item_verdict === 'measured')
    .sort((a, b) => (b.measured_lift || 0) - (a.measured_lift || 0));
  const inferred  = items.filter(i => i.item_verdict === 'inferred')
    .sort((a, b) => Math.abs(b.modeled_lift_raw || 0) - Math.abs(a.modeled_lift_raw || 0));
  const otherRows = items.filter(i => i.item_verdict !== 'measured' && i.item_verdict !== 'inferred');
  const signedNum = (n) => n == null ? '—' : `${n > 0 ? '+' : ''}${n}`;

  // A profile finding is a claim about one item inside the territory.
  // Same bridge as the row-level one, narrower claim_items.
  const ctx = claimContext || {};
  const findingDraft = (i, measuredRow) => ({
    origin: `Profile finding — ${territoryName} / ${i.item_wording}`,
    engagement: ctx.engagement || '',
    title: `${territoryName} — ${i.item_wording}`,
    claim_summary: measuredRow
      ? `${i.item_wording}: measured lift ${signedNum(i.measured_lift)} points between the hot and cool halves of the focal cohort (n ${i.n_hot ?? '—'} hot / ${i.n_cool ?? '—'} cool).`
      : `${i.item_wording}: model estimate ${signedNum(i.modeled_lift_raw)} points for this cohort. Not measured — inferred from ${ctx.model_version || 'the live model'}.`,
    claim_population: ctx.population || '',
    evidence_tier: measuredRow ? 'measured' : 'modeled',
    claim_items: [...(ctx.focal_ids || []), i.item_id].filter(n => Number.isFinite(Number(n))),
  });

  const sendCell = (i, measuredRow) => onSendToBulletin ? (
    <td className="num">
      <button className="btn ghost joy-map-send-btn tiny"
        onClick={() => onSendToBulletin(findingDraft(i, measuredRow))}
        title="Pre-fill a candidate opportunity card from this finding.">
        → bulletin
      </button>
    </td>
  ) : null;

  return (
    <div className="joy-map-cx-profile-body">
      {measured.length > 0 && (
        <div className="joy-map-cx-profile-group">
          <div className="joy-map-cx-profile-group-title">Measured ({measured.length})</div>
          <table className="joy-map-cx-profile-table">
            <tbody>
              {measured.map(i => (
                <tr key={i.item_id}>
                  <td>{i.item_wording}</td>
                  <td className="num">n {i.n_hot ?? '—'}/{i.n_cool ?? '—'}</td>
                  <td className="num"><strong>{signedNum(i.measured_lift)}</strong></td>
                  <td className="num muted">model {signedNum(i.modeled_lift_raw)}</td>
                  {sendCell(i, true)}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {inferred.length > 0 && (
        <div className="joy-map-cx-profile-group">
          <div className="joy-map-cx-profile-group-title">Inferred ({inferred.length}) — model estimate, not yet measured for this cohort</div>
          <table className="joy-map-cx-profile-table">
            <tbody>
              {inferred.map(i => (
                <tr key={i.item_id}>
                  <td>{i.item_wording}</td>
                  <td className="num"><strong>{signedNum(i.modeled_lift_raw)}</strong></td>
                  {sendCell(i, false)}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {otherRows.length > 0 && (
        <details className="joy-map-cx-profile-group">
          <summary>Unmeasured ({otherRows.length}) — no estimate</summary>
          <table className="joy-map-cx-profile-table">
            <tbody>
              {otherRows.map(i => (
                <tr key={i.item_id}>
                  <td>{i.item_wording}</td>
                  <td className="num muted">{i.item_verdict || '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </details>
      )}
      <RosterTap territoryKey={territoryKey} rosterEntry={rosterEntry} onOpenRoster={onOpenRoster} />
    </div>
  );
};

// -------------------------------------------------------------------------
// RosterTap — provenance tap. Plain table via bjl_territory_roster.
// No filtering, no interpretation.
// -------------------------------------------------------------------------
const RosterTap = ({ territoryKey, rosterEntry, onOpenRoster }) => {
  return (
    <details className="joy-map-cx-roster-details" onToggle={(e) => {
      if (e.target.open && onOpenRoster) onOpenRoster(territoryKey);
    }}>
      <summary>What's in this territory (roster)</summary>
      {!rosterEntry && <div className="joy-map-cx-profile-body">Loading…</div>}
      {rosterEntry && rosterEntry.loading && <div className="joy-map-cx-profile-body">Fetching roster…</div>}
      {rosterEntry && rosterEntry.error && <div className="joy-map-cx-profile-body joy-map-error">Error: {rosterEntry.error}</div>}
      {rosterEntry && Array.isArray(rosterEntry.items) && rosterEntry.items.length === 0 && (
        <div className="joy-map-cx-profile-body">No items mapped for this territory.</div>
      )}
      {rosterEntry && Array.isArray(rosterEntry.items) && rosterEntry.items.length > 0 && (
        <table className="joy-map-cx-profile-table">
          <thead>
            <tr><th>wording</th><th>family</th><th>n</th><th>spread</th><th>in ledger</th><th>basis</th></tr>
          </thead>
          <tbody>
            {rosterEntry.items.map(r => (
              <tr key={r.item_id}>
                <td>{r.item_wording}</td>
                <td className="muted">{r.scale_family}</td>
                <td className="num">{r.n ?? '—'}</td>
                <td className="num">{r.spread ?? '—'}</td>
                <td className="muted">{r.in_ledger ? 'yes' : 'no'}</td>
                <td className="muted">{r.basis}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </details>
  );
};

// -------------------------------------------------------------------------
// BulletinCompose — step 4. The only bridge from the map to the
// Bulletin. Everything above the rule is carried from the row that
// produced it and is read-only-by-convention (editable, but it arrives
// filled). Everything below the rule is the analyst's: the action, the
// window, the signals it cites. A card lands at status='candidate'.
// -------------------------------------------------------------------------
const BulletinCompose = ({ draft, onClose, onCreated }) => {
  const [form, setForm] = useState(() => ({
    engagement:       draft.engagement || '',
    title:            draft.title || '',
    claim_summary:    draft.claim_summary || '',
    claim_population: draft.claim_population || '',
    evidence_tier:    draft.evidence_tier || 'measured',
    action_text:      '',
    window_label:     '',
    owner:            '',
    signal_ids_csv:   '',
    notes:            '',
  }));
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));

  const missing = ['engagement', 'title', 'claim_summary', 'claim_population', 'evidence_tier', 'action_text']
    .filter(k => !String(form[k] || '').trim());

  const submit = async () => {
    setSaving(true);
    setError(null);
    try {
      if (window.__bjlAuth && window.__bjlAuth.getSession) await window.__bjlAuth.getSession();
      const r = await fetch('/.netlify/functions/bjl-opportunities', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'create',
          engagement:       form.engagement.trim(),
          title:            form.title.trim(),
          claim_summary:    form.claim_summary.trim(),
          claim_population: form.claim_population.trim(),
          evidence_tier:    form.evidence_tier,
          action_text:      form.action_text.trim(),
          window_label:     form.window_label.trim(),
          owner:            form.owner.trim(),
          notes:            form.notes.trim(),
          claim_items:      draft.claim_items || [],
          signal_ids:       form.signal_ids_csv.split(/[,\s]+/).map(s => parseInt(s, 10)).filter(Number.isFinite),
        }),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error((j && j.error) || `request failed (${r.status})`);
      onCreated(j.opportunity);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="bjl-modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="bjl-modal compose">
        <div className="compose-head">
          <div className="compose-title">Send to Bulletin — new candidate</div>
          <button className="btn ghost" onClick={onClose}>Close</button>
        </div>
        <div className="compose-origin">Carried from: {draft.origin}</div>

        <div className="compose-section-label">The claim — carried from the map</div>
        <label className="compose-field">Engagement
          <input type="text" value={form.engagement} onChange={(e) => set('engagement', e.target.value)}
            placeholder="e.g. Herschend 2026 — Silver Dollar City" />
        </label>
        <label className="compose-field">Title
          <input type="text" value={form.title} onChange={(e) => set('title', e.target.value)} />
        </label>
        <label className="compose-field">Claim
          <textarea rows={3} value={form.claim_summary} onChange={(e) => set('claim_summary', e.target.value)} />
        </label>
        <label className="compose-field">Population — who was counted
          <textarea rows={2} value={form.claim_population} onChange={(e) => set('claim_population', e.target.value)} />
        </label>
        <label className="compose-field">Evidence tier
          <select value={form.evidence_tier} onChange={(e) => set('evidence_tier', e.target.value)}>
            {EVIDENCE_TIERS.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </label>
        {form.evidence_tier !== draft.evidence_tier && (
          <div className="compose-tier-warn">
            The row this came from is <strong>{draft.evidence_tier}</strong>. You have changed the tier to <strong>{form.evidence_tier}</strong> — the card will say so.
          </div>
        )}

        <div className="compose-rule" />
        <div className="compose-section-label">The recommendation — yours</div>
        <label className="compose-field">Action
          <textarea rows={2} value={form.action_text} onChange={(e) => set('action_text', e.target.value)}
            placeholder="What should the client do about it?" />
        </label>
        <label className="compose-field">Window
          <input type="text" value={form.window_label} onChange={(e) => set('window_label', e.target.value)}
            placeholder="e.g. before spring break on-sale" />
        </label>
        <label className="compose-field">Owner
          <input type="text" value={form.owner} onChange={(e) => set('owner', e.target.value)} />
        </label>
        <label className="compose-field">Marketplace signal ids (comma-separated, optional)
          <input type="text" value={form.signal_ids_csv} onChange={(e) => set('signal_ids_csv', e.target.value)}
            placeholder="leave empty for an evergreen claim" />
        </label>
        <label className="compose-field">Notes
          <textarea rows={2} value={form.notes} onChange={(e) => set('notes', e.target.value)} />
        </label>

        {error && <div className="joy-map-error" style={{marginTop: 10}}>Error: {error}</div>}
        <div className="compose-actions">
          <button className="btn primary" disabled={saving || missing.length > 0} onClick={submit}>
            {saving ? 'Saving…' : 'Create candidate'}
          </button>
          {missing.length > 0 && (
            <span className="compose-missing">Still needed: {missing.map(k => k === 'action_text' ? 'action' : k.replace(/_/g, ' ')).join(', ')}</span>
          )}
        </div>
      </div>
    </div>
  );
};

// -------------------------------------------------------------------------
// JoyMapPredictionsTable — staff-only read-only view of the prediction
// ledger. Verification writes happen through analysis sessions, not
// here. Unverified rows show "awaiting fielding."
// -------------------------------------------------------------------------
const JoyMapPredictionsTable = ({ state, onRefresh }) => {
  if (state.loading) return <div className="joy-map-loading">Fetching prediction ledger…</div>;
  if (state.error) return <div className="joy-map-error">Error: {state.error}<br/><button className="btn ghost" onClick={onRefresh}>Retry</button></div>;
  if (!state.rows) return <div><button className="btn primary" onClick={onRefresh}>Load ledger</button></div>;
  if (state.rows.length === 0) return <div className="joy-map-cx-profile-body">No predictions registered yet.</div>;
  return (
    <div className="joy-map-cx-profile-body">
      <table className="joy-map-cx-profile-table">
        <thead>
          <tr>
            <th>id</th><th>predicted_at</th><th>cohort</th><th>item</th><th>territory</th>
            <th>predicted lift</th><th>fielding</th><th>measured lift</th><th>verified</th><th>verdict</th>
          </tr>
        </thead>
        <tbody>
          {state.rows.map(p => (
            <tr key={p.prediction_id}>
              <td className="num">{p.prediction_id}</td>
              <td className="muted">{p.predicted_at || '—'}</td>
              <td>{p.cohort_definition || '—'}</td>
              <td>{p.item_wording || `#${p.item_id ?? '—'}`}</td>
              <td className="muted">{p.territory_key || '—'}</td>
              <td className="num"><strong>{p.predicted_lift != null ? (p.predicted_lift > 0 ? '+' : '') + p.predicted_lift : '—'}</strong></td>
              <td className="muted">{p.fielding_id || 'awaiting fielding'}</td>
              <td className="num">{p.measured_lift != null ? (p.measured_lift > 0 ? '+' : '') + p.measured_lift : '—'}</td>
              <td className="muted">{p.verified_at || '—'}</td>
              <td>{p.verdict || (p.verified_at ? 'verified' : 'pending')}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
};

// -------------------------------------------------------------------------
// OpportunityBulletin — layer 2. Findings become recommendations.
//
// Cards come from bjl_opportunities; the signal chips they cite come
// from bjl_marketplace_signals. Claims and signals are rendered in
// visibly different classes: a claim is measured evidence with a
// population and a tier, a signal is a marketplace observation with a
// capture date. The one write this surface gets is the status
// transition (plus a note). Everything else is authored in an analysis
// session.
// -------------------------------------------------------------------------
const BULLETIN_STATUSES = ['candidate', 'reviewed', 'selected', 'shipped', 'retired'];
const SIGNAL_STALE_DAYS = 45;

const OpportunityBulletin = ({ predictionState, onLoadPredictions }) => {
  const [state, setState] = useState({ loading: false, error: null, opportunities: null, engagements: [] });
  const [engagement, setEngagement] = useState('');
  const [statusFilter, setStatusFilter] = useState('');
  const [tierFilter, setTierFilter] = useState('');
  const [windowFilter, setWindowFilter] = useState('');
  const [saving, setSaving] = useState({});

  const load = async () => {
    setState(s => ({ ...s, loading: true, error: null }));
    try {
      if (window.__bjlAuth && window.__bjlAuth.getSession) await window.__bjlAuth.getSession();
      const r = await fetch('/.netlify/functions/bjl-opportunities', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'list' }),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error((j && j.error) || `request failed (${r.status})`);
      setState({
        loading: false,
        error: null,
        opportunities: Array.isArray(j.opportunities) ? j.opportunities : [],
        engagements: Array.isArray(j.engagements) ? j.engagements : [],
      });
    } catch (e) {
      setState(s => ({ ...s, loading: false, error: String(e.message || e) }));
    }
  };

  useEffect(() => { load(); if (onLoadPredictions) onLoadPredictions(); }, []);

  const setStatus = async (opportunityId, status) => {
    setSaving(prev => ({ ...prev, [opportunityId]: true }));
    try {
      if (window.__bjlAuth && window.__bjlAuth.getSession) await window.__bjlAuth.getSession();
      const r = await fetch('/.netlify/functions/bjl-opportunities', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'set_status', opportunity_id: opportunityId, status }),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error((j && j.error) || `request failed (${r.status})`);
      setState(s => ({
        ...s,
        opportunities: (s.opportunities || []).map(o =>
          o.opportunity_id === opportunityId ? { ...o, status, updated_at: (j.opportunity && j.opportunity.updated_at) || o.updated_at } : o
        ),
      }));
    } catch (e) {
      setState(s => ({ ...s, error: String(e.message || e) }));
    } finally {
      setSaving(prev => ({ ...prev, [opportunityId]: false }));
    }
  };

  const all = state.opportunities || [];
  const tiers = Array.from(new Set(all.map(o => o.evidence_tier).filter(Boolean))).sort();
  const windows = Array.from(new Set(all.map(o => o.window_label).filter(Boolean))).sort();

  const daysSince = (dateStr) => {
    if (!dateStr) return null;
    const then = new Date(dateStr);
    if (Number.isNaN(then.getTime())) return null;
    return Math.floor((Date.now() - then.getTime()) / 86400000);
  };

  const visible = all
    .filter(o => !engagement || o.engagement === engagement)
    .filter(o => !statusFilter || o.status === statusFilter)
    .filter(o => !tierFilter || o.evidence_tier === tierFilter)
    .filter(o => !windowFilter || o.window_label === windowFilter)
    .slice()
    .sort((a, b) => {
      const sa = BULLETIN_STATUSES.indexOf(a.status);
      const sb = BULLETIN_STATUSES.indexOf(b.status);
      if (sa !== sb) return (sa < 0 ? 99 : sa) - (sb < 0 ? 99 : sb);
      const wa = a.window_start || '9999-12-31';
      const wb = b.window_start || '9999-12-31';
      return wa < wb ? -1 : wa > wb ? 1 : 0;
    });

  // Grouped by engagement so a bulletin reads as one client's brief.
  const groups = [];
  for (const o of visible) {
    const key = o.engagement || '(unassigned)';
    let g = groups.find(x => x.key === key);
    if (!g) { g = { key, items: [] }; groups.push(g); }
    g.items.push(o);
  }

  return (
    <div className="joy-map-inputs">
      <div className="joy-map-input-group">
        <div className="joy-map-input-label">Opportunity Bulletin</div>
        <div style={{fontSize: 13, color: 'var(--iron-darker, #5a5a55)', maxWidth: '72ch', marginBottom: 12}}>
          The map says what is true. The bulletin says what to do about it. Each card carries a claim (with its evidence tier and the population it holds for), the marketplace signals that make it timely, the action, the window, and the owner. Claims are measured; signal chips are observations — they are deliberately styled apart. Status is the only thing you can change here.
        </div>
        <div className="bulletin-filters">
          <label>Engagement
            <select value={engagement} onChange={(e) => setEngagement(e.target.value)}>
              <option value="">All</option>
              {state.engagements.map(en => <option key={en} value={en}>{en}</option>)}
            </select>
          </label>
          <label>Status
            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
              <option value="">All</option>
              {BULLETIN_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </label>
          <label>Evidence tier
            <select value={tierFilter} onChange={(e) => setTierFilter(e.target.value)}>
              <option value="">All</option>
              {tiers.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </label>
          <label>Window
            <select value={windowFilter} onChange={(e) => setWindowFilter(e.target.value)}>
              <option value="">All</option>
              {windows.map(w => <option key={w} value={w}>{w}</option>)}
            </select>
          </label>
          <button className="btn ghost" onClick={load} disabled={state.loading}>Refresh</button>
        </div>
      </div>

      {state.loading && <div className="joy-map-loading">Loading the register…</div>}
      {state.error && <div className="joy-map-error">Error: {state.error}</div>}
      {!state.loading && state.opportunities && visible.length === 0 && (
        <div className="joy-map-cx-profile-body">
          No opportunities match these filters. The register is loaded in analysis sessions, not here.
        </div>
      )}

      {groups.map(g => (
        <div key={g.key} className="bulletin-group">
          <div className="bulletin-group-title">{g.key} · {g.items.length} card{g.items.length === 1 ? '' : 's'}</div>
          {g.items.map(o => {
            const age = daysSince(o.newest_signal_at);
            const stale = age != null && age > SIGNAL_STALE_DAYS;
            return (
              <div key={o.opportunity_id} className={`bulletin-card status-${o.status || 'unknown'}`}>
                <div className="bulletin-card-head">
                  {/* register_number is the lineage link to the analyst's
                      working register. Seed-loaded cards carry one; cards
                      made in the tool are born without one, and that is
                      correct — they are tool-native. Renders as a dash
                      rather than vanishing, so the absence reads as a
                      property of the card, not as a missing field. */}
                  <span className="bulletin-register">{o.register_number != null ? `#${o.register_number}` : '—'}</span>
                  <span className="bulletin-title">{o.title}</span>
                  <span className={`bulletin-status-badge status-${o.status || 'unknown'}`}>{o.status || 'unknown'}</span>
                </div>

                <div className="bulletin-claim">
                  <span className={`bulletin-tier tier-${(o.evidence_tier || 'unknown').replace(/\W+/g, '_')}`}>{o.evidence_tier || 'no tier'}</span>
                  <span className="bulletin-claim-summary">{o.claim_summary}</span>
                  <div className="bulletin-claim-population">Holds for: {o.claim_population}</div>
                </div>

                {o.signals.length > 0 ? (
                  <div className="bulletin-signals">
                    {o.signals.map(s => (
                      <span key={s.signal_id} className="bulletin-signal-chip" title={s.exact_quote || s.detail || ''}>
                        {s.headline}
                        <span className="bulletin-signal-date"> · {s.captured_at || 'undated'}</span>
                      </span>
                    ))}
                  </div>
                ) : (
                  <div className="bulletin-signals-empty">No marketplace signal cited — evergreen claim, standing on the measured evidence alone.</div>
                )}

                {stale && (
                  <div className="bulletin-stale">
