                    Newest signal is {age} days old (over {SIGNAL_STALE_DAYS}). Re-pull before acting on the timing.
                  </div>
                )}

                <div className="bulletin-action">{o.action}</div>
                <div className="bulletin-meta">
                  {o.window_label && <span>Window: <strong>{o.window_label}</strong></span>}
                  {o.owner && <span> · Owner: <strong>{o.owner}</strong></span>}
                  {o.prediction_id != null && <span> · prediction #{o.prediction_id}</span>}
                </div>
                {o.notes && <div className="bulletin-notes">{o.notes}</div>}

                <div className="bulletin-status-control">
                  {BULLETIN_STATUSES.map(s => (
                    <button
                      key={s}
                      className={`btn ${o.status === s ? 'primary' : 'ghost'}`}
                      disabled={!!saving[o.opportunity_id] || o.status === s}
                      onClick={() => setStatus(o.opportunity_id, s)}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      ))}

      <div className="joy-map-input-group" style={{marginTop: 20}}>
        <div className="joy-map-input-label">Registered predictions (staff, read-only)</div>
        <div style={{fontSize: 13, color: 'var(--iron-darker, #5a5a55)', maxWidth: '72ch', marginBottom: 12}}>
          Every modeled lift registered against a not-yet-fielded item. These also appear as chips on the territories they target. Verification writes happen through the analysis session, not here.
        </div>
        <JoyMapPredictionsTable state={predictionState} onRefresh={onLoadPredictions} />
      </div>
    </div>
  );
};

/* =========================================================================
 * 12c. PublicCorpusMode — review queue for Public Joy Lab Chat (v6).
 *      Staged insights (published=false) get reviewed, edited, and
 *      flipped live here. Captured visitor questions
 *      (bjl_public_questions) sit alongside as the lead-handling queue.
 * ========================================================================= */

/* -------------------------------------------------------------------------
 * ProjectsMode — the repurposed "Public Corpus" pane.
 * -------------------------------------------------------------------------
 * Two views:
 *  - List: every active project, with card count + notes + last activity.
 *          Buttons to create, rename, archive, drill in.
 *  - Detail: one project's saved cards. Rename / archive from here too.
 * ------------------------------------------------------------------------- */
const ProjectsMode = ({
  setMode,
  setStrategistContext,
  // Projects state hoisted to App on 2026-07-23.
  projects,
  activeProjectId,
  selectProject,
  refreshProjects,
  setProjects,
}) => {
  const [loading, setLoading] = useState(!projects || projects.length === 0);
  const [error, setError] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [cards, setCards] = useState([]);
  const [cardsLoading, setCardsLoading] = useState(false);
  const [showCreate, setShowCreate] = useState(false);
  const [renaming, setRenaming] = useState(null); // { id, name, notes }
  const [savingRename, setSavingRename] = useState(false);

  // Card selection for the seed-a-query flow. When one or more cards are
  // checked, a compose bar appears at the bottom of the drill-in view; the
  // strategist adds an optional follow-up prompt and starts a query in the
  // Intelligence pane with the selected cards packaged as strategist context.
  const [selectedCardIds, setSelectedCardIds] = useState(() => new Set());
  const [showSeedCompose, setShowSeedCompose] = useState(false);
  const [seedPrompt, setSeedPrompt] = useState('');

  const toggleCardSelected = (id) => setSelectedCardIds(prev => {
    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const clearSelection = () => setSelectedCardIds(new Set());

  // Format the selected cards into a strategist-context blob and hand off
  // to the Intelligence pane. The blob is verbose on purpose — the
  // synthesizer sees it as brand context to reason over, so the full
  // provenance (claim + frame + evidence + implication + source question)
  // helps the leap land.
  const formatCardsForContext = (proj, chosenCards) => {
    const lines = [];
    lines.push(`Saved insights from project "${proj.name}"${proj.notes ? ` (${proj.notes})` : ''}. These are prior findings the strategist has already validated. Use them as anchor context for the next question, not as new material to re-derive.`);
    lines.push('');
    chosenCards.forEach((card, i) => {
      lines.push(`Insight ${i + 1}: ${card.claim}`);
      if (card.frame) lines.push(`  Frame: ${card.frame}`);
      if (Array.isArray(card.evidence) && card.evidence.length > 0) {
        card.evidence.forEach(e => lines.push(`  - ${typeof e === 'string' ? e : JSON.stringify(e)}`));
      }
      if (card.implication) lines.push(`  Implication: ${card.implication}`);
      if (card.source_question) lines.push(`  Source question: ${card.source_question}`);
      lines.push('');
    });
    return lines.join('\n').trim();
  };

  const startSeededQuery = () => {
    const chosenCards = cards.filter(c => selectedCardIds.has(c.id));
    if (chosenCards.length === 0 || !seedPrompt.trim() || !selected) return;
    const contextBlob = formatCardsForContext(selected, chosenCards);
    // Hand-off: the follow-up prompt goes through localStorage so the
    // Intelligence pane's mount effect can pick it up and populate its
    // prompt input. Strategist context is set immediately via the setter
    // App threads through.
    try { localStorage.setItem('bjl_pending_seed_prompt_v1', seedPrompt.trim()); }
    catch (_) { /* soft-fail if storage unavailable; prompt just won't preload */ }
    if (setStrategistContext) setStrategistContext(contextBlob);
    if (setMode) setMode('intelligence');
  };

  const selected = (projects || []).find(p => p.id === selectedId) || null;

  // reloadProjects delegates to the App-level refresh so the Intelligence
  // pane's dropdown stays in sync with any create/rename/archive done here.
  const reloadProjects = async () => {
    setLoading(true); setError(null);
    try { await refreshProjects(); }
    catch (e) { setError(String(e.message || e)); }
    finally { setLoading(false); }
  };
  const reloadCards = async (id) => {
    if (!id) { setCards([]); return; }
    setCardsLoading(true);
    try { setCards(await fetchProjectCards(id)); }
    catch (e) { setError(String(e.message || e)); }
    finally { setCardsLoading(false); }
  };

  useEffect(() => {
    // Kick a background refresh on mount so the pane reflects any updates
    // made in another session; the drop-down still renders from the
    // App-supplied list without waiting.
    reloadProjects();
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  useEffect(() => {
    clearSelection();
    if (selectedId) reloadCards(selectedId);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedId]);

  const archive = async (id) => {
    if (!confirm('Archive this project? Its saved cards are preserved but the project is hidden from the active list.')) return;
    try {
      await archiveProjectApi(id);
      setSelectedId(prev => (prev === id ? null : prev));
      reloadProjects();
    } catch (e) { alert('Archive failed: ' + (e.message || e)); }
  };

  const submitRename = async () => {
    if (!renaming || !renaming.name.trim()) return;
    setSavingRename(true);
    try {
      await updateProjectApi(renaming.id, { name: renaming.name.trim(), notes: renaming.notes || null });
      setRenaming(null);
      reloadProjects();
    } catch (e) { alert('Rename failed: ' + (e.message || e)); }
    finally { setSavingRename(false); }
  };

  return (
    <div className="brief-scroll" style={{padding: 32, overflowY: "auto", height: "100%", minHeight: 0, boxSizing: "border-box"}}>
      <div style={{display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 22}}>
        <div>
          <div className="eyebrow" style={{marginBottom: 6}}>Workbench</div>
          <div className="display" style={{fontSize: 40, letterSpacing: "-0.01em"}}>Projects.</div>
          <div style={{marginTop: 8, color: "var(--grey-2)", maxWidth: "60ch", fontSize: 14}}>
            Per-engagement collections. Save insight cards from the Intelligence pane, review them here, and remove ones you've reconsidered.
          </div>
        </div>
        <button className="btn primary" onClick={() => setShowCreate(true)}>+ New project</button>
      </div>

      {error && <div className="public-promote-error" style={{marginBottom: 12}}>{error}</div>}
      {loading && <div style={{color: "var(--grey-2)"}}>Loading projects…</div>}

      {!loading && !selected && (
        <div>
          {projects.length === 0 ? (
            <div style={{color: "var(--grey-2)", fontStyle: "italic", padding: "24px 0"}}>No projects yet. Create one to start saving cards.</div>
          ) : (
            <div className="project-list-grid" style={{display: "grid", gap: 12, gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))"}}>
              {projects.map(p => (
                <div key={p.id} className="project-card" style={{
                  background: "var(--paper-2, #f4f3ed)",
                  border: "1px solid var(--iron, #e2e2dc)",
                  borderRadius: 6,
                  padding: 16,
                  cursor: "pointer",
                }} onClick={() => setSelectedId(p.id)}>
                  <div style={{display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6}}>
                    <div style={{fontFamily: "var(--font-display, Georgia, serif)", fontSize: 18, color: "var(--ink, #1a1a17)"}}>{p.name}</div>
                    <div style={{fontFamily: "var(--font-mono, monospace)", fontSize: 11, color: "var(--iron-darker, #5a5a55)"}}>{p.card_count || 0} card{p.card_count === 1 ? '' : 's'}</div>
                  </div>
                  {p.notes && <div style={{fontSize: 12.5, color: "var(--iron-darker, #5a5a55)", marginBottom: 8, lineHeight: 1.4}}>{p.notes}</div>}
                  <div style={{fontFamily: "var(--font-mono, monospace)", fontSize: 10, color: "var(--iron-darker, #5a5a55)", textTransform: "uppercase", letterSpacing: "0.06em"}}>
                    Updated {new Date(p.updated_at).toLocaleDateString()}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {!loading && selected && (
        <div>
          <div style={{display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12}}>
            <button className="btn ghost" onClick={() => { setSelectedId(null); setCards([]); }}>&larr; All projects</button>
            <div style={{display: "flex", gap: 8}}>
              <button className="btn ghost" onClick={() => setRenaming({ id: selected.id, name: selected.name, notes: selected.notes || '' })}>Rename / notes</button>
              <button className="btn ghost" onClick={() => archive(selected.id)}>Archive</button>
            </div>
          </div>
          <div style={{marginBottom: 20}}>
            <div style={{fontFamily: "var(--font-display, Georgia, serif)", fontSize: 30, color: "var(--ink, #1a1a17)"}}>{selected.name}</div>
            {selected.notes && <div style={{color: "var(--grey-2)", fontSize: 14, marginTop: 4}}>{selected.notes}</div>}
            <div style={{fontFamily: "var(--font-mono, monospace)", fontSize: 11, color: "var(--iron-darker, #5a5a55)", textTransform: "uppercase", letterSpacing: "0.06em", marginTop: 4}}>
              {cards.length} card{cards.length === 1 ? '' : 's'} saved
            </div>
          </div>

          {cardsLoading && <div style={{color: "var(--grey-2)"}}>Loading cards…</div>}
          {!cardsLoading && cards.length === 0 && (
            <div style={{color: "var(--grey-2)", fontStyle: "italic", padding: "16px 0"}}>Nothing saved yet. Save cards from the Intelligence pane and they'll land here.</div>
          )}
          <div className="blocks-container" style={{paddingBottom: selectedCardIds.size > 0 ? 100 : 0}}>
            {cards.map(card => {
              const isChecked = selectedCardIds.has(card.id);
              return (
                <div key={card.id} className={"block-view saved-card-selectable" + (isChecked ? " selected" : "")}>
                  <label className="saved-card-select">
                    <input type="checkbox"
                      checked={isChecked}
                      onChange={() => toggleCardSelected(card.id)} />
                    <span className="saved-card-select-hint">Include in next query</span>
                  </label>
                  <div className="block-claim">{card.claim}</div>
                  {card.frame && <div className="block-frame">{card.frame}</div>}
                  {Array.isArray(card.evidence) && card.evidence.length > 0 && (
                    <ul className="block-evidence">
                      {card.evidence.map((line, i) => (
                        <li key={i}>{typeof line === 'string' ? line : JSON.stringify(line)}</li>
                      ))}
                    </ul>
                  )}
                  {card.implication && <div className="block-implication">{card.implication}</div>}
                  <div className="block-actions" style={{justifyContent: "space-between"}}>
                    <span style={{fontFamily: "var(--font-mono, monospace)", fontSize: 10, color: "var(--iron-darker, #5a5a55)", textTransform: "uppercase", letterSpacing: "0.06em"}}>
                      Saved {new Date(card.saved_at).toLocaleDateString()}
                    </span>
                    <button className="btn ghost" onClick={async () => {
                      if (!confirm('Remove this card from the project? Soft-delete; nothing else is affected.')) return;
                      try { await deleteProjectCardApi(card.id); setCards(prev => prev.filter(c => c.id !== card.id)); setSelectedCardIds(prev => { const n = new Set(prev); n.delete(card.id); return n; }); }
                      catch (e) { alert('Remove failed: ' + (e.message || e)); }
                    }}>Remove</button>
                  </div>
                </div>
              );
            })}
          </div>

          {selectedCardIds.size > 0 && (
            <div className="seed-query-bar">
              <div className="seed-query-count">
                {selectedCardIds.size} card{selectedCardIds.size === 1 ? '' : 's'} selected
              </div>
              <button className="btn ghost seed-query-clear" onClick={clearSelection}>Clear</button>
              <button className="btn primary seed-query-start" onClick={() => setShowSeedCompose(true)}>
                Start a query with these
              </button>
            </div>
          )}
        </div>
      )}

      {showSeedCompose && (
        <div className="public-promote-overlay" onClick={() => setShowSeedCompose(false)}>
          <div className="public-promote-modal" onClick={(e) => e.stopPropagation()}>
            <h3>Start a query with {selectedCardIds.size} saved card{selectedCardIds.size === 1 ? '' : 's'}</h3>
            <p className="public-promote-help">
              The selected cards will be packaged as strategist context (visible to you in the Intelligence pane, editable before you send) so the Lab treats them as prior findings. Type the next question below.
            </p>
            <label>Next question
              <textarea rows={4} value={seedPrompt}
                onChange={(e) => setSeedPrompt(e.target.value)}
                placeholder="e.g. Given the insights above, what would you recommend for the Q4 push?"
                autoFocus />
            </label>
            <div className="public-promote-actions">
              <button className="btn ghost" onClick={() => setShowSeedCompose(false)}>Cancel</button>
              <button className="btn primary" onClick={startSeededQuery}
                disabled={!seedPrompt.trim()}>
                Take me to Intelligence
              </button>
            </div>
          </div>
        </div>
      )}

      <CreateProjectModal
        isOpen={showCreate}
        onClose={() => setShowCreate(false)}
        onCreated={(p) => {
          setShowCreate(false);
          setProjects(prev => [p, ...prev.filter(x => x.id !== p.id)]);
          setSelectedId(p.id);
        }}
      />

      {renaming && (
        <div className="public-promote-overlay" onClick={() => !savingRename && setRenaming(null)}>
          <div className="public-promote-modal" onClick={(e) => e.stopPropagation()}>
            <h3>Edit project</h3>
            <label>Name
              <input type="text" value={renaming.name} onChange={(e) => setRenaming({ ...renaming, name: e.target.value })} />
            </label>
            <label>Notes
              <textarea rows={3} value={renaming.notes || ''} onChange={(e) => setRenaming({ ...renaming, notes: e.target.value })} />
            </label>
            <div className="public-promote-actions">
              <button className="btn ghost" onClick={() => setRenaming(null)} disabled={savingRename}>Cancel</button>
              <button className="btn primary" onClick={submitRename} disabled={savingRename || !renaming.name.trim()}>
                {savingRename ? 'Saving…' : 'Save'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const PublicCorpusMode = () => {
  const [tab, setTab] = useState('insights');  // 'insights' | 'questions' | 'analytics'
  const [insights, setInsights] = useState([]);
  const [questions, setQuestions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [busyId, setBusyId] = useState(null);

  const reload = async () => {
    setLoading(true); setError(null);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus?action=list_all', authedFetchInit());
      if (!r.ok) throw new Error(`load failed (${r.status})`);
      const j = await r.json();
      setInsights(j.insights || []);
      setQuestions(j.questions || []);
    } catch (err) { setError(String(err.message || err)); }
    finally { setLoading(false); }
  };
  useEffect(() => { reload(); }, []);

  const stagedCount = insights.filter(i => !i.published).length;
  const liveCount   = insights.filter(i =>  i.published).length;
  const newCount    = questions.filter(q => q.status === 'new').length;

  const patchInsight = async (id, patch) => {
    setBusyId(id);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update_insight', id, ...patch }),
      }));
      // v7.3 — surface the actual reason a publish/update fails. The DB has
      // BEFORE-UPDATE triggers that reject rows naming gated entities, plus
      // backend validators that reject malformed patches. Both return 400
      // with a structured { error } body; the old `update failed (${r.status})`
      // wrapper threw that detail away, leaving Eli with no diagnostic.
      if (!r.ok) {
        const reason = await r.json().catch(() => null);
        const detail = reason && reason.error ? `: ${reason.error}` : '';
        throw new Error(`update failed (${r.status})${detail}`);
      }
      const j = await r.json();
      setInsights(prev => prev.map(i => i.id === id ? j.insight : i));
      setEditingId(null);
    } catch (err) { setError(String(err.message || err)); }
    finally { setBusyId(null); }
  };

  const deleteInsight = async (id) => {
    if (!window.confirm('Delete this insight permanently? This cannot be undone.')) return;
    setBusyId(id);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete_insight', id }),
      }));
      if (!r.ok) throw new Error(`delete failed (${r.status})`);
      setInsights(prev => prev.filter(i => i.id !== id));
    } catch (err) { setError(String(err.message || err)); }
    finally { setBusyId(null); }
  };

  const setQuestionStatus = async (id, status) => {
    setBusyId(id);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update_question', id, status }),
      }));
      if (!r.ok) throw new Error(`update failed (${r.status})`);
      const j = await r.json();
      setQuestions(prev => prev.map(q => q.id === id ? j.question : q));
    } catch (err) { setError(String(err.message || err)); }
    finally { setBusyId(null); }
  };

  return (
    <div className="public-corpus-mode">
      <div className="public-corpus-tabs">
        <button className={`btn ${tab === 'insights' ? 'primary' : 'ghost'}`} onClick={() => setTab('insights')}>
          Insights · {stagedCount} staged / {liveCount} live
        </button>
        <button className={`btn ${tab === 'questions' ? 'primary' : 'ghost'}`} onClick={() => setTab('questions')}>
          Captured questions · {newCount} new
        </button>
        <button className={`btn ${tab === 'analytics' ? 'primary' : 'ghost'}`} onClick={() => setTab('analytics')}>
          Analytics
        </button>
        <button className="btn ghost" onClick={reload} disabled={loading}>{loading ? 'Loading…' : 'Refresh'}</button>
        {tab === 'insights' && (
          <PromoteToPublicButton defaults={{
            title: '', insight: '', stat: '', category: '',
            topic_tags: [], question_framings: [],
            confidence: 'high', created_from: 'manual_stage',
          }} />
        )}
        <PublicCorpusOpsButtons />
      </div>

      {error && <div className="joy-map-error">Error: {error}</div>}

      {tab === 'insights' && (
        <div className="public-corpus-insights">
          {insights.length === 0 && !loading && (
            <div className="public-corpus-empty">
              No insights yet. Stage one from a finding via the "Publish to public" button on a Joy Map or Intelligence result.
            </div>
          )}
          {insights.map(ins => (
            <PublicInsightCard
              key={ins.id}
              insight={ins}
              editing={editingId === ins.id}
              busy={busyId === ins.id}
              onEdit={() => setEditingId(ins.id)}
              onCancelEdit={() => setEditingId(null)}
              onSave={(patch) => patchInsight(ins.id, patch)}
              onTogglePublish={() => patchInsight(ins.id, { published: !ins.published })}
              onDelete={() => deleteInsight(ins.id)}
            />
          ))}
        </div>
      )}

      {tab === 'questions' && (
        <div className="public-corpus-questions">
          {questions.length === 0 && !loading && (
            <div className="public-corpus-empty">No captured questions yet.</div>
          )}
          {questions.map(q => (
            <div key={q.id} className={`public-question-card status-${q.status}`}>
              <div className="public-question-head">
                <span className={`public-question-status status-${q.status}`}>{q.status}</span>
                <span className="public-question-when">{new Date(q.created_at).toLocaleString()}</span>
                {q.category_guess && <span className="public-question-category">{q.category_guess}</span>}
              </div>
              <div className="public-question-body">"{q.question}"</div>
              {q.email && <div className="public-question-email">↳ {q.email}</div>}
              {Array.isArray(q.matched_insight_slugs) && q.matched_insight_slugs.length > 0 && (
                <div className="public-question-closest">
                  Closest offered: {q.matched_insight_slugs.join(', ')}
                </div>
              )}
              <div className="public-question-actions">
                {q.status !== 'reviewing' && <button className="btn ghost" disabled={busyId === q.id} onClick={() => setQuestionStatus(q.id, 'reviewing')}>Mark reviewing</button>}
                {q.status !== 'answered'  && <button className="btn ghost" disabled={busyId === q.id} onClick={() => setQuestionStatus(q.id, 'answered')}>Mark answered</button>}
                {q.status !== 'closed'    && <button className="btn ghost" disabled={busyId === q.id} onClick={() => setQuestionStatus(q.id, 'closed')}>Close</button>}
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === 'analytics' && <PublicCorpusAnalytics />}
    </div>
  );
};

// AnalyticsMode — dedicated workbench pane for the public chat analytics
// (formerly a tab inside the retired PublicCorpusMode). Wraps
// PublicCorpusAnalytics in the same pane shell the other modes use so
// scroll, header, and layout work consistently.
// ConnectionsBetaMode — the beta pane for the within-person connectivity
// ledger (bjl_connectivity_ledger). Strategist types a query; endpoint
// resolves focal items, pulls edges, groups inside/beyond the focal
// category, and translates each edge into a client-safe card via
// bjl_pair_plain. Correlation coefficients (r) never render — every
// connection speaks in shared answerers, pct moving together, and
// Joy Index point lift.
const ConnectionsBetaMode = () => {
  const [query, setQuery] = useState('');
  const [jobIdInput, setJobIdInput] = useState('');
  const [running, setRunning] = useState(false);
  const [error, setError] = useState(null);
  const [payload, setPayload] = useState(null);

  const run = async () => {
    const q = query.trim();
    if (!q) return;
    setRunning(true); setError(null); setPayload(null);

    // Session-token plumbing:
    //  1. Force a session refresh before invoke so the token attached
    //     by authedFetchInit is the freshest one available.
    //  2. On a structured 401 (auth_failed: true), refresh once more
    //     and retry exactly once. Two-strike then give up — the
    //     backend already logged the auth failure to
    //     bjl_front_door_log for both attempts.
    const invoke = async () => fetch('/.netlify/functions/bjl-connections-beta', authedFetchInit({
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: q,
        job_id: jobIdInput.trim() || null,
        max_focal_items: 5,
      }),
    }));

    try {
      if (window.__bjlAuth && window.__bjlAuth.getSession) {
        await window.__bjlAuth.getSession();
      }
      let r = await invoke();
      let j = await r.json();
      if (r.status === 401 && j && j.auth_failed) {
        // One auto-retry with a freshly refreshed session.
        if (window.__bjlAuth && window.__bjlAuth.getSession) {
          await window.__bjlAuth.getSession();
        }
        r = await invoke();
        j = await r.json();
      }
      if (!r.ok) {
        const detail = (j && (j.auth_failed
          ? 'Session token was rejected after a fresh refresh. Sign out and sign back in to reset the session.'
          : j.error)) || `request failed (${r.status})`;
        throw new Error(detail);
      }
      setPayload(j);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setRunning(false);
    }
  };

  const renderCard = (card, key) => {
    // Skew suppression: when either side of the pair has a heavily
    // one-sided distribution, pct_move_together loses meaning. Lead
    // with lift_points and shared_answerers; hide the pct with a
    // caveat so the strategist sees why it's missing.
    const pctSuppressed = !!card.pct_move_together_suppressed;
    return (
      <div key={key} className="conn-card">
        <div className="conn-card-pair">
          <span className="conn-card-focal">{card.focal_item_name}</span>
          <span className="conn-card-direction">
            {card.direction === 'rises with' ? ' ↔ ' : ' ⇄ '}
          </span>
          <span className="conn-card-other">{card.other_item_name || `(item ${card.other_item_id})`}</span>
        </div>
        <div className={"conn-card-direction-line" + (card.direction === 'runs against' ? ' negative' : '')}>
          <strong>{card.direction === 'rises with' ? 'Rises together' : 'Runs against'}</strong>
          {card.other_primary_topic && card.other_primary_topic !== card.focal_primary_topic
            ? <span className="conn-card-topic-badge"> · {card.other_primary_topic.replace(/_/g, ' ')}</span>
            : null}
        </div>
        <div className="conn-card-body">
          {card.lift_points != null && (
            <>People running hot on the first rate the second <strong>{card.lift_points > 0 ? '+' : ''}{card.lift_points.toFixed(1)} points</strong> against their own baseline. </>
          )}
          {card.shared_answerers != null && (
            <>Based on <strong>{card.shared_answerers.toLocaleString()}</strong> people who rated both. </>
          )}
          {!pctSuppressed && card.pct_move_together != null && (
            <><strong>{card.pct_move_together}%</strong> sit on the same side of their own baseline for both.</>
          )}
        </div>
        {pctSuppressed && (
          <div className="conn-card-caveat">
            Percent moving together is suppressed on this pair: one side has a heavily one-sided distribution (over 75% or under 25% on one side of zero), which makes the metric unreliable. Lift and shared answerers stand as reported.
          </div>
        )}
      </div>
    );
  };

  const inside          = Array.isArray(payload?.inside_category) ? payload.inside_category : [];
  const beyond          = Array.isArray(payload?.beyond_category) ? payload.beyond_category : [];
  const negRimInside    = Array.isArray(payload?.negative_rim_inside) ? payload.negative_rim_inside : [];
  const negRimBeyond    = Array.isArray(payload?.negative_rim_beyond) ? payload.negative_rim_beyond : [];
  const unmeasured      = Array.isArray(payload?.unmeasured) ? payload.unmeasured : [];
  const caveats         = Array.isArray(payload?.caveats) ? payload.caveats : [];
  const focalItems      = Array.isArray(payload?.focal_items) ? payload.focal_items : [];

  return (
    <div className="brief-scroll" style={{padding: 32, overflowY: "auto", height: "100%", minHeight: 0, boxSizing: "border-box"}}>
      <div style={{marginBottom: 22}}>
        <div className="eyebrow" style={{marginBottom: 6}}>Workbench · beta</div>
        <div className="display" style={{fontSize: 40, letterSpacing: "-0.01em"}}>Connections.</div>
        <div style={{marginTop: 8, color: "var(--grey-2)", maxWidth: "62ch", fontSize: 14}}>
          Within-person joy connectivity. Shows which experiences move together in the same people (rises with) or against each other (runs against), inside the focal category and beyond it. Numbers are shared answerers, share moving together, and Joy Index point lift — never correlation coefficients.
        </div>
      </div>

      <div className="conn-compose">
        <label className="conn-compose-label">Query
          <textarea rows={3} value={query} onChange={(e) => setQuery(e.target.value)}
            placeholder="e.g. What connects to going to a theme park?"
            disabled={running} />
        </label>
        <label className="conn-compose-label">Job ID <span className="conn-compose-optional">(optional — pastes an Intelligence job id so the connections read is logged alongside)</span>
          <input type="text" value={jobIdInput}
            onChange={(e) => setJobIdInput(e.target.value)}
            placeholder="uuid from bjl_query_jobs"
            disabled={running} />
        </label>
        <div className="conn-compose-actions">
          <button className="btn primary" onClick={run} disabled={running || !query.trim()}>
            {running ? 'Running…' : 'Run connections'}
          </button>
        </div>
      </div>

      {error && (
        <div className="conn-error">Error: {error}</div>
      )}

      {payload && payload.feature_enabled === false && (
        <div className="conn-blocked">
          Connections (beta) isn't enabled on this account. Ask Eli to add your email to the allowlist.
        </div>
      )}

      {/* Clarification renderer — distinct top-of-pane card when the
          front door escalated to needs_clarification or out_of_scope.
          Was previously stuffed into the unmeasured block, which
          looked like a technical footnote and produced the three-
          retry burst on log ids 4-7. */}
      {payload && payload.feature_enabled !== false && payload.brief && payload.brief.shape === 'needs_clarification' && (
        <div className="conn-clarify">
          <div className="conn-clarify-eyebrow">Clarification needed</div>
          <div className="conn-clarify-question">
            {payload.brief.clarifying_question || 'Could you rephrase — I need a specific experience, brand, or category to run this against.'}
          </div>
          {payload.brief.shape_reasoning && (
            <div className="conn-clarify-reason">Front door: {payload.brief.shape_reasoning}</div>
          )}
        </div>
      )}
      {payload && payload.feature_enabled !== false && payload.brief && payload.brief.shape === 'out_of_scope' && (
        <div className="conn-clarify">
          <div className="conn-clarify-eyebrow">Out of scope for the ledger</div>
          <div className="conn-clarify-question">
            That's outside what this pane can answer. The Connections ledger surfaces experiences, brands, and categories that move together in the same people — try a question of that shape.
          </div>
          {payload.brief.shape_reasoning && (
            <div className="conn-clarify-reason">Front door: {payload.brief.shape_reasoning}</div>
          )}
        </div>
      )}

      {/* Capability_error — distinct from unmeasured. The coverage
          check itself could not run, so the pane refuses to present
          the ledger read as authoritative. */}
      {payload && payload.feature_enabled !== false && payload.capability_error && (
        <div className="conn-clarify">
          <div className="conn-clarify-eyebrow">Capability check failed</div>
          <div className="conn-clarify-question">
            Coverage could not be verified before rendering, so the pane is holding the ledger read back. Try again in a moment — this is not "no coverage exists," it's "we don't know yet."
          </div>
          <div className="conn-clarify-reason">{payload.capability_error}</div>
        </div>
      )}

      {payload && payload.feature_enabled !== false && !payload.capability_error && payload.brief && payload.brief.shape !== 'needs_clarification' && payload.brief.shape !== 'out_of_scope' && (
        <>
          {/* Focal-items section — hidden when the anchor fallback
              fired, because "Measured anchors for this concept" below
              carries the same list with the explicit substitution
              framing. */}
          {!payload.used_anchor_fallback && (
            <div className="conn-section">
              <div className="conn-section-title">Focal items resolved</div>
              {payload.resolver_path && (
                <div className="conn-focal-source-note">
                  Resolved via the front door
                  {payload.brief && payload.brief.shape ? ` · shape: ${payload.brief.shape.replace(/_/g, ' ')}` : ''}
                  {payload.resolver_note ? `. ${payload.resolver_note}` : '.'}
                </div>
              )}
              {focalItems.length === 0 ? (
                <div className="conn-empty">No items in bjl_items matched the query keywords. Try naming a specific brand, category, or experience.</div>
              ) : (
                <ul className="conn-focal-list">
                  {focalItems.map(f => (
                    <li key={f.item_id}>
                      <span className="conn-focal-name">{f.item_name}</span>
                      <span className="conn-focal-meta">
                        {f.primary_topic ? ` · ${f.primary_topic.replace(/_/g, ' ')}` : ''}
                        {f.canonical_brand ? ` · brand: ${f.canonical_brand}` : ''}
                        <span className="conn-focal-source"> · matched by {f.match_source}</span>
                      </span>
                    </li>
                  ))}
                </ul>
              )}
            </div>
          )}

          {/* Unmeasured — original resolved items when the anchor
              fallback ran. Kept ABOVE the anchors so the strategist
              sees the co-fielding candidacy first. Standing rule:
              unmeasured is a rendered verdict. */}
          {payload.used_anchor_fallback && payload.anchor_fallback && Array.isArray(payload.anchor_fallback.resolved_items_unmeasured) && payload.anchor_fallback.resolved_items_unmeasured.length > 0 && (
            <div className="conn-section">
              <div className="conn-section-title">Original ask — unmeasured (co-fielding candidates)</div>
              <div className="conn-focal-source-note">
                The items you asked about sit outside the connectivity ledger (under the 50-respondent floor). They stay flagged here so the co-fielding candidacy is visible.
              </div>
              <ul className="conn-focal-list">
                {payload.anchor_fallback.resolved_items_unmeasured.map(item => (
                  <li key={item.item_id}>
                    <span className="conn-focal-name">{item.item_name}</span>
                    <span className="conn-focal-meta">
                      {` · ${item.respondents} respondents`}
                      {item.verbatim_depth != null ? ` · ${item.verbatim_depth} verbatims` : ''}
                    </span>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {/* Measured anchors — substituted focals the ledger actually
              ran on. Explicit label so the substitution is honest. */}
          {payload.used_anchor_fallback && payload.anchor_fallback && Array.isArray(payload.anchor_fallback.anchors) && payload.anchor_fallback.anchors.length > 0 && (
            <div className="conn-section">
              <div className="conn-section-title">Measured anchors for this concept</div>
              <div className="conn-focal-source-note">
                {payload.anchor_fallback.reason || 'Substituting the nearest in-ledger items so the read can run.'} The rows below run against these anchors, not the original ask.
              </div>
              <ul className="conn-focal-list">
                {payload.anchor_fallback.anchors.map(a => (
                  <li key={a.item_id}>
                    <span className="conn-focal-name">{a.item_name}</span>
                    <span className="conn-focal-meta">
                      {a.primary_topic ? ` · ${a.primary_topic.replace(/_/g, ' ')}` : ''}
                      {a.name_similarity != null ? ` · name sim ${a.name_similarity}` : ''}
                      {a.topic_match ? ' · topic match' : ''}
                      {a.degree != null ? ` · ${a.degree} edges` : ''}
                    </span>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {/* Voices offer — surface verbatim_depth >= 30 as an offered
              qualitative read even when the ledger is silent. This is
              how you honor a co-fielding candidate while quant catches
              up. */}
          {payload.voices_offer && payload.voices_offer.available && Array.isArray(payload.voices_offer.items) && payload.voices_offer.items.length > 0 && (
            <div className="conn-section">
              <div className="conn-section-title">Voices available</div>
              <div className="conn-focal-source-note">
                {payload.voices_offer.detail || 'Verbatim depth is above the offer floor on the resolved items; a voices read is available.'}
              </div>
              <ul className="conn-focal-list">
                {payload.voices_offer.items.map(v => (
                  <li key={v.item_id}>
                    <span className="conn-focal-name">{v.item_name}</span>
                    <span className="conn-focal-meta">
                      {` · ${v.verbatim_depth} verbatims`}
                    </span>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {payload.brief && payload.brief.capability && payload.brief.capability.verdict && (
            <div className="conn-section">
              <div className="conn-section-title">Coverage verdict</div>
              <div className="conn-focal-source-note">
                <strong>{payload.brief.capability.verdict}</strong>
                {payload.brief.capability.unmeasured_detail ? ` — ${payload.brief.capability.unmeasured_detail}` : ''}
              </div>
              {Object.keys(payload.brief.capability.ledger_degree || {}).length > 0 && (
                <ul className="conn-focal-list">
                  {focalItems.map(f => {
                    const deg = payload.brief.capability.ledger_degree[String(f.item_id)];
                    const dep = (payload.brief.capability.verbatim_depth || {})[String(f.item_id)];
                    return (
                      <li key={f.item_id}>
                        <span className="conn-focal-name">{f.item_name}</span>
                        <span className="conn-focal-meta">
                          {deg != null ? ` · ${deg} ledger edges` : ''}
                          {dep != null ? ` · ${dep} verbatims` : ''}
                        </span>
                      </li>
                    );
                  })}
                </ul>
              )}
            </div>
          )}

          {caveats.length > 0 && (
            <div className="conn-section">
              <div className="conn-section-title">Caveats</div>
              <ul className="conn-caveats">
                {caveats.map((c, i) => (
                  <li key={i}>
                    <strong>{c.focal_item_name}</strong>: {c.detail}
                  </li>
                ))}
              </ul>
            </div>
          )}

          {unmeasured.length > 0 && (() => {
            const itemLevel = unmeasured.filter(u => u.reason === 'item_below_ledger_floor');
            const pairLevel = unmeasured.filter(u => u.reason === 'pair_below_shared_floor');
            const other     = unmeasured.filter(u => u.reason !== 'item_below_ledger_floor' && u.reason !== 'pair_below_shared_floor');
            return (
              <div className="conn-section">
                <div className="conn-section-title">Unmeasured</div>
                {itemLevel.length > 0 && (
                  <>
                    <div className="conn-section-sub">Items under the 50-respondent floor (never entered the ledger)</div>
                    <ul className="conn-caveats">
                      {itemLevel.map((u, i) => (
                        <li key={`i-${i}`}>
                          {u.focal_item_name ? <><strong>{u.focal_item_name}</strong>: </> : null}
                          {u.detail}
                        </li>
                      ))}
                    </ul>
                  </>
                )}
                {pairLevel.length > 0 && (
                  <>
                    <div className="conn-section-sub">Pairs under the 30-shared-answerer floor (exist in the ledger but can't be trusted per-pair)</div>
                    <ul className="conn-caveats">
                      {pairLevel.map((u, i) => (
                        <li key={`p-${i}`}>{u.detail}</li>
                      ))}
                    </ul>
                  </>
                )}
                {other.length > 0 && (
                  <ul className="conn-caveats">
                    {other.map((u, i) => (
                      <li key={`o-${i}`}>
                        {u.focal_item_name ? <><strong>{u.focal_item_name}</strong>: </> : null}
                        {u.detail}
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            );
          })()}

          {(inside.length > 0 || negRimInside.length > 0) && (
            <div className="conn-section">
              <div className="conn-section-title">Inside the category</div>
              <div className="conn-section-sub">The emotional architecture of the focal experience — which things move together inside the same people.</div>
              <div className="conn-cards">
                {inside.map((c, i) => renderCard(c, `in-pos-${i}`))}
              </div>
              {negRimInside.length > 0 && (
                <>
                  <div className="conn-section-sub conn-section-neg">Joys that run against it</div>
                  <div className="conn-cards">
                    {negRimInside.map((c, i) => renderCard(c, `in-neg-${i}`))}
                  </div>
                </>
              )}
            </div>
          )}

          {(beyond.length > 0 || negRimBeyond.length > 0) && (
            <div className="conn-section">
              <div className="conn-section-title">Beyond the category</div>
              <div className="conn-section-sub">Cross-category connections — experiences in other topics that move with (or against) the focal set in the same people.</div>
              <div className="conn-cards">
                {beyond.map((c, i) => renderCard(c, `by-pos-${i}`))}
              </div>
              {negRimBeyond.length > 0 && (
                <>
                  <div className="conn-section-sub conn-section-neg">Joys that run against it</div>
                  <div className="conn-cards">
                    {negRimBeyond.map((c, i) => renderCard(c, `by-neg-${i}`))}
                  </div>
                </>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
};

const AnalyticsMode = () => {
  return (
    <div className="brief-scroll" style={{padding: 32, overflowY: "auto", height: "100%", minHeight: 0, boxSizing: "border-box"}}>
      <div style={{marginBottom: 22}}>
        <div className="eyebrow" style={{marginBottom: 6}}>Workbench</div>
        <div className="display" style={{fontSize: 40, letterSpacing: "-0.01em"}}>Analytics.</div>
        <div style={{marginTop: 8, color: "var(--grey-2)", maxWidth: "60ch", fontSize: 14}}>
          Public chat usage — visitors, questions asked, leads captured, conversion. Lifetime plus rolling 7- and 30-day windows, with a daily table beneath and a CSV export.

// v8.6 — Public chat analytics tab. Reads the
// bjl_public_chat_analytics_summary + bjl_public_chat_analytics_daily
// views via bjl-public-corpus?action=analytics. Lifetime + 7d + 30d
// rollup tiles on top; daily table below; manual refresh + CSV export.
const PublicCorpusAnalytics = () => {
  const [data, setData] = useState({ summary: {}, daily: [] });
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lastLoad, setLastLoad] = useState(null);

  const reload = async () => {
    setLoading(true); setError(null);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-corpus?action=analytics', authedFetchInit());
      if (!r.ok) throw new Error(`load failed (${r.status})`);
      const j = await r.json();
      setData({ summary: j.summary || {}, daily: j.daily || [] });
      setLastLoad(new Date());
    } catch (err) { setError(String(err.message || err)); }
    finally { setLoading(false); }
  };
  useEffect(() => { reload(); }, []);

  const fmt = v => (v == null ? '—' : Number(v).toLocaleString());
  const pct = v => (v == null ? '—' : `${Number(v).toFixed(1)}%`);

  const downloadCsv = () => {
    if (!data.daily || data.daily.length === 0) return;
    const header = ['day','unique_visitors','total_queries','converted_visitors','leads_submitted','leads_declined','conversion_rate_pct'];
    const rows = data.daily.map(d => header.map(k => {
      const v = d[k];
      if (v == null) return '';
      const s = String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(','));
    const csv = [header.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `bjl-public-chat-analytics-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  if (error) return <div className="joy-map-error">Error: {error}</div>;
  if (loading && !lastLoad) return <div className="public-corpus-empty">Loading analytics…</div>;

  const s = data.summary || {};

  return (
    <div className="public-corpus-analytics">
      <div className="analytics-toolbar">
        <span className="analytics-updated">
          {lastLoad ? `Updated ${lastLoad.toLocaleTimeString()}` : ''}
        </span>
        <button className="btn ghost" disabled={loading} onClick={reload}>{loading ? 'Refreshing…' : 'Refresh'}</button>
        <button className="btn ghost" disabled={!data.daily || data.daily.length === 0} onClick={downloadCsv}>Export CSV</button>
      </div>

      <div className="analytics-tile-grid">
        <AnalyticsTile label="Unique visitors" rows={[
          { k: 'Lifetime', v: fmt(s.lifetime_visitors) },
          { k: 'Last 30 days', v: fmt(s.visitors_30d) },
          { k: 'Last 7 days',  v: fmt(s.visitors_7d) },
        ]} />
        <AnalyticsTile label="Questions asked" rows={[
          { k: 'Lifetime', v: fmt(s.lifetime_queries) },
          { k: 'Last 30 days', v: fmt(s.queries_30d) },
          { k: 'Last 7 days',  v: fmt(s.queries_7d) },
        ]} />
        <AnalyticsTile label="Leads submitted" rows={[
          { k: 'Lifetime', v: fmt(s.lifetime_leads_submitted) },
          { k: 'Last 30 days', v: fmt(s.leads_submitted_30d) },
          { k: 'Last 7 days',  v: fmt(s.leads_submitted_7d) },
        ]} />
        <AnalyticsTile label="Conversion rate" rows={[

// v6.3 — Operator buttons in the Public Corpus pane for the two routine
// maintenance ops:
//   - Populate embeddings: fills NULL embeddings on insights + verbatim
//     truths, and (one-time, force_all mode) regenerates bjl_laws
//     embeddings so all four layers share the same model.
//   - Refresh score snapshot: recomputes bjl_public_scores from
//     bjl_responses (~45s background job, preserves public_safe).
const PublicCorpusOpsButtons = () => {
  const [running, setRunning] = useState(null);  // 'embed_incremental' | 'embed_force' | 'refresh' | null
  const [lastResult, setLastResult] = useState(null);

  const runEmbed = async (mode) => {
    setRunning(mode === 'force_all' ? 'embed_force' : 'embed_incremental');
    setLastResult(null);
    try {
      const r = await fetch('/.netlify/functions/bjl-embed-public-corpus', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode }),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || j.message || `embed failed (${r.status})`);
      setLastResult({ kind: 'embed', mode, ...j });
    } catch (err) {
      setLastResult({ kind: 'error', error: String(err.message || err) });
    } finally {
      setRunning(null);
    }
  };

  const runRefresh = async () => {
    setRunning('refresh');
    setLastResult(null);
    try {
      const r = await fetch('/.netlify/functions/bjl-refresh-public-scores', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || `refresh failed (${r.status})`);
      setLastResult({ kind: 'refresh', ...j });
    } catch (err) {
      setLastResult({ kind: 'error', error: String(err.message || err) });
    } finally {
      setRunning(null);
    }
  };

  return (
    <div className="public-corpus-ops">
      <button className="btn ghost" disabled={!!running} onClick={() => runEmbed('incremental')}
              title="Embed any rows missing vectors (insights, verbatim truths, laws)">
        {running === 'embed_incremental' ? 'Embedding…' : 'Populate embeddings'}
      </button>
      <button className="btn ghost" disabled={!!running} onClick={() => runEmbed('force_all')}
              title="Re-embed ALL rows. Use once to standardize laws on text-embedding-3-small.">
        {running === 'embed_force' ? 'Re-embedding all…' : 'Re-embed all'}
      </button>
      <button className="btn ghost" disabled={!!running} onClick={runRefresh}
              title="Recompute bjl_public_scores from bjl_responses. Runs in background (~60s).">
        {running === 'refresh' ? 'Refreshing…' : 'Refresh scores'}
      </button>
      {lastResult && lastResult.kind === 'embed' && (
        <span className="public-corpus-ops-result">
          {Object.entries(lastResult.results || {}).map(([t, r]) => `${t}: ${r.embedded} embedded`).join(' · ')}
        </span>
      )}
      {lastResult && lastResult.kind === 'refresh' && (
        <span className="public-corpus-ops-result">{lastResult.message || 'Refresh dispatched.'}</span>
      )}
      {lastResult && lastResult.kind === 'error' && (
        <span className="public-corpus-ops-result error">{lastResult.error}</span>
      )}
    </div>
  );
};

/* -------------------------------------------------------------------------
 * BlockView + SaveToProjectButton
 * -------------------------------------------------------------------------
 * The Intelligence pane renders each insight block as a card with a
 * "Save to project" button. Blocks come from the synth output's blocks[]
 * field (persisted in the structured_synth_output scratch meta entry).
 * Save flow: click -> if no active project, prompt to pick or create ->
 * POST bjl-project-cards with the block + full structured payload as
 * provenance.
 * ------------------------------------------------------------------------- */

const BlockView = ({ block, blockIndex, structured, jobId, question, activeProjectId, projects, onSaved, onNeedProject }) => {
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState(null);

  if (!block || !block.claim) return null;

  const evidence = Array.isArray(block.evidence) ? block.evidence : [];

  const save = async () => {
    if (!activeProjectId) { onNeedProject && onNeedProject(); return; }
    setSaving(true); setError(null);
    try {
      const card = await saveProjectCardApi({
        project_id:         activeProjectId,
        claim:              block.claim,
        frame:              block.frame || null,
        evidence:           evidence,
        implication:        block.implication || null,
        provenance:         structured || null,
        source_job_id:      jobId || null,
        source_block_index: Number.isFinite(blockIndex) ? blockIndex : null,
        source_question:    question || null,
      });
      setSaved(true);
      onSaved && onSaved(card);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSaving(false);
    }
  };

  const activeProject = (projects || []).find(p => p.id === activeProjectId) || null;

  return (
    <div className="block-view">
      <div className="block-claim">{block.claim}</div>
      {block.frame && <div className="block-frame">{block.frame}</div>}
      {evidence.length > 0 && (
        <ul className="block-evidence">
          {evidence.map((line, i) => (
            <li key={i}>{typeof line === 'string' ? line : JSON.stringify(line)}</li>
          ))}
        </ul>
      )}
      {block.implication && <div className="block-implication">{block.implication}</div>}
      <div className="block-actions">
        {saved ? (
          <span className="block-saved-note">Saved to {activeProject ? activeProject.name : 'project'}.</span>
        ) : (
          <button className="btn ghost block-save-btn"
            onClick={save}
            disabled={saving}
            title={activeProjectId ? `Save this insight to ${activeProject ? activeProject.name : 'the active project'}` : 'Pick a project first'}>
            {saving ? 'Saving…' : (activeProjectId ? 'Save to project' : 'Save to project…')}
          </button>
        )}
        {error && <span className="block-save-error">{error}</span>}
      </div>
    </div>
  );
};

const PromoteToPublicButton = ({ defaults, label }) => {
  const [open, setOpen] = useState(false);
  const [draft, setDraft] = useState(defaults || {});
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => { if (open) setDraft(defaults || {}); }, [open, defaults]);

  const submit = async () => {
    setSubmitting(true); setError(null);
    try {
      const r = await fetch('/.netlify/functions/bjl-public-promote', authedFetchInit({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(draft),
      }));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || `promote failed (${r.status})`);
      setDone(j);
    } catch (err) { setError(String(err.message || err)); }
    finally { setSubmitting(false); }

  return (
    <>
      <button className="btn ghost public-promote-trigger" onClick={() => { setOpen(true); setDone(null); }} title="Stage as a public insight (review before going live)">

              <>

                    ? <>A staged insight with slug <code>{done.slug}</code> already existed. Edit it in the Public Corpus pane before publishing.</>

                <div className="public-promote-actions">
                  <button className="btn primary" onClick={() => setOpen(false)}>Close</button>
                </div>
              </>
            ) : (
              <>
                <h3>Publish to public</h3>
                <p className="public-promote-help">Stage this finding as a public insight. It will land at <code>published=false</code> and won't appear in the public chat until you flip it live in the Public Corpus pane.</p>
                <label>Title (the argument-winning headline)
                  <input type="text" value={draft.title || ''} onChange={(e) => setDraft({ ...draft, title: e.target.value })} />
                </label>
                <label>Insight (plain-English finding)
                  <textarea rows={4} value={draft.insight || ''} onChange={(e) => setDraft({ ...draft, insight: e.target.value })} />
                </label>
                <label>Stat (supporting number)
                  <textarea rows={2} value={draft.stat || ''} onChange={(e) => setDraft({ ...draft, stat: e.target.value })} />

                <div className="public-insight-edit-row">
                  <label>Category <input type="text" value={draft.category || ''} onChange={(e) => setDraft({ ...draft, category: e.target.value })} /></label>
                  <label>Confidence
                    <select value={draft.confidence || 'high'} onChange={(e) => setDraft({ ...draft, confidence: e.target.value })}>
                      <option value="high">high</option><option value="medium">medium</option>
                    </select>
                  </label>
                  <label>n <input type="number" value={draft.source_n || ''} onChange={(e) => setDraft({ ...draft, source_n: e.target.value ? Number(e.target.value) : null })} /></label>
                </div>
                <label>Topic tags (comma-separated)
                  <input type="text" value={(draft.topic_tags || []).join(', ')} onChange={(e) => setDraft({ ...draft, topic_tags: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })} />
                </label>
                <label>Question framings (one per line — used for retrieval matching)
                  <textarea rows={3} value={(draft.question_framings || []).join('\n')} onChange={(e) => setDraft({ ...draft, question_framings: e.target.value.split('\n').map(s => s.trim()).filter(Boolean) })} />
                </label>
                <label>Source note
                  <textarea rows={2} value={draft.source_note || ''} onChange={(e) => setDraft({ ...draft, source_note: e.target.value })} />
                </label>
                {error && <div className="joy-map-error">Error: {error}</div>}
                <div className="public-promote-actions">
                  <button className="btn primary" disabled={submitting || !draft.title || !draft.insight || !draft.category} onClick={submit}>
                    {submitting ? 'Staging…' : 'Stage this insight'}
                  </button>
                  <button className="btn ghost" onClick={() => setOpen(false)}>Cancel</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </>
  );
};


/* =========================================================================
 * 13. App root — shell + mode switching + shared state.
 * ========================================================================= */
const WelcomeModal = ({ onDismiss }) => (
  <div className="welcome-overlay" onClick={onDismiss}>
    <div className="welcome-modal" onClick={(e) => e.stopPropagation()}>
      <img src="assets/bjl-logo.png" alt="Brand Joy Lab" className="welcome-logo" />
      <h1 className="welcome-title">Welcome to the Brand Joy Lab.</h1>
      <p className="welcome-subtitle">Built for the curious.</p>
      <button className="btn primary welcome-cta" onClick={onDismiss}>Let's go</button>
    </div>
  </div>
);

const App = ({ authedUser = null, onSignOut = null } = {}) => {
  const [mode, setMode] = useState(() => {
    const saved = localStorage.getItem("bjl_mode_v2");
    // Outreach was removed from the nav on 2026-07-21. Any localStorage
    // that still holds "outreach" or the older "batch" value redirects
    // to intelligence so the user lands on a valid pane.
    if (saved === "batch" || saved === "outreach") return "intelligence";
    return saved || "intelligence";
  });
  const [drawerOpen, setDrawerOpen] = useState(true);
  const [drawerFilter, setDrawerFilter] = useState("all");
  const [evidenceRows, setEvidenceRows] = useState([]);
  const [strategistContext, setStrategistContext] = useState("");
  // Session key: incrementing this forces the active mode component to remount,
  // wiping its local state (conversation turns, loaded Waldo files, draft
  // results, etc.) without lifting every piece of state into App.
  const [sessionKey, setSessionKey] = useState(0);

  // Projects state lives at App level so both the Intelligence pane and
  // the Projects pane read from one source. Previously each pane owned
  // its own copy; the Intelligence pane's copy failed to populate on
  // fresh page loads (auth-timing race on the first fetch), and only
  // repaired when the user visited Projects and back (remount refetch).
  // Hoisting fixes that: App fetches once, retries once on failure, and
  // hands the same data to every consumer.
  const [projects, setProjects] = useState([]);
  const [activeProjectId, setActiveProjectIdState] = useState(() => getActiveProjectId());
  const [projectsError, setProjectsError] = useState(null);
  const [projectCards, setProjectCards] = useState([]);
  const [projectCardsLoading, setProjectCardsLoading] = useState(false);

  const refreshProjects = useCallback(async () => {
    try {
      const list = await fetchProjects(false);
      setProjects(list);
      setProjectsError(null);
      return list;
    } catch (e) {
      setProjectsError(String(e.message || e));
      return null;
    }
  }, []);

  const refreshProjectCards = useCallback(async (projectId) => {
    if (!projectId) { setProjectCards([]); return; }
    setProjectCardsLoading(true);
    try { setProjectCards(await fetchProjectCards(projectId)); }
    catch (e) { setProjectsError(String(e.message || e)); }
    finally { setProjectCardsLoading(false); }
  }, []);

  const selectProject = useCallback((id) => {
    setActiveProjectIdState(id);
    setActiveProjectId(id);
    refreshProjectCards(id);
  }, [refreshProjectCards]);

  // Initial fetch on App mount. If the first attempt fails (typical
  // failure: auth token not yet initialized), retry once after 800 ms
  // so a slow auth boot doesn't leave projects empty for the whole
  // session. A single retry is enough; a persistent failure means
  // something structural is broken and the strategist will see the
  // error surface elsewhere.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const first = await refreshProjects();
      if (cancelled) return;
      if (first === null) {
        await new Promise(res => setTimeout(res, 800));
        if (!cancelled) await refreshProjects();
      }
    })();
    return () => { cancelled = true; };
  }, [refreshProjects]);

  // Refresh saved cards when active project changes.
  useEffect(() => { refreshProjectCards(activeProjectId); }, [activeProjectId, refreshProjectCards]);
  const newSession = () => {
    // Hard reset via full page navigation to a clean URL. The prior
    // soft-reset (writeSessionToUrl(null) + writeSessionLocal(null, [])
    // + remount via key bump) was reliable in isolation but did not
    // survive real-world edge cases — a stale HTML/JS cache, an
    // in-flight fetch that resolved after the wipe and re-mirrored the
    // prior turns, or a service-worker-style intermediary — could all
    // leak the prior conversation back into the fresh state. Navigating
    // to a clean URL kills every path: the React tree is discarded, all
    // timers and closures are gone, and the mount effect runs on a
    // truly fresh page with an empty URL and empty localStorage.
    try {
      window.localStorage.removeItem("bjl.session.intelligence");
    } catch (_) { /* localStorage may be unavailable in some embed contexts */ }
    const cleanUrl = window.location.origin + window.location.pathname;
    window.location.replace(cleanUrl);
  };
  // Welcome modal shows on every page load (refresh / new tab). It is NOT
  // shown when the user clicks "New session" — that button is an in-tool
  // soft reset and doesn't trigger a reload, so no persistence is needed.
  const [showWelcome, setShowWelcome] = useState(true);
  const dismissWelcome = () => setShowWelcome(false);

  useEffect(() => { localStorage.setItem("bjl_mode_v2", mode); }, [mode]);

  // Outreach was removed from the nav on 2026-07-21. Migrate any lingering
  // "batch" or "outreach" mode state to intelligence so setMode never leaves
  // us on a pane that no longer renders.
  useEffect(() => {
    if (mode === "batch" || mode === "outreach") setMode("intelligence");
  }, [mode]);

  // Keep-warm: ping /api/claude on mount so the function is hot when the user acts
  useEffect(() => {
    fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1, messages: [{ role: "user", content: "." }] }),
    }).catch(() => {});
  }, []);

  const crumbs = {
    intelligence:  ["Workbench", "Intelligence engine", "Ask the Lab"],
    joy_map:       ["Workbench", "Joy Map"],
    public_corpus: ["Workbench", "Projects"],
    analytics:     ["Workbench", "Analytics", "Public chat"],
    connections:   ["Workbench", "Connections", "beta"],
  }[mode] || ["Workbench"];

  const showDrawer = drawerOpen && mode !== "joy_map" && mode !== "public_corpus" && mode !== "analytics" && mode !== "connections";

  return (
    <div className="app" data-screen-label={`BJL · ${mode}`}>
      <Rail mode={mode} setMode={setMode} authedUser={authedUser} />
      <div className="main">
        <TopBar
          crumbs={crumbs}
          actions={
            <>
              {mode === "intelligence" && (
                <button className="btn ghost" onClick={() => setDrawerOpen(!drawerOpen)}>
                  <Icon name="evidence" size={13} />{drawerOpen ? "Hide evidence" : "Show evidence"}
                </button>
              )}
              <button className="btn" onClick={newSession}>
                <Icon name="plus" size={12} /> New session
              </button>
              <button className="btn ghost icon-only" title="About the Lab"
                onClick={() => setShowWelcome(true)}>?</button>
              {authedUser && (
                <div className="bjl-user-menu" title={authedUser.email}>
                  <span className="bjl-user-email">{authedUser.email}</span>
                  {onSignOut && (
                    <button className="btn ghost bjl-user-signout" onClick={onSignOut}>Sign out</button>
                  )}
                </div>
              )}
            </>
          }
        />
        <div className={`body ${showDrawer ? "" : "no-drawer"}`}>
          <div style={{overflow: "hidden", minHeight: 0, display: "flex", flexDirection: "column"}}>
            {mode === "intelligence" && <IntelligenceMode
              key={`intel-${sessionKey}`}
              setEvidenceRows={setEvidenceRows}
              strategistContext={strategistContext}
              setStrategistContext={setStrategistContext}
              projects={projects}
              activeProjectId={activeProjectId}
              selectProject={selectProject}
              refreshProjects={refreshProjects}
              projectCards={projectCards}
              projectCardsLoading={projectCardsLoading}
              refreshProjectCards={refreshProjectCards}
              setProjects={setProjects} />}
            {mode === "joy_map" && <JoyMapMode
              key={`joymap-${sessionKey}`} />}
            {mode === "public_corpus" && <ProjectsMode
              key={`projects-${sessionKey}`}
              setMode={setMode}
              setStrategistContext={setStrategistContext}
              projects={projects}
              activeProjectId={activeProjectId}
              selectProject={selectProject}
              refreshProjects={refreshProjects}
              setProjects={setProjects} />}
            {mode === "analytics" && <AnalyticsMode
              key={`analytics-${sessionKey}`} />}
            {mode === "connections" && isConnectionsBetaEnabled(authedUser?.email) && <ConnectionsBetaMode
              key={`connections-${sessionKey}`} />}
          </div>
          {showDrawer && <EvidenceDrawer rows={evidenceRows} filter={drawerFilter} onFilter={setDrawerFilter} />}
        </div>
      </div>
      {showWelcome && <WelcomeModal onDismiss={dismissWelcome} />}
    </div>
  );
};

/* =========================================================================
 * AuthGate — Microsoft 365 SSO via Supabase Auth.
 *
 * Wraps <App />. On boot:
 *   1. fetch /api/bjl-config → { supabaseUrl, supabaseAnonKey, authEnforced }
 *   2. if authEnforced is false (pre-Azure-live), render App directly.
 *   3. otherwise initialize Supabase client, check existing session,
 *      render LoginScreen / RejectedScreen / App accordingly.
 *
 * Exposes window.__bjlAuth = { getToken, signOut, user, enforced } so the
 * existing fetch helpers (authedFetchInit) can attach Bearer tokens. Also
 * exposes window.__bjlRejected(email) so functions can flip the user to
 * the rejected screen if a 403 not_whitelisted comes back from the API
 * (covers the case where MS auth succeeds but the email isn't whitelisted).
 * ========================================================================= */

const LoginScreen = ({ onSignIn, signingIn }) => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <img src="assets/bjl-logo.png" alt="Brand Joy Lab" className="bjl-auth-logo" />
      <h1 className="bjl-auth-title">Welcome to the Brand Joy Lab.</h1>
      <p className="bjl-auth-subtitle">Sign in with your PETERMAYER Microsoft account to continue.</p>
      <button
        className="btn primary bjl-auth-cta"
        onClick={onSignIn}
        disabled={signingIn}
      >
        {signingIn ? "Redirecting…" : "Sign in with Microsoft"}
      </button>
    </div>
  </div>
);

const RejectedScreen = ({ email, onRetry }) => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <h1 className="bjl-auth-title">Access not authorized</h1>
      <p className="bjl-auth-subtitle">
        You're signed in as <strong>{email || "(unknown)"}</strong>, but this email isn't on the BJL Intelligence Engine whitelist.
      </p>
      <p className="bjl-auth-subtitle">
        Contact Eli at <a href="mailto:haddowe@peteramayer.com">haddowe@peteramayer.com</a> to request access.
      </p>
      <button className="btn ghost bjl-auth-cta" onClick={onRetry}>Sign out and try a different account</button>
    </div>
  </div>
);

const AuthLoadingScreen = () => (
  <div className="bjl-auth-shell">
    <div className="bjl-auth-card">
      <img src="assets/bjl-logo.png" alt="Brand Joy Lab" className="bjl-auth-logo" />
      <p className="bjl-auth-subtitle">Loading…</p>
    </div>
  </div>
);

const AuthGate = () => {
  const [config, setConfig] = useState(null);
  const [client, setClient] = useState(null);
  const [session, setSession] = useState(null);
  // authState: 'loading' | 'login' | 'authed' | 'rejected'
  const [authState, setAuthState] = useState("loading");
  const [rejectedEmail, setRejectedEmail] = useState(null);
  const [signingIn, setSigningIn] = useState(false);

  // Boot: load config, init client, hydrate session
  useEffect(() => {
    let cancelled = false;
    fetch("/api/bjl-config", { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((cfg) => {
        if (cancelled) return;
        if (!cfg) {
          // Config endpoint failed — fall through to authed=true to preserve
          // legacy behavior. The function-level gate is the real enforcement
          // layer; if AUTH_ENFORCED=true on the server, the user will get
          // a 401 from the API and signOut will fire.
          console.warn("[AuthGate] /api/bjl-config failed; falling back to authed=true");
          setConfig({ authEnforced: false });
          setAuthState("authed");
          return;
        }
        setConfig(cfg);

        // Pre-Azure-live: AUTH_ENFORCED is not set. Skip the gate entirely.
        if (!cfg.authEnforced) {
          setAuthState("authed");
          return;
        }

        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase || !window.supabase.createClient) {
          console.error("[AuthGate] missing supabase config or library; cannot enforce auth");
          setAuthState("login");
          return;
        }
        const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        setClient(sb);
        sb.auth.getSession().then(({ data }) => {
          if (cancelled) return;
          if (data && data.session) {
            setSession(data.session);
            setAuthState("authed");
          } else {
            setAuthState("login");
          }
        });
        sb.auth.onAuthStateChange((event, sess) => {
          if (sess) {
            setSession(sess);
            setAuthState((prev) => (prev === "rejected" ? "rejected" : "authed"));
          } else {
            setSession(null);
            setAuthState("login");
          }
        });
      })
      .catch((e) => {
        console.error("[AuthGate] boot threw:", e);
        if (!cancelled) setAuthState("login");
      });
    return () => { cancelled = true; };
  }, []);

  const signIn = useCallback(() => {
    if (!client) return;
    setSigningIn(true);
    client.auth.signInWithOAuth({
      provider: "azure",
      options: {
        scopes: "openid email profile",
        redirectTo: window.location.origin,
      },
    });
  }, [client]);

  const signOut = useCallback(async () => {
    setRejectedEmail(null);
    if (client) {
      try { await client.auth.signOut(); } catch (e) { console.warn("[AuthGate] signOut threw:", e); }
    }
    setSession(null);
    setAuthState("login");
  }, [client]);

  // Expose globals for the fetch helpers to read at call time.
  useEffect(() => {
    window.__bjlAuth = {
      getToken: () => (session && session.access_token) || null,
      // Force a fresh session read from the Supabase client. Callers
      // that need to be certain the token is current (e.g. the beta
      // pane, which sees users idle long enough for tokens to lapse)
      // await this immediately before invoke. Returns the refreshed
      // access token, or null if the session is gone. Also updates
      // the React session state so subsequent authedFetchInit reads
      // pick up the new token.
      getSession: async () => {
        if (!client) return null;
        try {
          const { data } = await client.auth.getSession();
          const fresh = (data && data.session) || null;
          if (fresh) setSession(fresh);
          return (fresh && fresh.access_token) || null;
        } catch (e) {
          console.warn("[__bjlAuth.getSession] refresh threw:", e);
          return null;
        }
      },
      signOut,
      user: session && session.user ? {
        id: session.user.id,
        email: session.user.email,
        name: (session.user.user_metadata && session.user.user_metadata.name) || null
      } : null,
      enforced: !!(config && config.authEnforced),
    };
    window.__bjlRejected = (email) => {
      setRejectedEmail(email);
      setAuthState("rejected");
    };
    return () => {
      // Cleanup on unmount only (component lives for the page lifetime)
    };
  }, [session, signOut, config]);

  if (authState === "loading") return <AuthLoadingScreen />;
  if (authState === "rejected") return <RejectedScreen email={rejectedEmail} onRetry={signOut} />;
  if (authState === "login") return <LoginScreen onSignIn={signIn} signingIn={signingIn} />;

  // authed — render the main app, passing user info + sign-out
  const user = (session && session.user) ? {
    id: session.user.id,
    email: session.user.email,
    name: (session.user.user_metadata && session.user.user_metadata.name) || null
  } : null;
  return <App authedUser={user} onSignOut={config && config.authEnforced ? signOut : null} />;
};

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);
  </script>
</body>
</html>
