[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions.claude]
  timeout = 26

[functions.bjl-query]
  timeout = 26

[functions.bjl-query-status]
  timeout = 26

# Background function — Netlify gives any function whose filename ends with
# -background.js a 15-minute timeout automatically. No included_files
# declaration: the prompt and schema content is bundled via require() of
# netlify/functions/_prompts_bundle.json (generated by
# bin/build_prompts_bundle.js). esbuild inlines JSON requires reliably;
# included_files is silently ignored under the esbuild bundler.

[context.production.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from = "/api/bjl-query"
  to = "/.netlify/functions/bjl-query"
  status = 200

[[redirects]]
  from = "/api/bjl-query-status"
  to = "/.netlify/functions/bjl-query-status"
  status = 200

[[redirects]]
  from = "/api/bjl-config"
  to = "/.netlify/functions/bjl-config"
  status = 200

[[redirects]]
  from = "/api/bjl-content"
  to = "/.netlify/functions/bjl-content"
  status = 200

[[redirects]]
  from = "/api/bjl-approve-email"
  to = "/.netlify/functions/bjl-approve-email"
  status = 200

# ---------------------------------------------------------------------
# v6 — Public Joy Lab Chat
# ---------------------------------------------------------------------
# The chat surface (public-chat.html) is embedded as an iframe inside
# peteramayer.com (Peter A. Mayer Advertising — Webflow site). The
# middle "a" is intentional and matches the joylab.peteramayer.com
# subdomain hosting the Netlify deploy. For cross-origin iframe to work:
#   - frame-ancestors must allow peteramayer.com (apex + www) and the
#     joylab host itself (for direct visits / preview).
#   - The bjl-public-chat function emits CORS headers itself (per-route
#     because Allow-Origin must reflect the request origin).

[[headers]]
  for = "/public-chat.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://peteramayer.com https://www.peteramayer.com"
    X-Content-Type-Options  = "nosniff"

# The Webflow embed lands as: <iframe src="https://<joylab>/public-chat.html">
[[redirects]]
  from = "/api/bjl-public-chat"
  to = "/.netlify/functions/bjl-public-chat"
  status = 200

[[redirects]]
  from = "/api/bjl-public-promote"
  to = "/.netlify/functions/bjl-public-promote"
  status = 200

[[redirects]]
  from = "/api/bjl-public-corpus"
  to = "/.netlify/functions/bjl-public-corpus"
  status = 200
