[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions.claude]
  timeout = 26

[functions.bjl-query]
  timeout = 26

[functions.bjl-query-status]
  timeout = 26

# 2026-08-10: measured, not assumed. Fully-warm back-to-back joy map runs
# were 12.0s and 9.1s wall clock, of which ~8.5s is the DB (sweep_v2 3.7s +
# modeled 4.9s, honest timings — count(s.*) not count(*), or the planner
# prunes the expensive columns and reports a fake 19ms). That leaves real
# headroom under 26s today, but the margin is thin enough that a slow DB
# day pushes it over the platform default. Without this block the function
# inherits the default and the client sees a gateway HTML page instead of
# JSON; the readJsonResponse guard added in 8c3c9d3 renders that as
# "warming up" rather than a raw parse error, but a rendered stall is still
# a stall. Cheap insurance, not a fix — the fix is the query.
[functions.bjl-joy-map-connections]
  timeout = 26

# Background function — Netlify gives any function whose filename ends with
# -background.js a 15-minute timeout automatically. No included_files
# declaration: the prompt and schema content is bundled via require() of
# netlify/functions/_prompts_bundle.json (generated by
# bin/build_prompts_bundle.js). esbuild inlines JSON requires reliably;
# included_files is silently ignored under the esbuild bundler.

[context.production.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from = "/api/bjl-query"
  to = "/.netlify/functions/bjl-query"
  status = 200

[[redirects]]
  from = "/api/bjl-query-status"
  to = "/.netlify/functions/bjl-query-status"
  status = 200

[[redirects]]
  from = "/api/bjl-config"
  to = "/.netlify/functions/bjl-config"
  status = 200

[[redirects]]
  from = "/api/bjl-content"
  to = "/.netlify/functions/bjl-content"
  status = 200

[[redirects]]
  from = "/api/bjl-approve-email"
  to = "/.netlify/functions/bjl-approve-email"
  status = 200

# ---------------------------------------------------------------------
# v6 — Public Joy Lab Chat
# ---------------------------------------------------------------------
# The chat surface (public-chat.html) is embedded as an iframe inside
# peteramayer.com (Peter A. Mayer Advertising — Webflow site). The
# middle "a" is intentional and matches the joylab.peteramayer.com
# subdomain hosting the Netlify deploy. For cross-origin iframe to work:
#   - frame-ancestors must allow peteramayer.com (apex + www) and the
#     joylab host itself (for direct visits / preview).
#   - The bjl-public-chat function emits CORS headers itself (per-route
#     because Allow-Origin must reflect the request origin).

[[headers]]
  for = "/public-chat.html"
  [headers.values]
    # v6.11: added https://petermayer.webflow.io (no "a") so the team can
    # QA the embed on Webflow's staging URL before publishing to the
    # production peteramayer.com domain (with "a"). The Webflow staging
    # subdomain naming drops the agency's middle "a" — that's a Webflow
    # quirk, not a typo. Keep this entry while staging-side QA is active;
    # tighten back to peteramayer.com-only at launch if desired.
    # v7.5: added https://hello.peteramayer.com so the agency-landing
    # surface can iframe the chat. Paired with the postMessage + URL-?q=
    # autofire support in public-chat.html.
    Content-Security-Policy = "frame-ancestors 'self' https://peteramayer.com https://www.peteramayer.com https://petermayer.webflow.io https://hello.peteramayer.com"
    X-Content-Type-Options  = "nosniff"

# joylab.peteramayer.com/ask — the memorable public URL. Netlify serves
# public-chat.html at this path with status 200 (rewrite, not redirect),
# so the address bar stays on /ask while the file served is the existing
# public chat surface. Query params (?q=... for autofire) pass through
# unchanged.
[[redirects]]
  from = "/ask"
  to = "/public-chat.html"
  status = 200

# Same CSP + no-sniff on the /ask path. Netlify applies [[headers]] to the
# REQUEST path, not the served file, so a direct hit or an iframe embed at
# /ask needs its own header block; without this the frame-ancestors rule
# wouldn't apply on the memorable URL.
[[headers]]
  for = "/ask"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://peteramayer.com https://www.peteramayer.com https://petermayer.webflow.io https://hello.peteramayer.com"
    X-Content-Type-Options  = "nosniff"

# The Webflow embed lands as: <iframe src="https://joylab.peteramayer.com/ask">
# (Direct URL joylab.peteramayer.com/public-chat.html still works for
# backward compatibility with existing embeds.)
[[redirects]]
  from = "/api/bjl-public-chat"
  to = "/.netlify/functions/bjl-public-chat"
  status = 200

[[redirects]]
  from = "/api/bjl-public-promote"
  to = "/.netlify/functions/bjl-public-promote"
  status = 200

[[redirects]]
  from = "/api/bjl-public-corpus"
  to = "/.netlify/functions/bjl-public-corpus"
  status = 200

# v6.6 — public-facing lead capture (submit + decline). No auth.
[[redirects]]
  from = "/api/bjl-public-capture-lead"
  to = "/.netlify/functions/bjl-public-capture-lead"
  status = 200
